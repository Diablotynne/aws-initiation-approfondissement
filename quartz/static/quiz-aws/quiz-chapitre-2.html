<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz interactif — Chapitre 2</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;background:#111827;color:#eef4fb}.quiz{max-width:860px;margin:auto;padding:1.2rem}.top{display:flex;justify-content:space-between;gap:1rem;color:#9fb2c8}.bar{height:7px;background:#2d3b4e;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#ff9900;transition:width .25s}.card{margin-top:1rem;padding:1.25rem;border:1px solid #40516a;border-radius:14px;background:#182337}.card h2{font-size:1.15rem;color:#ffb347}.prompt{font-size:1.05rem;line-height:1.5}.options{display:grid;gap:.65rem}.option{width:100%;padding:.8rem 1rem;text-align:left;border:1px solid #52657e;border-radius:10px;background:#223149;color:#fff;cursor:pointer}.option:hover{border-color:#ff9900}.option.selected{outline:2px solid #ff9900}.option.correct{border-color:#43d17e;background:#123827}.option.wrong{border-color:#ff637d;background:#401c27}.option:disabled{cursor:default}.feedback{display:none;margin-top:1rem;padding:1rem;border-radius:10px;line-height:1.5}.feedback.show{display:block}.feedback.ok{background:#123827}.feedback.ko{background:#401c27}.next,.validate{display:none;margin-top:1rem;padding:.7rem 1.1rem;border:0;border-radius:9px;background:#ff9900;color:#111;font-weight:700;cursor:pointer}.next.show,.validate.show{display:inline-block}.result{text-align:center;padding:2rem}.restart{padding:.75rem 1rem;border:0;border-radius:9px;background:#ff9900;font-weight:700;cursor:pointer}
</style></head><body><main class="quiz" aria-live="polite"><div class="top"><strong>Chapitre 2</strong><span id="progress"></span></div><div class="bar"><span id="bar"></span></div><section class="card" id="card"></section></main>
<script>
const questions=[{"number": 1, "title": "Évaluation des permissions IAM", "prompt": "Un utilisateur IAM possède les éléments suivants : - Une policy de groupe qui autorise ec2:TerminateInstances - Une policy inline qui refuse ec2:TerminateInstances - Une SCP Organizations qui autorise ec2:TerminateInstances Que se passe-t-il lorsque cet utilisateur tente de terminer une instance EC2 ?", "options": [{"key": "A", "text": "L'action est autorisée car la policy de groupe a la priorité sur les policies inline."}, {"key": "B", "text": "L'action est refusée car le Deny explicite (policy inline) l'emporte sur tous les Allow."}, {"key": "C", "text": "L'action est autorisée car la SCP Organizations approuve l'action."}, {"key": "D", "text": "L'action est autorisée car deux sources autorisent l'action contre une seule qui la refuse."}], "correct": ["B"], "explanation": "Un Deny explicite l'emporte toujours sur tout Allow, quelle que soit la source (policy de groupe, policy inline, SCP, resource-based policy). C'est la règle fondamentale d'évaluation IAM. L'ordre d'évaluation AWS est : 1. Deny explicite → REFUS IMMÉDIAT** 2. SCP Organizations 3. Resource-based Policy 4. Identity-based Policy 5. Permissions Boundary 6. Session Policy 7. Aucune règle → Deny implicite La réponse A est fausse : il n'existe pas de hiérarchie entre types de policies pour les Allow/Deny. La réponse C est fausse : la SCP autorise mais ne prime pas sur un Deny explicite IAM. La réponse D est fausse : le vote à la majorité n'existe pas dans IAM."}, {"number": 2, "title": "Méthode MFA déconseillée", "prompt": "Parmi les types de MFA supportés par AWS IAM, lequel AWS déconseille-t-il explicitement dans sa documentation de bonnes pratiques ?", "options": [{"key": "A", "text": "Virtual MFA (Google Authenticator, Authy)"}, {"key": "B", "text": "Hardware TOTP (token physique Gemalto)"}, {"key": "C", "text": "FIDO2 Security Key (YubiKey, Titan Key)"}, {"key": "D", "text": "SMS (message texte sur téléphone mobile)"}], "correct": ["D"], "explanation": "AWS déconseille explicitement le MFA par SMS. Deux raisons principales : 1. Vulnérabilité SS7 : le protocole de signalisation des réseaux téléphoniques peut être exploité pour intercepter les SMS. 2. SIM swapping** : un attaquant peut convaincre un opérateur de transférer votre numéro vers une nouvelle SIM. AWS recommande Virtual MFA (A) ou FIDO2 Security Key (C) pour la grande majorité des cas, et Hardware TOTP (B) pour les comptes très sensibles (root, administrateurs). Les trois sont des méthodes recommandées."}, {"number": 3, "title": "Format d'un ARN IAM", "prompt": "Parmi les ARN suivants, lequel représente correctement un utilisateur IAM nommé stagiaire-demo dans le compte AWS 123456789012 ?", "options": [{"key": "A", "text": "arn:aws:iam:eu-west-3:123456789012:user/stagiaire-demo"}, {"key": "B", "text": "arn:aws:iam::123456789012:user/stagiaire-demo"}, {"key": "C", "text": "arn:aws:iam::123456789012:users/stagiaire-demo"}, {"key": "D", "text": "arn:aws:ec2:eu-west-3:123456789012:iam/user/stagiaire-demo"}], "correct": ["B"], "explanation": "arn:aws:iam::123456789012:user/stagiaire-demo Points clés : - IAM est un service global → la région est vide** (double :: entre aws et l'account ID) - Le type de ressource est user (singulier), pas users (réponse C incorrecte) - Le service est iam, pas ec2 (réponse D incorrecte) - La réponse A est incorrecte car elle inclut eu-west-3 — IAM n'a pas de région dans les ARNs Structure correcte : arn:partition:service:region:account-id:resource-type/resource-id"}, {"number": 4, "title": "IAM Role vs IAM User", "prompt": "Laquelle des affirmations suivantes décrit le mieux la différence entre un IAM Role et un IAM User ?", "options": [{"key": "A", "text": "Un IAM Role est utilisé uniquement par des services AWS internes, jamais par des humains."}, {"key": "B", "text": "Un IAM Role possède des credentials permanents (Access Key ID + Secret), tandis qu'un IAM User utilise des credentials temporaires."}, {"key": "C", "text": "Un IAM Role génère des credentials temporaires via STS et peut être assumé par des services, des comptes tiers ou des utilisateurs fédérés, sans credentials permanents attachés."}, {"key": "D", "text": "Un IAM Role est équivalent à un IAM User mais avec des droits limités dans le temps par une date d'expiration obligatoire."}], "correct": ["C"], "explanation": "Un IAM Role génère des credentials temporaires** via AWS STS (Security Token Service), valides de 15 minutes à 12 heures selon la configuration. Il n'a pas de credentials permanents attachés. La réponse A est fausse : les rôles peuvent être assumés par des humains (ex: via IAM Identity Center ou switch role console). La réponse B inverse la réalité : c'est le Role qui a des credentials temporaires, pas le User. La réponse D est fausse : un role n'a pas de date d'expiration propre, c'est la session STS qui a une durée limitée."}, {"number": 5, "title": "Service d'audit des API calls", "prompt": "FormaTech souhaite savoir qui a supprimé une instance RDS hier à 14h37, depuis quelle adresse IP et avec quel outil (Console, CLI, SDK). Quel service AWS permet de retrouver cette information ?", "options": [{"key": "A", "text": "Amazon CloudWatch Logs"}, {"key": "B", "text": "AWS Config"}, {"key": "C", "text": "AWS CloudTrail"}, {"key": "D", "text": "Amazon GuardDuty"}], "correct": ["C"], "explanation": "AWS CloudTrail** est le service d'audit des API calls. Il enregistre chaque appel API avec : qui (ARN de l'utilisateur), quoi (nom de l'action), quand (timestamp UTC), depuis où (adresse IP source), avec quel outil (User-Agent). - CloudWatch Logs (A) est pour les logs applicatifs et système, pas pour l'audit des appels API AWS. - AWS Config (B) enregistre l'état des ressources et leurs changements de configuration, pas les appels API. - GuardDuty (D) détecte les menaces intelligemment mais se base sur les logs CloudTrail — ce n'est pas la source primaire d'audit."}, {"number": 6, "title": "Secrets Manager vs Parameter Store", "prompt": "L'équipe d'exploitation hésite entre AWS Secrets Manager et AWS Systems Manager Parameter Store pour stocker le mot de passe de la base de données RDS de l'entreprise fil rouge. Quelle affirmation est exacte ?", "options": [{"key": "A", "text": "Parameter Store supporte la rotation automatique des secrets RDS nativement, sans configuration supplémentaire."}, {"key": "B", "text": "Secrets Manager est gratuit pour les secrets standard, Parameter Store est payant pour tous les paramètres."}, {"key": "C", "text": "Secrets Manager intègre une rotation automatique via Lambda (notamment pour RDS), tandis que Parameter Store ne supporte pas la rotation automatique."}, {"key": "D", "text": "Les deux services sont strictement équivalents ; le choix est uniquement une question de préférence personnelle."}], "correct": ["C"], "explanation": "Secrets Manager** intègre nativement la rotation automatique via des fonctions Lambda gérées par AWS pour RDS (MySQL, PostgreSQL, Oracle, SQL Server), Redshift et d'autres services. Parameter Store ne propose pas de rotation automatique native. La réponse A est fausse : Parameter Store ne fait pas de rotation automatique. La réponse B est fausse : Secrets Manager est payant ($0.40/secret/mois), Parameter Store Standard est gratuit. La réponse D est fausse : les deux services ont des cas d'usage distincts — Secrets Manager pour les secrets critiques avec rotation, Parameter Store pour la configuration applicative."}, {"number": 7, "title": "Service Control Policies (SCP)", "prompt": "FormaTech configure une SCP qui refuse ec2:RunInstances sur toutes les instances de type *.4xlarge et plus grand, pour l'OU Non-Production. Un développeur du compte formateach-dev (membre de l'OU Non-Production) possède AdministratorAccess en IAM. Que se passe-t-il s'il tente de lancer une instance m5.4xlarge ?", "options": [{"key": "A", "text": "L'action est autorisée car AdministratorAccess surpasse toujours les SCP."}, {"key": "B", "text": "L'action est refusée car la SCP définit les limites maximales du compte, et le Deny SCP l'emporte sur l'AdministratorAccess IAM."}, {"key": "C", "text": "L'action est autorisée car les SCP ne s'appliquent qu'aux utilisateurs sans AdministratorAccess."}, {"key": "D", "text": "L'action est refusée seulement si le Management Account a également appliqué la SCP à la racine."}], "correct": ["B"], "explanation": "La SCP définit les limites maximales (permission boundary au niveau du compte). Aucune policy IAM, même AdministratorAccess, ne peut dépasser ce que la SCP autorise. Le Deny SCP est irrévocable depuis l'intérieur du compte. La réponse A est fausse : AdministratorAccess ne surpasse pas les SCP. La réponse C est fausse : les SCP s'appliquent à tous les principals du compte sans exception. La réponse D est fausse : une SCP sur une OU s'applique à tous les comptes membres sans condition supplémentaire. > Note formateur** : insister sur ce point — c'est une incompréhension très fréquente qui mène à des configurations dangereuses."}, {"number": 8, "title": "Principe du moindre privilège", "prompt": "Une développeuse a besoin de lire uniquement les objets du bucket S3 formation-videos. Laquelle de ces policies respecte le mieux le principe du moindre privilège ? ```json { \"Effect\": \"Allow\", \"Action\": \"s3:*\", \"Resource\": \"*\" } ``` ```json { \"Effect\": \"Allow\", \"Action\": \"s3:GetObject\", \"Resource\": \"arn:aws:s3:::formateach-videos/*\" } ``` ```json { \"Effect\": \"Allow\", \"Action\": [\"s3:GetObject\", \"s3:PutObject\", \"s3:DeleteObject\"], \"Resource\": \"arn:aws:s3:::formateach-videos/*\" } ``` ```json { \"Effect\": \"Allow\", \"Action\": \"s3:GetObject\", \"Resource\": \"*\" } ```", "options": [{"key": "A", "text": "```json"}, {"key": "B", "text": "```json"}, {"key": "C", "text": "```json"}, {"key": "D", "text": "```json"}], "correct": ["B"], "explanation": "** ``json { \"Effect\": \"Allow\", \"Action\": \"s3:GetObject\", \"Resource\": \"arn:aws:s3:::formateach-videos/*\" } ` Cette policy respecte le principe du moindre privilège : action minimale (s3:GetObject seulement), sur la ressource précise (objets du bucket formateach-videos uniquement). - Réponse A : s3:* sur * = AdministratorAccess S3 complet — jamais acceptable - Réponse C : PutObject et DeleteObject ne sont pas nécessaires pour une lecture seule - Réponse D : s3:GetObject sur *` = peut lire n'importe quel bucket du compte — trop large"}, {"number": 9, "title": "Coexistence Deny explicite et Allow", "prompt": "Un utilisateur IAM a simultanément : - Une policy A : Allow sur s3:DeleteObject pour le bucket formateach-backup - Une policy B : Deny sur s3:DeleteObject pour le bucket formateach-backup Quel est le résultat de cette configuration ?", "options": [{"key": "A", "text": "La policy la plus récente l'emporte : si B a été créée après A, c'est Deny."}, {"key": "B", "text": "Le Deny explicite (policy B) l'emporte toujours, quelle que soit la politique Allow. L'action est refusée."}, {"key": "C", "text": "Les deux policies se neutralisent et le comportement par défaut s'applique (Allow implicite)."}, {"key": "D", "text": "AWS refuse de créer cette configuration et retourne une erreur de validation."}], "correct": ["B"], "explanation": "Le Deny explicite l'emporte toujours**, sans exception. C'est la règle cardinale d'IAM. Peu importe combien de policies Allow existent, un seul Deny explicite suffit à bloquer l'action. La réponse A est fausse : il n'y a pas de notion de \"politique la plus récente\" dans l'évaluation IAM. La réponse C est fausse : il n'existe pas d'\"Allow implicite\" dans AWS — l'absence de règle = Deny implicite. La réponse D est fausse : AWS accepte parfaitement cette configuration ; c'est un pattern courant pour les exceptions."}, {"number": 10, "title": "Rotation des Access Keys", "prompt": "Quelle est la fréquence de rotation des Access Keys IAM recommandée par AWS pour respecter les bonnes pratiques de sécurité ?", "options": [{"key": "A", "text": "Tous les 365 jours (une fois par an)"}, {"key": "B", "text": "Tous les 180 jours (tous les 6 mois)"}, {"key": "C", "text": "Tous les 90 jours (tous les 3 mois) — certaines organisations imposent 30 jours"}, {"key": "D", "text": "Les Access Keys n'ont pas besoin d'être rotées si elles sont utilisées régulièrement."}], "correct": ["C"], "explanation": "AWS recommande une rotation des Access Keys tous les 90 jours. Certaines organisations (secteur financier, défense) imposent 30 jours. La fréquence peut être appliquée via une policy IAM avec condition sur aws:username et une règle AWS Config access-keys-rotated. La réponse A (365 jours) est trop longue — une clé compromise pendant un an représente une fenêtre d'exposition inacceptable. La réponse B (180 jours) est trop longue. La réponse D est incorrecte : une utilisation régulière ne compense pas la nécessité de rotation — une clé ancienne peut avoir été compromise silencieusement. > Bonne pratique complémentaire** : préférer les IAM Roles aux Access Keys chaque fois que c'est possible. Les Access Keys ne devraient exister que pour les cas sans alternative (scripts locaux, pipelines CI/CD hors AWS)."}];let index=0,score=0,answered=false;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function render(){answered=false;const q=questions[index],card=document.querySelector('#card');document.querySelector('#progress').textContent=`Question ${index+1} / ${questions.length}`;document.querySelector('#bar').style.width=`${index/questions.length*100}%`;const options=shuffle(q.options),multiple=q.correct.length>1;card.innerHTML=`<h2>${q.title}</h2><p class="prompt">${q.prompt}</p>${multiple?'<p><em>Plusieurs réponses sont attendues.</em></p>':''}<div class="options">${options.map(o=>`<button class="option" data-key="${o.key}"><strong>${o.key}</strong> — ${o.text}</button>`).join('')}</div><button class="validate ${multiple?'show':''}" id="validate">Valider mes choix</button><div class="feedback" id="feedback"></div><button class="next" id="next">${index+1===questions.length?'Voir le résultat':'Question suivante →'}</button>`;card.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>multiple&&!answered?b.classList.toggle('selected'):answer(b,q)));document.querySelector('#validate').addEventListener('click',()=>answerMultiple(q));document.querySelector('#next').addEventListener('click',next)}
function answer(button,q){if(answered)return;answered=true;const selected=button.dataset.key,isOk=q.correct.includes(selected);if(isOk)score++;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(q.correct.includes(b.dataset.key))b.classList.add('correct')});if(!isOk)button.classList.add('wrong');const feedback=document.querySelector('#feedback');feedback.className=`feedback show ${isOk?'ok':'ko'}`;feedback.innerHTML=`<strong>${isOk?'Bonne réponse':'Réponse incorrecte'}.</strong> Réponse attendue : ${q.correct.join(', ')}.<br>${q.explanation}`;document.querySelector('#next').classList.add('show')}
function answerMultiple(q){if(answered)return;const selected=[...document.querySelectorAll('.option.selected')].map(b=>b.dataset.key).sort();if(!selected.length)return;answered=true;const expected=[...q.correct].sort(),isOk=JSON.stringify(selected)===JSON.stringify(expected);if(isOk)score++;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(q.correct.includes(b.dataset.key))b.classList.add('correct');else if(b.classList.contains('selected'))b.classList.add('wrong')});document.querySelector('#validate').classList.remove('show');const feedback=document.querySelector('#feedback');feedback.className=`feedback show ${isOk?'ok':'ko'}`;feedback.innerHTML=`<strong>${isOk?'Bonne réponse':'Réponse incomplète ou incorrecte'}.</strong> Réponses attendues : ${q.correct.join(', ')}.<br>${q.explanation}`;document.querySelector('#next').classList.add('show')}
function next(){index++;if(index<questions.length){render();return}document.querySelector('#bar').style.width='100%';document.querySelector('#progress').textContent='Terminé';document.querySelector('#card').innerHTML=`<div class="result"><h2>Résultat : ${score} / ${questions.length}</h2><p>${score>=8?'Les notions essentielles sont maîtrisées.':score>=6?'Relisez les explications des réponses manquées.':'Reprenez le chapitre et retentez le quiz.'}</p><button class="restart" onclick="location.reload()">Recommencer avec les choix mélangés</button></div>`}
render();
</script></body></html>
