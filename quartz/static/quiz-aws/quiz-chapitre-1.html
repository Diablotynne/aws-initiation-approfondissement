<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz interactif — Chapitre 1</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;background:#111827;color:#eef4fb}.quiz{max-width:900px;margin:auto;padding:1.2rem}.top{display:flex;justify-content:space-between;gap:1rem;color:#9fb2c8}.bar{height:7px;background:#2d3b4e;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#ff9900;transition:width .25s}.card{margin-top:1rem;padding:1.25rem;border:1px solid #40516a;border-radius:14px;background:#182337}.card h2{font-size:1.15rem;color:#ffb347}.prompt{font-size:1.05rem;line-height:1.5}.options{display:grid;gap:.65rem}.option{width:100%;padding:.8rem 1rem;text-align:left;border:1px solid #52657e;border-radius:10px;background:#223149;color:#fff;cursor:pointer}.option:hover{border-color:#ff9900}.option.selected{outline:2px solid #ff9900}.option.correct{border-color:#43d17e;background:#123827}.option.wrong{border-color:#ff637d;background:#401c27}.option:disabled{cursor:default}.feedback{display:none;margin-top:1rem;padding:1rem;border-radius:10px;line-height:1.5}.feedback.show{display:block}.feedback.ok{background:#123827}.feedback.ko{background:#401c27}.validate{margin-top:1rem;padding:.7rem 1.1rem;border:0;border-radius:9px;background:#ff9900;color:#111;font-weight:700;cursor:pointer}.result{display:none;text-align:center;margin-top:1rem;padding:1.5rem;border:1px solid #40516a;border-radius:14px;background:#182337}.result.show{display:block}.restart{padding:.75rem 1rem;border:0;border-radius:9px;background:#ff9900;font-weight:700;cursor:pointer}
</style></head><body><main class="quiz"><div class="top"><strong>Quiz du chapitre 1</strong><span id="progress">0 / 10 réponses</span></div><div class="bar"><span id="bar" style="width:0"></span></div><div id="questions"></div><section class="result" id="result" aria-live="polite"></section></main>
<script>
const questions=[{"number": 1, "title": "Définition NIST du Cloud Computing", "prompt": "Selon la définition officielle du NIST (National Institute of Standards and Technology), combien de caractéristiques essentielles définissent le Cloud Computing ?", "options": [{"key": "A", "text": "3 caractéristiques (accès réseau, ressources partagées, facturation à l'usage)"}, {"key": "B", "text": "4 caractéristiques (on-demand, réseau, élasticité, service mesuré)"}, {"key": "C", "text": "5 caractéristiques (on-demand self-service, accès réseau large bande, mutualisation, élasticité rapide, service mesuré)"}, {"key": "D", "text": "6 caractéristiques (les 5 du NIST + haute disponibilité)"}], "correct": ["C"], "explanation": "Le NIST définit 5 caractéristiques essentielles du Cloud Computing : 1. On-demand self-service (accès autonome sans intervention humaine) 2. Broad network access (accès via le réseau standard) 3. Resource pooling (mutualisation des ressources entre clients) 4. Rapid elasticity (élasticité et scalabilité rapides) 5. Measured service (facturation et monitoring à l'usage) Ces 5 caractéristiques sont la base de toute définition du Cloud — à retenir pour la certification Cloud Practitioner."}, {"number": 2, "title": "CAPEX vs OPEX", "prompt": "Une entreprise décide de migrer son datacenter on-premise vers AWS. Quelle affirmation décrit le mieux le changement de modèle financier ?", "options": [{"key": "A", "text": "L'entreprise passe d'un modèle OPEX (dépenses opérationnelles) à un modèle CAPEX (dépenses d'investissement)"}, {"key": "B", "text": "L'entreprise passe d'un modèle CAPEX à un modèle OPEX — les coûts deviennent des charges d'exploitation variables"}, {"key": "C", "text": "Le modèle financier ne change pas, seule la localisation des serveurs change"}, {"key": "D", "text": "AWS impose toujours un modèle CAPEX via les Reserved Instances"}], "correct": ["B"], "explanation": "Migrer vers le Cloud transforme les investissements en infrastructure (CAPEX — achat de serveurs, licences, immobilisation) en charges d'exploitation variables (OPEX — factures mensuelles proportionnelles à l'usage). C'est l'un des arguments économiques majeurs du Cloud : on passe d'un budget prévisionnel fixe à un coût variable optimisable."}, {"number": 3, "title": "Modèle de responsabilité partagée", "prompt": "Dans le modèle de responsabilité partagée AWS, qui est responsable de la mise à jour du système d'exploitation d'une instance EC2 ?", "options": [{"key": "A", "text": "AWS, car elle gère toute l'infrastructure physique et logicielle"}, {"key": "B", "text": "Le client, car la mise à jour de l'OS invité est toujours de sa responsabilité pour une IaaS"}, {"key": "C", "text": "AWS pour les instances Linux, le client pour les instances Windows"}, {"key": "D", "text": "Cela dépend du contrat de support AWS souscrit"}], "correct": ["B"], "explanation": "Dans le modèle de responsabilité partagée AWS : - AWS est responsable de la sécurité de l'infrastructure cloud (hyperviseurs, réseau physique, datacenters, hardware) - Le client est responsable de la sécurité dans le cloud (OS, patches, applications, données, configuration réseau) Pour EC2 (IaaS), la mise à jour de l'OS invité incombe toujours au client, quel que soit l'OS. Les services managés (RDS, Lambda) transfèrent plus de responsabilités vers AWS."}, {"number": 4, "title": "Classification des services : EC2", "prompt": "Dans quel modèle de service cloud Amazon EC2 (Elastic Compute Cloud) est-il classé ?", "options": [{"key": "A", "text": "SaaS (Software as a Service)"}, {"key": "B", "text": "PaaS (Platform as a Service)"}, {"key": "C", "text": "IaaS (Infrastructure as a Service)"}, {"key": "D", "text": "FaaS (Function as a Service)"}], "correct": ["C"], "explanation": "EC2 est un service IaaS (Infrastructure as a Service). AWS fournit la machine virtuelle et l'accès à ses ressources (CPU, RAM, stockage, réseau) — mais l'installation et la gestion du système d'exploitation, des middlewares et des applications restent entièrement à la charge du client."}, {"number": 5, "title": "Classification des services : Lambda", "prompt": "AWS Lambda est un service d'exécution de code sans gestion de serveur. Dans quel modèle de service est-il classé ?", "options": [{"key": "A", "text": "IaaS (Infrastructure as a Service)"}, {"key": "B", "text": "PaaS (Platform as a Service)"}, {"key": "C", "text": "SaaS (Software as a Service)"}, {"key": "D", "text": "FaaS (Function as a Service) — souvent rattaché au modèle Serverless/PaaS"}], "correct": ["D"], "explanation": "AWS Lambda est un service FaaS (Function as a Service), catégorie appartenant au mouvement Serverless. Le client écrit uniquement le code de sa fonction — AWS gère entièrement l'infrastructure sous-jacente, la mise à l'échelle automatique et la facturation à l'exécution (à la milliseconde). C'est le niveau d'abstraction le plus élevé dans la hiérarchie IaaS → PaaS → FaaS/SaaS."}, {"number": 6, "title": "Infrastructure AWS : Régions et Zones de Disponibilité", "prompt": "Quelle affirmation sur les Régions et Zones de Disponibilité (AZ) AWS est correcte ?", "options": [{"key": "A", "text": "Une Région contient exactement 2 Zones de Disponibilité, pour assurer la redondance"}, {"key": "B", "text": "Une Zone de Disponibilité est constituée d'un ou plusieurs datacenters physiquement séparés au sein d'une même Région"}, {"key": "C", "text": "Les Zones de Disponibilité d'une Région sont toutes situées dans le même datacenter physique"}, {"key": "D", "text": "Une Région et une Zone de Disponibilité désignent la même notion — ce sont deux termes synonymes"}], "correct": ["B"], "explanation": "Une Zone de Disponibilité (AZ) est composée d'un ou plusieurs datacenters au sein d'une même Région. Les AZ sont physiquement séparées et reliées par un réseau dédié à faible latence, haut débit et forte redondance. Les régions AWS actuellement documentées disposent d'au moins trois AZ, mais une architecture ne devient hautement disponible que si la charge est réellement répartie sur plusieurs AZ."}, {"number": 7, "title": "AWS Free Tier", "prompt": "Quelle affirmation décrit le mieux le Free Tier proposé à un nouveau client qui crée son compte après le 15 juillet 2025 ?", "options": [{"key": "A", "text": "Toutes les ressources EC2, S3 et RDS sont gratuites sans limite pendant douze mois"}, {"key": "B", "text": "Le client reçoit 100 USD de crédits à l'inscription, peut gagner jusqu'à 100 USD supplémentaires et le plan gratuit est limité à six mois"}, {"key": "C", "text": "Aucun moyen de paiement ni contrôle de facturation n'est nécessaire"}, {"key": "D", "text": "Le compte ne peut générer aucun coût tant que le solde de crédits n'est pas épuisé"}], "correct": ["B"], "explanation": "Pour un compte créé après le 15 juillet 2025, AWS annonce 100 USD de crédits à l'inscription et jusqu'à 100 USD supplémentaires obtenus via des activités. Le plan gratuit est limité à six mois. Un dépassement de crédit ou l'utilisation d'un service non couvert peut entraîner une facturation au tarif standard ; il faut donc consulter la page Free Tier et la facturation du compte actif. Les comptes antérieurs à cette date peuvent encore relever du régime historique."}, {"number": 8, "title": "Code de la région Paris", "prompt": "Quel est le code identifiant de la région AWS de Paris ?", "options": [{"key": "A", "text": "eu-central-1"}, {"key": "B", "text": "eu-south-1"}, {"key": "C", "text": "eu-west-3"}, {"key": "D", "text": "fr-paris-1"}], "correct": ["C"], "explanation": "Le code de la région Paris est eu-west-3. Mémo : - eu-west-1 = Irlande (Dublin) - eu-west-2 = Royaume-Uni (Londres) - eu-west-3 = France (Paris) - eu-central-1 = Allemagne (Francfort) La région Paris a été ouverte en décembre 2017 et dispose de 3 Zones de Disponibilité."}, {"number": 9, "title": "Commande CLI d'identification", "prompt": "Vous souhaitez vérifier quel utilisateur ou rôle IAM est associé à vos credentials AWS CLI actuels. Quelle commande utilisez-vous ?", "options": [{"key": "A", "text": "aws iam get-user"}, {"key": "B", "text": "aws sts get-caller-identity"}, {"key": "C", "text": "aws configure list"}, {"key": "D", "text": "aws iam whoami"}], "correct": ["B"], "explanation": "La commande aws sts get-caller-identity retourne trois informations sur l'identité associée aux credentials actifs : - UserId : identifiant unique de l'entité IAM - Account : numéro de compte AWS (12 chiffres) - Arn : ARN complet de l'utilisateur ou du rôle aws iam get-user ne fonctionne pas avec les rôles (uniquement les users IAM). aws configure list affiche la configuration CLI mais pas l'identité réelle. aws iam whoami n'existe pas."}, {"number": 10, "title": "Modèle de déploiement et souveraineté des données", "prompt": "FormaTech doit héberger les données RH de ses 80 salariés (données personnelles soumises au RGPD). L'entreprise souhaite conserver un contrôle maximal sur ces données tout en bénéficiant d'une infrastructure moderne. Quel modèle de déploiement cloud est le plus adapté ?", "options": [{"key": "A", "text": "Cloud public AWS uniquement — AWS est certifié RGPD et gère la conformité"}, {"key": "B", "text": "Cloud hybride — les données RH restent on-premise ou dans un Cloud privé, les autres charges vont sur AWS public"}, {"key": "C", "text": "Cloud communautaire partagé entre PME lyonnaises — pour mutualiser les coûts de conformité"}, {"key": "D", "text": "Aucun cloud — les données RGPD ne peuvent jamais quitter un serveur physique en France"}], "correct": ["B"], "explanation": "Le Cloud hybride est la solution la plus adaptée pour FormaTech. Il permet de : - Maintenir les données RH sensibles on-premise ou dans un Cloud privé souverain (ex. : OVHcloud SecNumCloud) - Migrer les charges applicatives moins sensibles (plateforme e-learning, contenus vidéo) sur AWS public - Respecter les exigences RGPD sur la localisation et la maîtrise des données personnelles La réponse A est partiellement vraie (AWS est bien certifié ISO 27001/27701 et offre des garanties RGPD) mais le \"contrôle maximal\" mentionné dans la question oriente vers le modèle hybride. La réponse D est incorrecte : le RGPD n'interdit pas le Cloud, il impose des garanties contractuelles et techniques."}];let score=0,answered=0;
function render(){const root=document.querySelector('#questions');root.innerHTML=questions.map((q,i)=>{const multiple=q.correct.length>1;const options=[...q.options].sort((a,b)=>a.key.localeCompare(b.key));return `<section class="card" data-index="${i}"><h2>Question ${i+1} — ${q.title}</h2><p class="prompt">${q.prompt}</p>${multiple?'<p><em>Plusieurs réponses sont attendues.</em></p>':''}<div class="options">${options.map(o=>`<button class="option" data-key="${o.key}"><strong>${o.key}</strong> — ${o.text}</button>`).join('')}</div>${multiple?'<button class="validate">Valider mes choix</button>':''}<div class="feedback" aria-live="polite"></div></section>`}).join('');root.querySelectorAll('.card').forEach(card=>{const q=questions[Number(card.dataset.index)],multiple=q.correct.length>1;card.querySelectorAll('.option').forEach(button=>button.addEventListener('click',()=>multiple?button.classList.toggle('selected'):validate(card,q,[button.dataset.key])));if(multiple)card.querySelector('.validate').addEventListener('click',()=>{const selected=[...card.querySelectorAll('.option.selected')].map(b=>b.dataset.key);if(selected.length)validate(card,q,selected)})})}
function validate(card,q,selected){if(card.dataset.answered)return;card.dataset.answered='true';const chosen=[...selected].sort(),expected=[...q.correct].sort(),isOk=JSON.stringify(chosen)===JSON.stringify(expected);if(isOk)score++;answered++;card.querySelectorAll('.option').forEach(button=>{button.disabled=true;if(q.correct.includes(button.dataset.key))button.classList.add('correct');else if(chosen.includes(button.dataset.key))button.classList.add('wrong')});const validateButton=card.querySelector('.validate');if(validateButton)validateButton.disabled=true;const feedback=card.querySelector('.feedback');feedback.className=`feedback show ${isOk?'ok':'ko'}`;feedback.innerHTML=`<strong>${isOk?'Bonne réponse':'Réponse incorrecte'}.</strong> Réponse${q.correct.length>1?'s':''} attendue${q.correct.length>1?'s':''} : ${q.correct.join(', ')}.<br>${q.explanation}`;document.querySelector('#progress').textContent=`${answered} / ${questions.length} réponses`;document.querySelector('#bar').style.width=`${answered/questions.length*100}%`;if(answered===questions.length)showResult()}
function showResult(){const result=document.querySelector('#result');result.classList.add('show');result.innerHTML=`<h2>Résultat : ${score} / ${questions.length}</h2><p>${score>=8?'Les notions essentielles sont maîtrisées.':score>=6?'Relisez les explications des réponses manquées.':'Reprenez le chapitre et retentez le quiz.'}</p><button class="restart" onclick="location.reload()">Recommencer avec les choix mélangés</button>`}
render();
</script></body></html>
