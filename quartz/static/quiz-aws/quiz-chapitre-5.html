<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz interactif — Chapitre 5</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;background:#111827;color:#eef4fb}.quiz{max-width:860px;margin:auto;padding:1.2rem}.top{display:flex;justify-content:space-between;gap:1rem;color:#9fb2c8}.bar{height:7px;background:#2d3b4e;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#ff9900;transition:width .25s}.card{margin-top:1rem;padding:1.25rem;border:1px solid #40516a;border-radius:14px;background:#182337}.card h2{font-size:1.15rem;color:#ffb347}.prompt{font-size:1.05rem;line-height:1.5}.options{display:grid;gap:.65rem}.option{width:100%;padding:.8rem 1rem;text-align:left;border:1px solid #52657e;border-radius:10px;background:#223149;color:#fff;cursor:pointer}.option:hover{border-color:#ff9900}.option.selected{outline:2px solid #ff9900}.option.correct{border-color:#43d17e;background:#123827}.option.wrong{border-color:#ff637d;background:#401c27}.option:disabled{cursor:default}.feedback{display:none;margin-top:1rem;padding:1rem;border-radius:10px;line-height:1.5}.feedback.show{display:block}.feedback.ok{background:#123827}.feedback.ko{background:#401c27}.next,.validate{display:none;margin-top:1rem;padding:.7rem 1.1rem;border:0;border-radius:9px;background:#ff9900;color:#111;font-weight:700;cursor:pointer}.next.show,.validate.show{display:inline-block}.result{text-align:center;padding:2rem}.restart{padding:.75rem 1rem;border:0;border-radius:9px;background:#ff9900;font-weight:700;cursor:pointer}
</style></head><body><main class="quiz" aria-live="polite"><div class="top"><strong>Chapitre 5</strong><span id="progress"></span></div><div class="bar"><span id="bar"></span></div><section class="card" id="card"></section></main>
<script>
const questions=[{"number": 1, "title": "Section obligatoire CloudFormation", "prompt": "Dans un template AWS CloudFormation YAML, quelle est la seule section obligatoire ?", "options": [{"key": "A", "text": "AWSTemplateFormatVersion"}, {"key": "B", "text": "Parameters"}, {"key": "C", "text": "Resources"}, {"key": "D", "text": "Outputs"}], "correct": ["C"], "explanation": ") Resources Explication** : La section Resources est la seule section obligatoire dans un template CloudFormation. Elle contient la définition de toutes les ressources AWS à créer. Les sections AWSTemplateFormatVersion, Description, Parameters, Mappings, Conditions et Outputs sont toutes optionnelles, bien que fortement recommandées pour des templates réutilisables et maintenables."}, {"number": 2, "title": "Fonctions intrinsèques", "prompt": "Quelle fonction intrinsèque CloudFormation permet de référencer un paramètre ou l'identifiant physique d'une ressource définie dans le même template ?", "options": [{"key": "A", "text": "!GetAtt"}, {"key": "B", "text": "!ImportValue"}, {"key": "C", "text": "!Sub"}, {"key": "D", "text": "!Ref"}], "correct": ["D"], "explanation": ") !Ref Explication : - !Ref NomLogique : retourne la valeur d'un paramètre ou l'identifiant physique d'une ressource (ex : ID du VPC, nom du bucket S3) - !GetAtt Resource.Attribute : retourne un attribut spécifique d'une ressource (ex : ARN, DNS Name, URL) - !Sub \"texte ${Var}\" : effectue une substitution** de variables dans une chaîne de caractères - !ImportValue ExportName : importe un Output exporté depuis une autre stack"}, {"number": 3, "title": "Change Set CloudFormation", "prompt": "Que permet de faire un Change Set CloudFormation avant de l'exécuter ?", "options": [{"key": "A", "text": "Sauvegarder l'état actuel de la stack dans S3"}, {"key": "B", "text": "Prévisualiser les modifications qui seront apportées aux ressources existantes"}, {"key": "C", "text": "Vérifier la syntaxe YAML du template"}, {"key": "D", "text": "Créer automatiquement une politique IAM pour la mise à jour"}], "correct": ["B"], "explanation": ") Prévisualiser les modifications qui seront apportées aux ressources existantes Explication : Un Change Set analyse la différence entre le template actuel d'une stack et le nouveau template proposé. Il liste pour chaque ressource l'action prévue (Add, Modify, Remove) et si une modification entraînera une interruption de service ou une recréation complète de la ressource (Replacement: True). Il s'agit de l'équivalent CloudFormation d'un terraform plan. Le Change Set doit ensuite être exécuté** (execute-change-set) pour que les modifications soient appliquées."}, {"number": 4, "title": "Durée d'exécution Lambda", "prompt": "Quelle est la durée d'exécution maximale d'une fonction AWS Lambda ?", "options": [{"key": "A", "text": "5 minutes"}, {"key": "B", "text": "10 minutes"}, {"key": "C", "text": "15 minutes"}, {"key": "D", "text": "30 minutes"}], "correct": ["C"], "explanation": ") 15 minutes Explication : La durée d'exécution maximale d'une fonction Lambda est de 15 minutes (900 secondes). C'est une limite ferme qui ne peut pas être dépassée. Pour les traitements qui nécessitent plus de temps, il faut envisager d'autres services : AWS Batch (traitements longs), Step Functions (orchestration de Lambdas), Fargate (conteneurs) ou ECS. Attention : si la Lambda est invoquée via API Gateway, le timeout maximum est de 29 secondes** côté API Gateway."}, {"number": 5, "title": "Piliers Well-Architected", "prompt": "Depuis 2021, le AWS Well-Architected Framework compte combien de piliers ?", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "5"}, {"key": "C", "text": "6"}, {"key": "D", "text": "7"}], "correct": ["C"], "explanation": ") 6 Explication : Le Well-Architected Framework compte 6 piliers depuis novembre 2021, date à laquelle le pilier Sustainability a été ajouté aux 5 piliers initiaux. Les 6 piliers sont : 1. Operational Excellence (Excellence Opérationnelle) 2. Security (Sécurité) 3. Reliability (Fiabilité) 4. Performance Efficiency (Efficacité des Performances) 5. Cost Optimization (Optimisation des Coûts) 6. Sustainability** (Durabilité) ← ajouté en 2021 Un candidat à l'examen CLF-C02 ou SAA-C03 qui répond \"5 piliers\" se trompe."}, {"number": 6, "title": "SSM Session Manager", "prompt": "Quel est le principal avantage de AWS SSM Session Manager par rapport à un accès SSH classique ?", "options": [{"key": "A", "text": "Il permet d'accéder à des instances sans ouvrir le port 22 et sans clé SSH, tout en journalisant toutes les sessions"}, {"key": "B", "text": "Il est gratuit alors que SSH est payant sur AWS"}, {"key": "C", "text": "Il supporte uniquement Windows Server"}, {"key": "D", "text": "Il nécessite un Agent Bastion Host dédié dans un subnet public"}], "correct": ["A"], "explanation": ") Il permet d'accéder à des instances sans ouvrir le port 22 et sans clé SSH, tout en journalisant toutes les sessions Explication** : Session Manager établit un tunnel chiffré HTTPS (port 443) entre le client et l'agent SSM installé sur l'instance. Cela élimine le besoin d'ouvrir le port 22 dans les Security Groups, de gérer des paires de clés SSH, ou de déployer un bastion host. De plus, toutes les sessions sont automatiquement journalisées dans CloudTrail et optionnellement dans S3 ou CloudWatch Logs, offrant un audit complet. Session Manager fonctionne avec les instances EC2, mais aussi avec les serveurs on-premise (via Hybrid Activations)."}, {"number": 7, "title": "CloudWatch Alarm — Actions possibles", "prompt": "Lorsqu'une CloudWatch Alarm passe en état ALARM, quelles actions peut-elle déclencher ? (Cochez toutes les réponses correctes)", "options": [{"key": "A", "text": "Envoyer une notification via Amazon SNS"}, {"key": "B", "text": "Déclencher une politique Auto Scaling (scale out ou scale in)"}, {"key": "C", "text": "Redémarrer une instance EC2"}, {"key": "D", "text": "Déployer automatiquement une nouvelle stack CloudFormation"}, {"key": "E", "text": "Invoquer directement une fonction Lambda via EventBridge"}], "correct": ["A", "B", "C"], "explanation": "Explication : | Action | Possible ? | Détails | |--------|-----------|---------| | A) Notification SNS | Oui | Action native des alarmes CloudWatch | | B) Politique Auto Scaling | Oui | Scale out/in selon les métriques | | C) Redémarrer une instance EC2 | Oui | Action EC2 : reboot, stop, terminate, recover | | D) Déployer une stack CloudFormation | Non | CloudFormation n'est pas une action directe d'alarme | | E) Invoquer une Lambda via EventBridge | Oui** | Via SNS → Lambda ou EventBridge Rule (mais pas directement depuis l'Alarm) | Note : L'alarme peut déclencher une Lambda indirectement (SNS → Lambda), mais pas invoquer Lambda directement comme action d'alarme CloudWatch."}, {"number": 8, "title": "Pilier Sustainability", "prompt": "Quel pilier du Well-Architected Framework concerne la durabilité environnementale et la réduction de l'impact carbone des charges de travail ?", "options": [{"key": "A", "text": "Cost Optimization"}, {"key": "B", "text": "Operational Excellence"}, {"key": "C", "text": "Sustainability"}, {"key": "D", "text": "Performance Efficiency"}], "correct": ["C"], "explanation": ") Sustainability Explication : Le pilier Sustainability (Durabilité) concerne explicitement la minimisation de l'impact environnemental des charges de travail. Il inclut des pratiques comme : utiliser des instances Graviton (ARM, plus efficaces énergétiquement), choisir des régions avec un meilleur mix énergétique, réduire les ressources provisionnées en excès, utiliser des services managés plutôt que des serveurs dédiés. Le pilier Cost Optimization** se concentre exclusivement sur le coût financier. Ne pas confondre les deux : on peut optimiser les coûts sans réduire l'impact carbone (ex : Spot Instances, qui utilisent la même infrastructure mais facturent moins)."}, {"number": 9, "title": "CloudFormation Drift Detection", "prompt": "À quoi sert la fonctionnalité Drift Detection de AWS CloudFormation ?", "options": [{"key": "A", "text": "À détecter les nouvelles ressources AWS disponibles dans la région"}, {"key": "B", "text": "À identifier les ressources d'une stack qui ont été modifiées manuellement en dehors de CloudFormation"}, {"key": "C", "text": "À migrer automatiquement un template CloudFormation vers Terraform"}, {"key": "D", "text": "À comparer les coûts entre deux versions d'une même stack"}], "correct": ["B"], "explanation": ") Identifier les ressources d'une stack qui ont été modifiées manuellement en dehors de CloudFormation Explication : La dérive** (drift) se produit quand une ressource gérée par CloudFormation est modifiée directement via la console, la CLI ou l'API AWS sans passer par CloudFormation. La Drift Detection compare l'état actuel de chaque ressource avec la définition dans le template. Elle retourne l'état IN_SYNC, MODIFIED, DELETED ou NOT_CHECKED pour chaque ressource. C'est une opération asynchrone : on lance la détection (detect-stack-drift) puis on récupère les résultats ultérieurement."}, {"number": 10, "title": "AWS Trusted Advisor", "prompt": "AWS Trusted Advisor fournit des recommandations dans combien de catégories principales ?", "options": [{"key": "A", "text": "3"}, {"key": "B", "text": "4"}, {"key": "C", "text": "5"}, {"key": "D", "text": "6"}], "correct": ["C"], "explanation": ") 5 Explication : AWS Trusted Advisor propose des recommandations dans 5 catégories : 1. Cost Optimization : instances sous-utilisées, EIPs non attachées, snapshots anciens 2. Performance : EC2 à fort CPU, RDS sans Read Replicas, CloudFront sans compression 3. Security : Security Groups permissifs, MFA non activée, clés IAM vieillissantes 4. Fault Tolerance : RDS sans backup, EC2 sans AZ multiples, Route 53 sans health checks 5. Service Limits** : quotas approchant les limites de services Les checks complets nécessitent un plan de support Business ou Enterprise. Le plan Basic donne accès uniquement aux checks de sécurité et de Service Limits essentiels."}];let index=0,score=0,answered=false;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function render(){answered=false;const q=questions[index],card=document.querySelector('#card');document.querySelector('#progress').textContent=`Question ${index+1} / ${questions.length}`;document.querySelector('#bar').style.width=`${index/questions.length*100}%`;const options=shuffle(q.options),multiple=q.correct.length>1;card.innerHTML=`<h2>${q.title}</h2><p class="prompt">${q.prompt}</p>${multiple?'<p><em>Plusieurs réponses sont attendues.</em></p>':''}<div class="options">${options.map(o=>`<button class="option" data-key="${o.key}"><strong>${o.key}</strong> — ${o.text}</button>`).join('')}</div><button class="validate ${multiple?'show':''}" id="validate">Valider mes choix</button><div class="feedback" id="feedback"></div><button class="next" id="next">${index+1===questions.length?'Voir le résultat':'Question suivante →'}</button>`;card.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>multiple&&!answered?b.classList.toggle('selected'):answer(b,q)));document.querySelector('#validate').addEventListener('click',()=>answerMultiple(q));document.querySelector('#next').addEventListener('click',next)}
function answer(button,q){if(answered)return;answered=true;const selected=button.dataset.key,isOk=q.correct.includes(selected);if(isOk)score++;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(q.correct.includes(b.dataset.key))b.classList.add('correct')});if(!isOk)button.classList.add('wrong');const feedback=document.querySelector('#feedback');feedback.className=`feedback show ${isOk?'ok':'ko'}`;feedback.innerHTML=`<strong>${isOk?'Bonne réponse':'Réponse incorrecte'}.</strong> Réponse attendue : ${q.correct.join(', ')}.<br>${q.explanation}`;document.querySelector('#next').classList.add('show')}
function answerMultiple(q){if(answered)return;const selected=[...document.querySelectorAll('.option.selected')].map(b=>b.dataset.key).sort();if(!selected.length)return;answered=true;const expected=[...q.correct].sort(),isOk=JSON.stringify(selected)===JSON.stringify(expected);if(isOk)score++;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(q.correct.includes(b.dataset.key))b.classList.add('correct');else if(b.classList.contains('selected'))b.classList.add('wrong')});document.querySelector('#validate').classList.remove('show');const feedback=document.querySelector('#feedback');feedback.className=`feedback show ${isOk?'ok':'ko'}`;feedback.innerHTML=`<strong>${isOk?'Bonne réponse':'Réponse incomplète ou incorrecte'}.</strong> Réponses attendues : ${q.correct.join(', ')}.<br>${q.explanation}`;document.querySelector('#next').classList.add('show')}
function next(){index++;if(index<questions.length){render();return}document.querySelector('#bar').style.width='100%';document.querySelector('#progress').textContent='Terminé';document.querySelector('#card').innerHTML=`<div class="result"><h2>Résultat : ${score} / ${questions.length}</h2><p>${score>=8?'Les notions essentielles sont maîtrisées.':score>=6?'Relisez les explications des réponses manquées.':'Reprenez le chapitre et retentez le quiz.'}</p><button class="restart" onclick="location.reload()">Recommencer avec les choix mélangés</button></div>`}
render();
</script></body></html>
