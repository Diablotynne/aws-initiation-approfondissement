<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz interactif — Chapitre 4</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;background:#111827;color:#eef4fb}.quiz{max-width:900px;margin:auto;padding:1.2rem}.top{display:flex;justify-content:space-between;gap:1rem;color:#9fb2c8}.bar{height:7px;background:#2d3b4e;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#ff9900;transition:width .25s}.card{margin-top:1rem;padding:1.25rem;border:1px solid #40516a;border-radius:14px;background:#182337}.card h2{font-size:1.15rem;color:#ffb347}.prompt{font-size:1.05rem;line-height:1.5}.options{display:grid;gap:.65rem}.option{width:100%;padding:.8rem 1rem;text-align:left;border:1px solid #52657e;border-radius:10px;background:#223149;color:#fff;cursor:pointer}.option:hover{border-color:#ff9900}.option.selected{outline:2px solid #ff9900}.option.correct{border-color:#43d17e;background:#123827}.option.wrong{border-color:#ff637d;background:#401c27}.option:disabled{cursor:default}.feedback{display:none;margin-top:1rem;padding:1rem;border-radius:10px;line-height:1.5}.feedback.show{display:block}.feedback.ok{background:#123827}.feedback.ko{background:#401c27}.validate{margin-top:1rem;padding:.7rem 1.1rem;border:0;border-radius:9px;background:#ff9900;color:#111;font-weight:700;cursor:pointer}.result{display:none;text-align:center;margin-top:1rem;padding:1.5rem;border:1px solid #40516a;border-radius:14px;background:#182337}.result.show{display:block}.restart{padding:.75rem 1rem;border:0;border-radius:9px;background:#ff9900;font-weight:700;cursor:pointer}
</style></head><body><main class="quiz"><div class="top"><strong>Quiz du chapitre 4</strong><span id="progress">0 / 10 réponses</span></div><div class="bar"><span id="bar"></span></div><div id="questions"></div><section class="result" id="result" aria-live="polite"></section></main>
<script>
const questions=[{"number": 1, "title": "VPC Peering et transitivité", "prompt": "FormaTech dispose de 3 VPC : vpc-prod, vpc-dev et vpc-logs. Un peering existe entre vpc-prod et vpc-dev, et un autre peering existe entre vpc-dev et vpc-logs. Quelle affirmation est correcte ?", "options": [{"key": "A", "text": "vpc-prod peut communiquer avec vpc-logs via vpc-dev automatiquement, car le trafic transite par vpc-dev."}, {"key": "B", "text": "vpc-prod ne peut pas communiquer avec vpc-logs via vpc-dev, car le VPC Peering n'est pas transitif. Il faudrait créer un peering direct vpc-prod ↔ vpc-logs."}, {"key": "C", "text": "vpc-prod peut communiquer avec vpc-logs si l'on ajoute une entrée de route dans vpc-dev pointant vers les deux autres VPC."}, {"key": "D", "text": "vpc-prod peut communiquer avec vpc-logs uniquement si les deux VPC sont dans la même région AWS."}], "correct": ["B"], "explanation": "Le VPC Peering AWS est non transitif. Même si vpc-dev est pairé avec vpc-prod ET avec vpc-logs, le trafic entre vpc-prod et vpc-logs ne peut pas transiter via vpc-dev. AWS ne route pas le trafic à travers un VPC intermédiaire. Pour permettre la communication entre les trois VPC : - Option 1 : Créer un peering direct vpc-prod ↔ vpc-logs - Option 2 : Utiliser AWS Transit Gateway (conçu pour la transitivité à grande échelle) Pourquoi C est faux** : Ajouter des routes dans vpc-dev ne suffit pas — AWS bloque techniquement le trafic transitif au niveau de l'infrastructure VPC Peering."}, {"number": 2, "title": "Security Groups vs Network ACL", "prompt": "Un administrateur configure la sécurité du subnet privé de FormaTech. Il souhaite empêcher des connexions entrantes depuis une plage d'IP compromise (45.33.32.0/24). Quelle est la méthode correcte ?", "options": [{"key": "A", "text": "Ajouter une règle DENY dans le Security Group sg-ec2-app pour bloquer cette plage CIDR."}, {"key": "B", "text": "Ajouter une règle DENY numérotée (ex: règle 50) dans la Network ACL associée au subnet privé pour bloquer cette plage CIDR en entrée."}, {"key": "C", "text": "Il est impossible de bloquer une plage d'IP avec les outils natifs AWS — il faut passer par AWS WAF."}, {"key": "D", "text": "Retirer toutes les règles ALLOW dans le Security Group pour bloquer implicitement cette plage."}], "correct": ["B"], "explanation": "Les Security Groups ne supportent pas les règles DENY (réponse A incorrecte). Seules les Network ACL permettent des règles DENY explicites. La procédure correcte : 1. Aller dans VPC → ACL réseau → sélectionner la NACL du subnet privé 2. Ajouter une règle inbound avec un numéro inférieur aux règles ALLOW existantes (ex: règle 50) 3. Protocole : All traffic (ou TCP si spécifique), Source : 45.33.32.0/24, Action : DENY Rappel** : les NACL évaluent les règles par ordre numérique croissant. La première règle qui correspond s'applique."}, {"number": 3, "title": "Accès Internet depuis les subnets privés", "prompt": "Les instances EC2 du tier application de FormaTech (dans subnet-priv-3a et subnet-priv-3b) doivent pouvoir télécharger des mises à jour système depuis Internet, sans être accessibles depuis Internet. Quel composant VPC permet cela ?", "options": [{"key": "A", "text": "Internet Gateway (IGW) configuré avec des règles restrictives dans le Security Group."}, {"key": "B", "text": "VPC Endpoint de type Gateway pointant vers les dépôts de paquets."}, {"key": "C", "text": "NAT Gateway déployé dans un subnet public, avec une route 0.0.0.0/0 → NAT GW dans la Route Table des subnets privés."}, {"key": "D", "text": "VPN Site-to-Site connecté au dépôt de paquets on-premises."}], "correct": ["C"], "explanation": "Le NAT Gateway (Network Address Translation) est le composant conçu pour permettre aux instances en subnet privé d'initier des connexions sortantes vers Internet, sans exposer leur IP privée et sans permettre de connexions entrantes. Fonctionnement : 1. L'instance EC2 privée envoie une requête (ex: apt update) 2. La requête transite par le NAT Gateway (dans le subnet public) 3. Le NAT Gateway substitue l'IP privée par son Elastic IP publique 4. La réponse retourne vers le NAT GW qui la redirige vers l'instance privée Pourquoi A est faux** : L'IGW permet aux ressources avec une IP publique de communiquer directement avec Internet — il ne masque pas l'IP et n'est pas adapté aux subnets privés."}, {"number": 4, "title": "RDS Multi-AZ vs Read Replica", "prompt": "FormaTech souhaite garantir que sa base de données RDS MySQL reste disponible en cas de défaillance complète de la zone eu-west-3a. Quelle fonctionnalité RDS faut-il activer ?", "options": [{"key": "A", "text": "Read Replica dans eu-west-3b, car les replicas permettent de basculer automatiquement la charge de lecture vers une autre AZ."}, {"key": "B", "text": "Multi-AZ, qui maintient une instance standby synchronisée dans une autre AZ et déclenche un failover automatique en cas de défaillance de l'instance primaire."}, {"key": "C", "text": "Automated Backups avec une rétention de 35 jours, pour restaurer rapidement en cas de panne."}, {"key": "D", "text": "RDS Proxy, qui redirige automatiquement les connexions vers une AZ disponible."}], "correct": ["B"], "explanation": "Le Multi-AZ RDS maintient une instance standby dans une AZ différente, avec réplication synchrone (chaque transaction est écrite sur les deux instances avant confirmation). En cas de défaillance de l'instance primaire, le basculement est automatique (~60-120 secondes) et transparent pour l'application (même endpoint DNS). Pourquoi A est faux : Les Read Replicas utilisent une réplication asynchrone et le failover est manuel (promotion). Elles sont conçues pour la scalabilité de lecture, pas pour la haute disponibilité automatique. Pourquoi C est faux** : Les sauvegardes permettent la restauration mais pas le failover automatique."}, {"number": 5, "title": "Durée de rétention des sauvegardes automatiques RDS", "prompt": "Quelle est la durée maximale de rétention des sauvegardes automatiques (Automated Backups) d'une instance RDS ?", "options": [{"key": "A", "text": "7 jours (valeur par défaut et maximum)"}, {"key": "B", "text": "14 jours"}, {"key": "C", "text": "35 jours"}, {"key": "D", "text": "90 jours"}], "correct": ["C"], "explanation": "— 35 jours | Paramètre | Valeur | |-----------|--------| | Durée minimale | 1 jour (0 = désactivé) | | Durée par défaut | 7 jours | | Durée maximale | 35 jours | Les sauvegardes automatiques permettent la restauration à n'importe quelle seconde dans la fenêtre de rétention (Point-In-Time Recovery — PITR). Attention : les Manual Snapshots** ont une durée de rétention illimitée (jusqu'à suppression manuelle)."}, {"number": 6, "title": "Clé primaire DynamoDB", "prompt": "Lors de la création de la table FormaTech-Sessions, quelle est la configuration minimale obligatoire de la clé primaire ?", "options": [{"key": "A", "text": "La clé primaire doit obligatoirement être composée d'une Partition Key ET d'une Sort Key."}, {"key": "B", "text": "La clé primaire peut être constituée uniquement d'une Partition Key (la Sort Key est optionnelle)."}, {"key": "C", "text": "La clé primaire doit être un attribut de type Number auto-incrémenté, comme dans SQL."}, {"key": "D", "text": "DynamoDB n'utilise pas de clé primaire — tous les attributs sont indexés automatiquement."}], "correct": ["B"], "explanation": "Dans DynamoDB, la Partition Key seule est suffisante pour définir une clé primaire (clé primaire simple). La Sort Key est optionnelle. | Type de clé primaire | Composition | Unicité | |---------------------|-------------|---------| | Simple | Partition Key uniquement | La PK doit être unique dans la table | | Composite | Partition Key + Sort Key | La combinaison PK+SK doit être unique | Pour FormaTech-Sessions, la clé composite (apprenant_id + session_date) est choisie pour permettre à un même apprenant d'avoir plusieurs sessions (différentes dates). Pourquoi C est faux** : DynamoDB est NoSQL et ne supporte pas l'auto-incrémentation. Il n'y a pas de séquence automatique."}, {"number": 7, "title": "Réduire la latence de lecture DynamoDB", "prompt": "FormaTech observe que certaines pages du catalogue de cours, dont les données sont stockées dans DynamoDB, prennent 5 ms à charger en moyenne. L'équipe souhaite descendre sous la milliseconde. Quel service AWS permet d'atteindre cet objectif ?", "options": [{"key": "A", "text": "ElastiCache Redis, en mettant en cache les résultats des requêtes DynamoDB."}, {"key": "B", "text": "DAX (DynamoDB Accelerator), qui est un cache en mémoire entièrement managé et compatible avec l'API DynamoDB, offrant des latences en microsecondes."}, {"key": "C", "text": "DynamoDB Global Tables, qui réplique les données dans plusieurs régions pour réduire la latence."}, {"key": "D", "text": "RDS Read Replica, pour décharger DynamoDB vers un moteur SQL plus rapide."}], "correct": ["B"], "explanation": "DAX (DynamoDB Accelerator) est le service conçu spécifiquement pour accélérer les lectures DynamoDB : - Latence : de millisecondes à microsecondes - Transparent : compatible avec l'API DynamoDB standard (changement minimal de code — juste remplacer l'endpoint) - Géré par AWS, déployé dans le VPC Pourquoi A est partiellement faux : ElastiCache Redis peut effectivement être utilisé en cache devant DynamoDB, mais nécessite une logique applicative spécifique (cache-aside) et n'est pas transparent comme DAX. DAX est la réponse canonique AWS pour ce cas d'usage. Pourquoi C est faux** : Global Tables réduit la latence pour les utilisateurs géographiquement distants, mais ne réduit pas la latence intrinsèque des requêtes."}, {"number": 8, "title": "Architecture de stockage Aurora", "prompt": "Combien de copies des données Aurora sont maintenues, et dans combien de zones de disponibilité ?", "options": [{"key": "A", "text": "2 copies dans 2 AZ (primaire + standby, comme RDS Multi-AZ)."}, {"key": "B", "text": "3 copies dans 3 AZ (une par AZ)."}, {"key": "C", "text": "6 copies dans 3 AZ (2 copies par AZ)."}, {"key": "D", "text": "6 copies dans 6 AZ différentes, ce qui nécessite une région avec au moins 6 AZ."}], "correct": ["C"], "explanation": "— 6 copies dans 3 AZ Aurora maintient 6 copies des données réparties sur 3 zones de disponibilité (2 copies par AZ). Cette architecture est gérée automatiquement par le stockage distribué Aurora, indépendamment du nombre d'instances de calcul. Quorum Aurora : - Écriture : nécessite 4 copies sur 6 (quorum 4/6) - Lecture : nécessite 3 copies sur 6 (quorum 3/6) Cela signifie qu'Aurora peut tolérer la perte d'une AZ complète (2 copies perdues) sans interruption de service ni perte de données. Comparaison avec RDS Multi-AZ** : RDS Multi-AZ n'a qu'une copie standby (2 copies au total), alors qu'Aurora a 6 copies natives."}, {"number": 9, "title": "Route 53 : politique de routage pour le failover", "prompt": "FormaTech souhaite configurer Route 53 pour que le trafic vers app.formateach.com bascule automatiquement vers une instance EC2 de secours si l'instance principale devient indisponible. Quelle politique de routage Route 53 faut-il utiliser ?", "options": [{"key": "A", "text": "Weighted : répartir le trafic à 90% vers l'instance principale et 10% vers l'instance de secours."}, {"key": "B", "text": "Latency : diriger le trafic vers l'instance avec la latence la plus faible, qui basculera automatiquement en cas de panne."}, {"key": "C", "text": "Failover : configurer un enregistrement PRIMARY avec health check sur l'instance principale et un enregistrement SECONDARY sur l'instance de secours."}, {"key": "D", "text": "Simple : configurer deux valeurs d'enregistrement A, Route 53 choisira aléatoirement en cas de panne."}], "correct": ["C"], "explanation": "La politique Failover Route 53 est conçue exactement pour ce cas d'usage : 1. Créer un enregistrement app.formateach.com de type PRIMARY pointant vers l'instance principale, avec un health check associé 2. Créer un enregistrement app.formateach.com de type SECONDARY pointant vers l'instance de secours 3. Si le health check détecte une défaillance du PRIMARY, Route 53 résout automatiquement vers le SECONDARY Pourquoi A est faux : Weighted distribue le trafic en permanence selon les poids — ce n'est pas un mécanisme de failover. Pourquoi B est faux : Latency dirige vers la région la plus rapide mais ne gère pas le failover (pas de health check obligatoire). Pourquoi D est faux** : Simple avec plusieurs valeurs effectue une rotation aléatoire (round-robin DNS) sans logique de disponibilité."}, {"number": 10, "title": "VPC Endpoint de type Gateway", "prompt": "L'équipe FormaTech souhaite que les instances EC2 en subnet privé accèdent à Amazon S3 sans passer par le NAT Gateway (pour réduire les coûts de transfert). Quel type de VPC Endpoint utiliser, et pour quels services ce type est-il disponible ?", "options": [{"key": "A", "text": "VPC Endpoint de type Interface (PrivateLink), disponible pour tous les services AWS dont S3."}, {"key": "B", "text": "VPC Endpoint de type Gateway, disponible uniquement pour S3 et DynamoDB. Il s'intègre dans la Route Table du subnet et ne génère pas de coût horaire."}, {"key": "C", "text": "VPC Endpoint de type Gateway, disponible pour tous les services AWS. Il nécessite une ENI dans le subnet privé."}, {"key": "D", "text": "AWS Direct Connect Private Virtual Interface, qui est le seul moyen d'accéder à S3 en privé."}], "correct": ["B"], "explanation": "Le VPC Endpoint de type Gateway est disponible uniquement pour S3 et DynamoDB. Il fonctionne en ajoutant une entrée dans la Route Table du subnet (préfixe de service → endpoint gateway) et ne nécessite pas d'ENI ni de coût horaire. | Caractéristique | Gateway Endpoint | Interface Endpoint (PrivateLink) | |----------------|-----------------|--------------------------------| | Services | S3 et DynamoDB uniquement | 100+ services AWS | | Mécanisme | Entrée dans Route Table | ENI avec IP privée dans le subnet | | Coût | Gratuit | ~7-10 $/mois par AZ | | Bande passante | Illimitée | Selon l'ENI | Avantage concret FormaTech** : les EC2 privés accèdent à S3 (pour les vidéos de cours) sans traverser le NAT Gateway, économisant les frais de traitement de données NAT (0,048 $/Go)."}];let score=0,answered=0;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function render(){const root=document.querySelector('#questions');root.innerHTML=questions.map((q,i)=>{const multiple=q.correct.length>1;return `<section class="card" data-index="${i}"><h2>Question ${i+1} — ${q.title}</h2><p class="prompt">${q.prompt}</p>${multiple?'<p><em>Plusieurs réponses sont attendues.</em></p>':''}<div class="options">${shuffle(q.options).map(o=>`<button class="option" data-key="${o.key}"><strong>${o.key}</strong> — ${o.text}</button>`).join('')}</div>${multiple?'<button class="validate">Valider mes choix</button>':''}<div class="feedback" aria-live="polite"></div></section>`}).join('');root.querySelectorAll('.card').forEach(card=>{const q=questions[Number(card.dataset.index)],multiple=q.correct.length>1;card.querySelectorAll('.option').forEach(button=>button.addEventListener('click',()=>multiple?button.classList.toggle('selected'):validate(card,q,[button.dataset.key])));if(multiple)card.querySelector('.validate').addEventListener('click',()=>{const selected=[...card.querySelectorAll('.option.selected')].map(b=>b.dataset.key);if(selected.length)validate(card,q,selected)})})}
function validate(card,q,selected){if(card.dataset.answered)return;card.dataset.answered='true';const chosen=[...selected].sort(),expected=[...q.correct].sort(),isOk=JSON.stringify(chosen)===JSON.stringify(expected);if(isOk)score++;answered++;card.querySelectorAll('.option').forEach(button=>{button.disabled=true;if(q.correct.includes(button.dataset.key))button.classList.add('correct');else if(chosen.includes(button.dataset.key))button.classList.add('wrong')});const validateButton=card.querySelector('.validate');if(validateButton)validateButton.disabled=true;const feedback=card.querySelector('.feedback');feedback.className=`feedback show ${isOk?'ok':'ko'}`;feedback.innerHTML=`<strong>${isOk?'Bonne réponse':'Réponse incorrecte'}.</strong> Réponse${q.correct.length>1?'s':''} attendue${q.correct.length>1?'s':''} : ${q.correct.join(', ')}.<br>${q.explanation}`;document.querySelector('#progress').textContent=`${answered} / ${questions.length} réponses`;document.querySelector('#bar').style.width=`${answered/questions.length*100}%`;if(answered===questions.length)showResult()}
function showResult(){const result=document.querySelector('#result');result.classList.add('show');result.innerHTML=`<h2>Résultat : ${score} / ${questions.length}</h2><p>${score>=8?'Les notions essentielles sont maîtrisées.':score>=6?'Relisez les explications des réponses manquées.':'Reprenez le chapitre et retentez le quiz.'}</p><button class="restart" onclick="location.reload()">Recommencer avec les choix mélangés</button>`}
render();
</script></body></html>
