<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="system-ui, sans-serif">
  <rect width="780" height="460" fill="#0d1117"/>

  <rect x="20" y="15" width="740" height="425" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="40" y="38" fill="#58a6ff" font-size="13" font-weight="bold">VPC — 10.0.0.0/16</text>

  <rect x="45" y="55" width="120" height="30" rx="4" fill="#0d1117" stroke="#f0883e"/>
  <text x="105" y="75" text-anchor="middle" fill="#f0883e" font-size="11">Internet Gateway</text>

  <rect x="45" y="105" width="330" height="150" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="60" y="125" fill="#3fb950" font-size="11" font-weight="bold">Subnet public — AZ-a (10.0.1.0/24)</text>
  <rect x="60" y="140" width="130" height="45" rx="4" fill="#161b22" stroke="#3fb950"/>
  <text x="125" y="158" text-anchor="middle" fill="#e6edf3" font-size="10">ALB</text>
  <text x="125" y="172" text-anchor="middle" fill="#8b949e" font-size="9">Load Balancer</text>
  <rect x="210" y="140" width="150" height="45" rx="4" fill="#161b22" stroke="#3fb950"/>
  <text x="285" y="158" text-anchor="middle" fill="#e6edf3" font-size="10">NAT Gateway</text>
  <text x="285" y="172" text-anchor="middle" fill="#8b949e" font-size="9">accès sortant subnets privés</text>

  <rect x="45" y="270" width="330" height="150" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
  <text x="60" y="290" fill="#d29922" font-size="11" font-weight="bold">Subnet privé — AZ-a (10.0.11.0/24)</text>
  <rect x="60" y="305" width="140" height="45" rx="4" fill="#161b22" stroke="#d29922"/>
  <text x="130" y="323" text-anchor="middle" fill="#e6edf3" font-size="10">EC2 Web</text>
  <text x="130" y="337" text-anchor="middle" fill="#8b949e" font-size="9">SG: 80/443 depuis ALB</text>
  <rect x="220" y="305" width="140" height="45" rx="4" fill="#161b22" stroke="#d29922"/>
  <text x="290" y="323" text-anchor="middle" fill="#e6edf3" font-size="10">RDS</text>
  <text x="290" y="337" text-anchor="middle" fill="#8b949e" font-size="9">SG: 3306 depuis EC2</text>

  <rect x="410" y="105" width="330" height="150" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="425" y="125" fill="#3fb950" font-size="11" font-weight="bold">Subnet public — AZ-b (10.0.2.0/24)</text>
  <text x="575" y="185" text-anchor="middle" fill="#8b949e" font-size="10">(réplique du subnet AZ-a)</text>

  <rect x="410" y="270" width="330" height="150" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="425" y="290" fill="#d29922" font-size="11" font-weight="bold">Subnet privé — AZ-b (10.0.12.0/24)</text>
  <text x="575" y="350" text-anchor="middle" fill="#8b949e" font-size="10">(réplique du subnet AZ-a — HA multi-AZ)</text>

  <line x1="105" y1="85" x2="105" y2="140" stroke="#e6edf3" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="125" y1="185" x2="130" y2="305" stroke="#e6edf3" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="200" y1="327" x2="220" y2="327" stroke="#e6edf3" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="130" y1="305" x2="285" y2="185" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,3"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e6edf3"/>
    </marker>
  </defs>
</svg>
