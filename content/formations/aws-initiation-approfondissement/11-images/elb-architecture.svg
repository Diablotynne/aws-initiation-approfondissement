<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="system-ui, sans-serif">
  <rect width="700" height="340" fill="#0d1117"/>

  <rect x="20" y="140" width="110" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="75" y="165" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Clients</text>
  <text x="75" y="182" text-anchor="middle" fill="#8b949e" font-size="10">Internet</text>

  <rect x="220" y="130" width="160" height="80" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="300" y="160" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">Load Balancer</text>
  <text x="300" y="177" text-anchor="middle" fill="#8b949e" font-size="10">Health checks</text>
  <text x="300" y="192" text-anchor="middle" fill="#8b949e" font-size="10">Routage vers cibles saines</text>

  <rect x="500" y="40" width="150" height="50" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="575" y="61" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">EC2 — AZ-a</text>
  <text x="575" y="77" text-anchor="middle" fill="#8b949e" font-size="10">✓ healthy</text>

  <rect x="500" y="150" width="150" height="50" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="575" y="171" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">EC2 — AZ-b</text>
  <text x="575" y="187" text-anchor="middle" fill="#8b949e" font-size="10">✓ healthy</text>

  <rect x="500" y="260" width="150" height="50" rx="5" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
  <text x="575" y="281" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">EC2 — AZ-c</text>
  <text x="575" y="297" text-anchor="middle" fill="#8b949e" font-size="10">✗ unhealthy (exclue)</text>

  <line x1="130" y1="170" x2="215" y2="170" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="380" y1="150" x2="495" y2="65" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="170" x2="495" y2="175" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="195" x2="495" y2="280" stroke="#f85149" stroke-width="1.2" stroke-dasharray="4,3"/>

  <text x="440" y="235" text-anchor="middle" fill="#8b949e" font-size="10">le trafic n'est jamais</text>
  <text x="440" y="249" text-anchor="middle" fill="#8b949e" font-size="10">envoyé vers une cible unhealthy</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e6edf3"/>
    </marker>
  </defs>
</svg>
