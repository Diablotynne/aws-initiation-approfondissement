<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="system-ui, sans-serif">
  <rect width="700" height="380" fill="#0d1117"/>

  <rect x="280" y="15" width="140" height="45" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="350" y="35" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">Compte racine</text>
  <text x="350" y="50" text-anchor="middle" fill="#8b949e" font-size="10">Organization</text>

  <rect x="90" y="110" width="150" height="45" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="165" y="130" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">OU Production</text>
  <text x="165" y="145" text-anchor="middle" fill="#8b949e" font-size="10">SCP : deny sans MFA</text>

  <rect x="275" y="110" width="150" height="45" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="350" y="130" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">OU Sandbox</text>
  <text x="350" y="145" text-anchor="middle" fill="#8b949e" font-size="10">SCP : deny services coûteux</text>

  <rect x="460" y="110" width="150" height="45" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="535" y="130" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold">OU Sécurité</text>
  <text x="535" y="145" text-anchor="middle" fill="#8b949e" font-size="10">SCP : deny suppression</text>

  <line x1="350" y1="60" x2="165" y2="108" stroke="#8b949e" stroke-width="1.2"/>
  <line x1="350" y1="60" x2="350" y2="108" stroke="#8b949e" stroke-width="1.2"/>
  <line x1="350" y1="60" x2="535" y2="108" stroke="#8b949e" stroke-width="1.2"/>

  <rect x="60" y="200" width="110" height="40" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="115" y="224" text-anchor="middle" fill="#e6edf3" font-size="11">Compte Prod-App</text>

  <rect x="190" y="200" width="110" height="40" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="245" y="224" text-anchor="middle" fill="#e6edf3" font-size="11">Compte Prod-DB</text>

  <rect x="295" y="200" width="110" height="40" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="350" y="224" text-anchor="middle" fill="#e6edf3" font-size="11">Compte Sandbox</text>

  <rect x="480" y="200" width="110" height="40" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="535" y="224" text-anchor="middle" fill="#e6edf3" font-size="11">Compte Audit</text>

  <line x1="165" y1="155" x2="115" y2="198" stroke="#8b949e" stroke-width="1"/>
  <line x1="165" y1="155" x2="245" y2="198" stroke="#8b949e" stroke-width="1"/>
  <line x1="350" y1="155" x2="350" y2="198" stroke="#8b949e" stroke-width="1"/>
  <line x1="535" y1="155" x2="535" y2="198" stroke="#8b949e" stroke-width="1"/>

  <rect x="30" y="290" width="640" height="65" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="350" y="312" text-anchor="middle" fill="#e6edf3" font-size="11">Les SCP (Service Control Policies) s'appliquent au niveau de l'OU et se propagent</text>
  <text x="350" y="328" text-anchor="middle" fill="#e6edf3" font-size="11">automatiquement à tous les comptes qu'elle contient — même les administrateurs IAM</text>
  <text x="350" y="344" text-anchor="middle" fill="#e6edf3" font-size="11">de ces comptes ne peuvent pas outrepasser une SCP en Deny.</text>
</svg>
