<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">Du besoin métier à une architecture AWS</title><desc id="d">Chaîne reliant besoins, modèle cloud, infrastructure AWS, services et Well-Architected.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#17243a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".25"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#67d4ff"/></marker></defs>
<rect width="1200" height="430" rx="24" fill="url(#bg)"/><text x="55" y="58" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Du besoin métier à l’architecture AWS</text><text x="55" y="88" fill="#9fb2c8" font-family="Arial" font-size="16">Une lecture en cinq décisions — pas une liste de services</text>
<g font-family="Arial" filter="url(#s)"><g transform="translate(45 135)"><rect width="190" height="170" rx="18" fill="#243651" stroke="#5aa7ff"/><text x="95" y="44" text-anchor="middle" fill="#7fc4ff" font-size="17" font-weight="700">1 · BESOIN</text><text x="95" y="80" text-anchor="middle" fill="#fff" font-size="15">Valeur métier</text><text x="95" y="106" text-anchor="middle" fill="#fff" font-size="15">Contraintes</text><text x="95" y="132" text-anchor="middle" fill="#fff" font-size="15">Risque</text></g>
<g transform="translate(275 135)"><rect width="190" height="170" rx="18" fill="#243651" stroke="#7c9cff"/><text x="95" y="44" text-anchor="middle" fill="#9fb2ff" font-size="17" font-weight="700">2 · MODÈLE</text><text x="95" y="80" text-anchor="middle" fill="#fff" font-size="15">IaaS · PaaS · SaaS</text><text x="95" y="106" text-anchor="middle" fill="#fff" font-size="15">Public · Hybride</text><text x="95" y="132" text-anchor="middle" fill="#fff" font-size="15">OPEX</text></g>
<g transform="translate(505 135)"><rect width="190" height="170" rx="18" fill="#243651" stroke="#a58aff"/><text x="95" y="44" text-anchor="middle" fill="#c3adff" font-size="17" font-weight="700">3 · PLACEMENT</text><text x="95" y="80" text-anchor="middle" fill="#fff" font-size="15">Région</text><text x="95" y="106" text-anchor="middle" fill="#fff" font-size="15">Zones de disponibilité</text><text x="95" y="132" text-anchor="middle" fill="#fff" font-size="15">Edge locations</text></g>
<g transform="translate(735 135)"><rect width="190" height="170" rx="18" fill="#243651" stroke="#ffad5a"/><text x="95" y="44" text-anchor="middle" fill="#ffc47d" font-size="17" font-weight="700">4 · SERVICES</text><text x="95" y="80" text-anchor="middle" fill="#fff" font-size="15">Calcul · Stockage</text><text x="95" y="106" text-anchor="middle" fill="#fff" font-size="15">Réseau · Données</text><text x="95" y="132" text-anchor="middle" fill="#fff" font-size="15">Sécurité</text></g>
<g transform="translate(965 135)"><rect width="190" height="170" rx="18" fill="#243651" stroke="#5ee2a0"/><text x="95" y="44" text-anchor="middle" fill="#7cebb2" font-size="17" font-weight="700">5 · ÉVALUATION</text><text x="95" y="80" text-anchor="middle" fill="#fff" font-size="15">Sécurité · Fiabilité</text><text x="95" y="106" text-anchor="middle" fill="#fff" font-size="15">Performance · Coût</text><text x="95" y="132" text-anchor="middle" fill="#fff" font-size="15">Durabilité · Ops</text></g></g>
<g stroke="#67d4ff" stroke-width="3" marker-end="url(#a)"><path d="M240 220h28"/><path d="M470 220h28"/><path d="M700 220h28"/><path d="M930 220h28"/></g><text x="600" y="365" text-anchor="middle" fill="#d6e2ef" font-family="Arial" font-size="18">Responsabilité partagée : AWS sécurise le cloud · le client sécurise ce qu’il place dans le cloud</text>
