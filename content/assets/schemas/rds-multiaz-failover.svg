<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui, sans-serif">
  <rect width="800" height="380" fill="#0d1117"/>
  <defs>
    <marker id="arrow-rds" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b949e"/>
    </marker>
    <style>.flow{stroke-dasharray:6 6;animation:move 1.5s linear infinite}@keyframes move{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  </defs>

  <text x="400" y="26" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">RDS Multi-AZ — avant / pendant le failover</text>

  <!-- AVANT -->
  <text x="200" y="52" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Avant failover</text>
  <rect x="30" y="65" width="340" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>

  <rect x="55" y="90" width="130" height="55" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="120" y="110" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">AZ 1a</text>
  <text x="120" y="126" text-anchor="middle" fill="#e6edf3" font-size="10">RDS Primary</text>
  <text x="120" y="139" text-anchor="middle" fill="#8b949e" font-size="8.5">lecture + écriture</text>

  <rect x="215" y="90" width="130" height="55" rx="5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="280" y="110" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold">AZ 1b</text>
  <text x="280" y="126" text-anchor="middle" fill="#e6edf3" font-size="10">RDS Standby</text>
  <text x="280" y="139" text-anchor="middle" fill="#8b949e" font-size="8.5">lecture seule</text>

  <line class="flow" x1="185" y1="117" x2="215" y2="117" stroke="#e6edf3" stroke-width="1.3" marker-end="url(#arrow-rds)"/>
  <text x="200" y="108" text-anchor="middle" fill="#8b949e" font-size="8">sync</text>

  <text x="200" y="170" text-anchor="middle" fill="#8b949e" font-size="9" font-family="ui-monospace, monospace">mysql.xxxxx.rds.amazonaws.com</text>
  <text x="200" y="184" text-anchor="middle" fill="#8b949e" font-size="8.5">réplication synchrone, 0 perte de données</text>
  <text x="200" y="198" text-anchor="middle" fill="#8b949e" font-size="8.5">Standby non accessible en lecture directe</text>

  <!-- PENDANT -->
  <text x="600" y="52" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">Pendant le failover (~30-60s)</text>
  <rect x="430" y="65" width="340" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>

  <rect x="455" y="90" width="130" height="55" rx="5" fill="#161b22" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="520" y="110" text-anchor="middle" fill="#f85149" font-size="10" font-weight="bold">AZ 1a</text>
  <text x="520" y="126" text-anchor="middle" fill="#8b949e" font-size="10">en panne</text>
  <text x="520" y="139" text-anchor="middle" fill="#8b949e" font-size="8.5">détectée par CloudWatch</text>

  <rect x="615" y="90" width="130" height="55" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="680" y="110" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">AZ 1b</text>
  <text x="680" y="126" text-anchor="middle" fill="#e6edf3" font-size="10">promu Primary</text>
  <text x="680" y="139" text-anchor="middle" fill="#8b949e" font-size="8.5">lecture + écriture</text>

  <line class="flow" x1="600" y1="105" x2="615" y2="105" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arrow-rds)"/>

  <text x="600" y="170" text-anchor="middle" fill="#8b949e" font-size="9" font-family="ui-monospace, monospace">même endpoint DNS</text>
  <text x="600" y="184" text-anchor="middle" fill="#8b949e" font-size="8.5">Route 53 bascule le DNS vers le Standby</text>
  <text x="600" y="198" text-anchor="middle" fill="#8b949e" font-size="8.5">aucune reconfiguration applicative</text>

  <line class="flow" x1="370" y1="140" x2="430" y2="140" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-rds)"/>

  <!-- Étapes -->
  <rect x="30" y="240" width="740" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="264" fill="#f0883e" font-size="12" font-weight="bold">Séquence du failover</text>
  <g font-size="10.5" fill="#e6edf3">
    <text x="50" y="288">1. CloudWatch détecte la panne de l'AZ 1a et déclenche une alarme.</text>
    <text x="50" y="306">2. Route 53 met à jour le DNS de l'endpoint vers le Standby (AZ 1b).</text>
    <text x="50" y="324">3. Le Standby est promu Primary et accepte les écritures.</text>
    <text x="420" y="288">4. Perte de données = 0 (réplication était synchrone).</text>
    <text x="420" y="306">5. Downtime réseau ≈ 30-60 s (temps de reconnexion).</text>
    <text x="420" y="324">6. Un nouveau Standby est recréé (~5 min) dans l'AZ redevenue saine.</text>
  </g>

  <text x="400" y="374" text-anchor="middle" fill="#8b949e" font-size="9.5" font-style="italic">Coût : Multi-AZ double le prix de l'instance RDS (instance Standby dédiée au failover)</text>
</svg>
