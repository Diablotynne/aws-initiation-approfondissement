<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="system-ui, sans-serif" role="img" aria-labelledby="dawan-title dawan-desc">
<title id="dawan-title">Architecture microservices : CloudFront vers ALB, distribué vers Auth/Cart/Payment/Recomend puis vers RDS/DynamoDB/S3</title>
<desc id="dawan-desc">Clarifier le sens de lecture par flèches continues, étapes numérotées, frontières de responsabilité et légende compacte des couleurs. Ajouter dans le SVG une palette à contraste WCAG, des variables de couleur et une variante interne `prefers-color-scheme: dark`, avec contours lisibles dans les deux modes. Préparer des groupes SVG identifiés par étape, avec survol mettant en évidence l&#x27;étape et animation discrète du chemin ; rendu statique complet si l&#x27;animation est indisponible. Le contenu, les libellés et le sens pédagogique d&#x27;origine sont conservés.</desc>
<style id="dawan-adaptive-accessibility"><![CDATA[
  svg { color-scheme: light dark; isolation: isolate; text-rendering: geometricPrecision; }
  text { font-synthesis: none; paint-order: stroke fill; stroke: rgba(248,250,252,.20); stroke-width: .28px; stroke-linejoin: round; }
  path, line, polyline, polygon { vector-effect: non-scaling-stroke; }
  g[id] { transition: filter .18s ease, opacity .18s ease, transform .18s ease; transform-origin: center; }
  g[id]:hover, g[id]:focus { filter: brightness(1.13) saturate(1.10) drop-shadow(0 2px 3px rgba(14,165,233,.24)); outline: none; }
  g[id]:hover path[marker-end], g[id]:focus path[marker-end] { stroke-dasharray: 8 5; animation: dawan-flow .8s linear infinite; }
  .dawan-theme-backdrop { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
  @keyframes dawan-flow { to { stroke-dashoffset: -13; } }
  @media (prefers-color-scheme: dark) {
    .dawan-theme-backdrop { stroke: #7dd3fc; }
    text { stroke: rgba(2,6,23,.28); }
  }
  @media (prefers-reduced-motion: reduce) { g[id], g[id] path { transition: none !important; animation: none !important; } }
  @media print { g[id] { filter: none !important; } }
]]></style>

  <rect width="700" height="320" fill="#0d1117"/>
  <text x="350" y="30" text-anchor="middle" fill="#8b949e" font-size="12">Application e-commerce avec microservices sur ECS/Fargate</text>

  <rect x="270" y="45" width="160" height="35" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="350" y="67" text-anchor="middle" fill="#e6edf3" font-size="12">CloudFront (CDN)</text>
  <line class="flow" x1="350" y1="80" x2="350" y2="105" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a9)"/>
  <defs>
    <marker id="a9" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b949e"/>
    </marker>
    <style>.flow{stroke-dasharray:6 6;animation:move 1.5s linear infinite}@keyframes move{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  </defs>

  <rect x="270" y="110" width="160" height="35" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="350" y="132" text-anchor="middle" fill="#e6edf3" font-size="12">ALB (Load Balancer)</text>

  <line x1="350" y1="145" x2="350" y2="165" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="90" y1="165" x2="610" y2="165" stroke="#8b949e" stroke-width="1.5"/>
  <line class="flow" x1="90" y1="165" x2="90" y2="185" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a9)"/>
  <line class="flow" x1="270" y1="165" x2="270" y2="185" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a9)"/>
  <line class="flow" x1="450" y1="165" x2="450" y2="185" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a9)"/>
  <line class="flow" x1="610" y1="165" x2="610" y2="185" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a9)"/>

  <rect x="30" y="190" width="120" height="55" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="90" y="212" text-anchor="middle" fill="#e6edf3" font-size="12">Auth Service</text>
  <text x="90" y="230" text-anchor="middle" fill="#8b949e" font-size="10">(Fargate)</text>

  <rect x="210" y="190" width="120" height="55" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="270" y="212" text-anchor="middle" fill="#e6edf3" font-size="12">Cart Service</text>
  <text x="270" y="230" text-anchor="middle" fill="#8b949e" font-size="10">(Fargate)</text>

  <rect x="390" y="190" width="120" height="55" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="450" y="212" text-anchor="middle" fill="#e6edf3" font-size="12">Payment Service</text>
  <text x="450" y="230" text-anchor="middle" fill="#8b949e" font-size="10">(ECS)</text>

  <rect x="550" y="190" width="120" height="55" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="610" y="212" text-anchor="middle" fill="#e6edf3" font-size="12">Recomend.</text>
  <text x="610" y="230" text-anchor="middle" fill="#8b949e" font-size="10">(Lambda)</text>

  <line class="flow" x1="350" y1="245" x2="350" y2="270" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a9)"/>
  <rect x="150" y="275" width="400" height="35" rx="5" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="350" y="297" text-anchor="middle" fill="#e6edf3" font-size="12">RDS / DynamoDB / S3 (bases de données partagées)</text>
</svg>
