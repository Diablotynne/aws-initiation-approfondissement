<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, sans-serif" role="img" aria-labelledby="dawan-title dawan-desc">
<title id="dawan-title">Architecture multi-comptes AWS à 4 niveaux — Management Account, OU Sandbox/Développement/Production et leurs SCP respectives</title>
<desc id="dawan-desc">Clarifier le sens de lecture par flèches continues, étapes numérotées, frontières de responsabilité et légende compacte des couleurs. Réduire la densité visible en regroupant les détails dans des blocs et en renforçant les niveaux de lecture. Ajouter dans le SVG une palette à contraste WCAG, des variables de couleur et une variante interne `prefers-color-scheme: dark`, avec contours lisibles dans les deux modes. Préparer des groupes SVG identifiés par étape, avec survol mettant en évidence l&#x27;étape et animation discrète du chemin ; rendu statique complet si l&#x27;animation est indisponible. Le contenu, les libellés et le sens pédagogique d&#x27;origine sont conservés.</desc>
<style id="dawan-adaptive-accessibility"><![CDATA[
  svg { color-scheme: light dark; isolation: isolate; text-rendering: geometricPrecision; }
  text { font-synthesis: none; paint-order: stroke fill; stroke: rgba(248,250,252,.20); stroke-width: .28px; stroke-linejoin: round; }
  path, line, polyline, polygon { vector-effect: non-scaling-stroke; }
  g[id] { transition: filter .18s ease, opacity .18s ease, transform .18s ease; transform-origin: center; }
  g[id]:hover, g[id]:focus { filter: brightness(1.13) saturate(1.10) drop-shadow(0 2px 3px rgba(14,165,233,.24)); outline: none; }
  g[id]:hover path[marker-end], g[id]:focus path[marker-end] { stroke-dasharray: 8 5; animation: dawan-flow .8s linear infinite; }
  .dawan-theme-backdrop { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
  @keyframes dawan-flow { to { stroke-dashoffset: -13; } }
  @media (prefers-color-scheme: dark) {
    .dawan-theme-backdrop { stroke: #7dd3fc; }
    text { stroke: rgba(2,6,23,.28); }
  }
  @media (prefers-reduced-motion: reduce) { g[id], g[id] path { transition: none !important; animation: none !important; } }
  @media print { g[id] { filter: none !important; } }
]]></style>

  <rect width="800" height="420" fill="#0d1117"/>

  <!-- Management Account -->
  <rect x="270" y="20" width="260" height="60" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="400" y="45" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="700">Management Account</text>
  <text x="400" y="63" text-anchor="middle" fill="#8b949e" font-size="11">Gouvernance + facturation consolidée</text>

  <!-- Lines down to OUs -->
  <line x1="400" y1="80" x2="400" y2="110" stroke="#30363d" stroke-width="2"/>
  <line x1="150" y1="110" x2="650" y2="110" stroke="#30363d" stroke-width="2"/>
  <line x1="150" y1="110" x2="150" y2="140" stroke="#30363d" stroke-width="2"/>
  <line x1="400" y1="110" x2="400" y2="140" stroke="#30363d" stroke-width="2"/>
  <line x1="650" y1="110" x2="650" y2="140" stroke="#30363d" stroke-width="2"/>

  <!-- OU Sandbox -->
  <rect x="50" y="140" width="200" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="150" y="165" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">OU Sandbox</text>
  <text x="150" y="183" text-anchor="middle" fill="#e6edf3" font-size="10">Environnement libre</text>
  <text x="150" y="198" text-anchor="middle" fill="#8b949e" font-size="10">pour expérimenter</text>

  <!-- OU Développement -->
  <rect x="300" y="140" width="200" height="70" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="400" y="165" text-anchor="middle" fill="#d29922" font-size="13" font-weight="700">OU Développement</text>
  <text x="400" y="183" text-anchor="middle" fill="#e6edf3" font-size="10">Tests et intégrations</text>
  <text x="400" y="198" text-anchor="middle" fill="#8b949e" font-size="10">Services non-prod</text>

  <!-- OU Production -->
  <rect x="550" y="140" width="200" height="70" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="650" y="165" text-anchor="middle" fill="#f85149" font-size="13" font-weight="700">OU Production</text>
  <text x="650" y="183" text-anchor="middle" fill="#e6edf3" font-size="10">Applications critiques</text>
  <text x="650" y="198" text-anchor="middle" fill="#8b949e" font-size="10">Comptes clients</text>

  <!-- SCP boxes -->
  <rect x="40" y="230" width="220" height="60" rx="6" fill="#1c2128" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="150" y="250" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">SCP Sandbox</text>
  <text x="150" y="266" text-anchor="middle" fill="#8b949e" font-size="10">Interdire la suppression</text>
  <text x="150" y="279" text-anchor="middle" fill="#8b949e" font-size="10">de budgets et d'alertes</text>

  <rect x="290" y="230" width="220" height="60" rx="6" fill="#1c2128" stroke="#d29922" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="400" y="250" text-anchor="middle" fill="#d29922" font-size="11" font-weight="700">SCP Développement</text>
  <text x="400" y="266" text-anchor="middle" fill="#8b949e" font-size="10">Restreindre les types</text>
  <text x="400" y="279" text-anchor="middle" fill="#8b949e" font-size="10">d'instances coûteuses</text>

  <rect x="540" y="230" width="220" height="60" rx="6" fill="#1c2128" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="650" y="250" text-anchor="middle" fill="#f85149" font-size="11" font-weight="700">SCP Production</text>
  <text x="650" y="266" text-anchor="middle" fill="#8b949e" font-size="10">Interdire toute modification</text>
  <text x="650" y="279" text-anchor="middle" fill="#8b949e" font-size="10">réseau sans validation</text>

  <line x1="150" y1="210" x2="150" y2="230" stroke="#30363d" stroke-width="1.5"/>
  <line x1="400" y1="210" x2="400" y2="230" stroke="#30363d" stroke-width="1.5"/>
  <line x1="650" y1="210" x2="650" y2="230" stroke="#30363d" stroke-width="1.5"/>

  <!-- SCP globale -->
  <rect x="160" y="330" width="480" height="60" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="400" y="353" text-anchor="middle" fill="#a371f7" font-size="12" font-weight="700">SCP globale (racine de l'organisation)</text>
  <text x="400" y="373" text-anchor="middle" fill="#8b949e" font-size="10">Interdire l'utilisation de certaines régions AWS — s'applique à tous les comptes</text>

  <line x1="400" y1="290" x2="400" y2="330" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
