<style>.n{fill:#172a46;stroke:#6fa8dc;stroke-width:2}.h{fill:#ffb347;font:700 22px system-ui}.p{fill:#e8f0fa;font:16px system-ui}.f{fill:none;stroke:#ff9900;stroke-width:4;stroke-dasharray:12 8;marker-end:url(#a);animation:m 2s linear infinite}@keyframes m{to{stroke-dashoffset:-40}}@media(prefers-reduced-motion:reduce){.f{animation:none}}</style>
