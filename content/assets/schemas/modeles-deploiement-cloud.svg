<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Cloud public, cloud privé, cloud hybride et multicloud</title>
  <desc id="desc">Quatre modèles sont distingués selon la propriété, l'exploitation et les interconnexions des environnements.</desc>
  <defs><style>.h{font:700 24px Arial,sans-serif;fill:#172f4f}.s{font:700 20px Arial,sans-serif;fill:#172f4f}.p{font:16px Arial,sans-serif;fill:#334155}.card{fill:#fff;stroke:#64748b;stroke-width:2}.public{fill:#e8f1fb}.private{fill:#edf7ef}.hybrid{fill:#fff3df}.multi{fill:#f2eafa}.link{stroke:#355a7a;stroke-width:4;stroke-dasharray:9 6}</style></defs>
  <rect width="1000" height="560" rx="24" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" class="h">Modèles de déploiement : ne pas confondre hybride et multicloud</text>
  <g><rect class="card public" x="50" y="80" width="420" height="175" rx="20"/><text x="260" y="120" text-anchor="middle" class="s">Cloud public</text><path d="M205 180c0-28 24-50 53-46 12-27 54-23 61 7 28-1 44 17 44 39 0 24-19 43-44 43H215c-28 0-45-18-45-42 0-20 14-36 35-39z" fill="#2874a6"/><text x="260" y="205" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">Fournisseur cloud</text><text x="260" y="242" text-anchor="middle" class="p">Ressources mutualisées, isolation logique</text></g>
  <g><rect class="card private" x="530" y="80" width="420" height="175" rx="20"/><text x="740" y="120" text-anchor="middle" class="s">Cloud privé</text><rect x="665" y="145" width="150" height="72" rx="8" fill="#2f855a"/><path d="M680 165h120M680 183h120M680 201h120" stroke="#fff" stroke-width="4"/><text x="740" y="242" text-anchor="middle" class="p">Usage exclusif d'une organisation</text></g>
  <g><rect class="card hybrid" x="50" y="305" width="420" height="190" rx="20"/><text x="260" y="345" text-anchor="middle" class="s">Cloud hybride</text><rect x="105" y="385" width="120" height="65" rx="8" fill="#2f855a"/><path d="M300 422c0-20 17-35 38-32 9-19 38-16 43 5 20-1 31 12 31 28 0 17-14 30-31 30h-72c-20 0-32-13-32-30 0-14 10-26 23-27z" fill="#2874a6"/><path class="link" d="M225 418H292"/><text x="260" y="480" text-anchor="middle" class="p">Environnements distincts reliés</text></g>
  <g><rect class="card multi" x="530" y="305" width="420" height="190" rx="20"/><text x="740" y="345" text-anchor="middle" class="s">Multicloud</text><circle cx="650" cy="416" r="54" fill="#2874a6"/><circle cx="830" cy="416" r="54" fill="#7b4fa3"/><text x="650" y="422" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">Cloud A</text><text x="830" y="422" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">Cloud B</text><text x="740" y="480" text-anchor="middle" class="p">Plusieurs fournisseurs publics</text></g>
  <text x="500" y="535" text-anchor="middle" class="p">Le choix dépend des contraintes de données, de réseau, d'exploitation, de réversibilité et de conformité.</text>
</svg>
