<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, sans-serif" role="img" aria-labelledby="dawan-title dawan-desc">
<title id="dawan-title">Trois topologies côte à côte : Cloud public avec infrastructure AWS partagée entre plusieurs clients, Cloud privé avec infrastructure dédiée à une seule organisation, Cloud hybride reliant un site interne à AWS via une connexion sécurisée</title>
<desc id="dawan-desc">Clarifier le sens de lecture par flèches continues, étapes numérotées, frontières de responsabilité et légende compacte des couleurs. Réduire la densité visible en regroupant les détails dans des blocs et en renforçant les niveaux de lecture. Ajouter dans le SVG une palette à contraste WCAG, des variables de couleur et une variante interne `prefers-color-scheme: dark`, avec contours lisibles dans les deux modes. Préparer des groupes SVG identifiés par étape, avec survol mettant en évidence l&#x27;étape et animation discrète du chemin ; rendu statique complet si l&#x27;animation est indisponible. Le contenu, les libellés et le sens pédagogique d&#x27;origine sont conservés.</desc>
<style id="dawan-adaptive-accessibility"><![CDATA[
  svg { color-scheme: light dark; isolation: isolate; text-rendering: geometricPrecision; }
  text { font-synthesis: none; paint-order: stroke fill; stroke: rgba(248,250,252,.20); stroke-width: .28px; stroke-linejoin: round; }
  path, line, polyline, polygon { vector-effect: non-scaling-stroke; }
  g[id] { transition: filter .18s ease, opacity .18s ease, transform .18s ease; transform-origin: center; }
  g[id]:hover, g[id]:focus { filter: brightness(1.13) saturate(1.10) drop-shadow(0 2px 3px rgba(14,165,233,.24)); outline: none; }
  g[id]:hover path[marker-end], g[id]:focus path[marker-end] { stroke-dasharray: 8 5; animation: dawan-flow .8s linear infinite; }
  .dawan-theme-backdrop { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
  @keyframes dawan-flow { to { stroke-dashoffset: -13; } }
  @media (prefers-color-scheme: dark) {
    .dawan-theme-backdrop { stroke: #7dd3fc; }
    text { stroke: rgba(2,6,23,.28); }
  }
  @media (prefers-reduced-motion: reduce) { g[id], g[id] path { transition: none !important; animation: none !important; } }
  @media print { g[id] { filter: none !important; } }
]]></style>

  <rect x="0" y="0" width="900" height="460" rx="16" fill="#0d1117"/>
  <text x="450" y="38" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">Les trois modèles de déploiement du Cloud</text>

  <!-- Cloud public -->
  <g>
    <rect x="40" y="80" width="240" height="300" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="160" y="110" text-anchor="middle" fill="#f0883e" font-size="15" font-weight="700">Cloud Public</text>
    <rect x="60" y="130" width="90" height="60" rx="6" fill="#3d5a80"/>
    <text x="105" y="164" text-anchor="middle" fill="#fff" font-size="11">Client A</text>
    <rect x="170" y="130" width="90" height="60" rx="6" fill="#3d5a80"/>
    <text x="215" y="164" text-anchor="middle" fill="#fff" font-size="11">Client B</text>
    <rect x="60" y="200" width="200" height="70" rx="6" fill="#21262d" stroke="#8957e5"/>
    <text x="160" y="240" text-anchor="middle" fill="#e6edf3" font-size="12">Infrastructure AWS</text>
    <text x="160" y="255" text-anchor="middle" fill="#8b949e" font-size="10">partagée entre tous les clients</text>
    <text x="160" y="300" text-anchor="middle" fill="#8b949e" font-size="11">Ressources mutualisées,</text>
    <text x="160" y="316" text-anchor="middle" fill="#8b949e" font-size="11">accès via Internet</text>
    <text x="160" y="355" text-anchor="middle" fill="#8b949e" font-size="10">Ex. compte AWS standard</text>
  </g>

  <!-- Cloud privé -->
  <g>
    <rect x="330" y="80" width="240" height="300" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="450" y="110" text-anchor="middle" fill="#f0883e" font-size="15" font-weight="700">Cloud Privé</text>
    <rect x="350" y="130" width="200" height="60" rx="6" fill="#3d5a80"/>
    <text x="450" y="164" text-anchor="middle" fill="#fff" font-size="11">Une seule organisation</text>
    <rect x="350" y="200" width="200" height="70" rx="6" fill="#21262d" stroke="#8957e5"/>
    <text x="450" y="235" text-anchor="middle" fill="#e6edf3" font-size="12">Infrastructure dédiée</text>
    <text x="450" y="250" text-anchor="middle" fill="#8b949e" font-size="10">(datacenter interne ou AWS Outposts)</text>
    <text x="450" y="300" text-anchor="middle" fill="#8b949e" font-size="11">Contrôle total, coût fixe élevé,</text>
    <text x="450" y="316" text-anchor="middle" fill="#8b949e" font-size="11">conformité renforcée</text>
    <text x="450" y="355" text-anchor="middle" fill="#8b949e" font-size="10">Ex. AWS Outposts</text>
  </g>

  <!-- Cloud hybride -->
  <g>
    <rect x="620" y="80" width="240" height="300" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="740" y="110" text-anchor="middle" fill="#f0883e" font-size="15" font-weight="700">Cloud Hybride</text>
    <rect x="640" y="130" width="90" height="55" rx="6" fill="#3d5a80"/>
    <text x="685" y="162" text-anchor="middle" fill="#fff" font-size="10">Sur site</text>
    <rect x="750" y="130" width="90" height="55" rx="6" fill="#8957e5"/>
    <text x="795" y="162" text-anchor="middle" fill="#fff" font-size="10">AWS</text>
    <line class="flow" x1="730" y1="157" x2="750" y2="157" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrow)"/>
    <line class="flow" x1="750" y1="167" x2="730" y2="167" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="640" y="200" width="200" height="70" rx="6" fill="#21262d" stroke="#8957e5"/>
    <text x="740" y="230" text-anchor="middle" fill="#e6edf3" font-size="12">Connexion sécurisée</text>
    <text x="740" y="246" text-anchor="middle" fill="#8b949e" font-size="10">(VPN Site-to-Site, Direct Connect)</text>
    <text x="740" y="300" text-anchor="middle" fill="#8b949e" font-size="11">Le meilleur des deux mondes,</text>
    <text x="740" y="316" text-anchor="middle" fill="#8b949e" font-size="11">migration progressive</text>
    <text x="740" y="355" text-anchor="middle" fill="#8b949e" font-size="10">Ex. AWS Direct Connect + VPN</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e6edf3"/>
    </marker>
    <style>.flow{stroke-dasharray:5 5;animation:move 1.4s linear infinite}@keyframes move{to{stroke-dashoffset:-20}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  </defs>
</svg>
