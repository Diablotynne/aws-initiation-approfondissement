<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Modèles de déploiement du cloud</title>
  <desc id="desc">Le NIST distingue les clouds public, privé, communautaire et hybride. Le multicloud est une stratégie utilisant plusieurs fournisseurs.</desc>
  <defs><style>.title{font:700 30px Arial,sans-serif;fill:#172f4f}.head{font:700 22px Arial,sans-serif;fill:#172f4f}.txt{font:16px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#475569}.card{stroke:#64748b;stroke-width:2}.link{stroke:#e07b00;stroke-width:5;stroke-dasharray:10 7;fill:none}</style></defs>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" class="title">Où s’exécutent les ressources et qui les utilise ?</text>
  <g><rect class="card" x="50" y="85" width="340" height="220" rx="20" fill="#e8f1fb"/><text x="220" y="122" text-anchor="middle" class="head">Cloud public</text><path d="M130 195c0-25 22-44 47-40 11-25 48-21 55 6 25-1 40 15 40 35 0 21-18 38-40 38h-92c-25 0-40-16-40-38 0-18 13-32 30-35z" fill="#2874a6"/><text x="190" y="264" text-anchor="middle" class="txt">Ouvert à de nombreux clients</text><text x="190" y="286" text-anchor="middle" class="small">Infrastructure chez le fournisseur</text></g>
  <g><rect class="card" x="430" y="85" width="340" height="220" rx="20" fill="#edf7ef"/><text x="600" y="122" text-anchor="middle" class="head">Cloud privé</text><rect x="530" y="153" width="140" height="82" rx="10" fill="#2f855a"/><path d="M548 175h104M548 194h104M548 213h104" stroke="#fff" stroke-width="5"/><text x="600" y="264" text-anchor="middle" class="txt">Usage exclusif d’une organisation</text><text x="600" y="286" text-anchor="middle" class="small">Sur site ou hébergé par un tiers</text></g>
  <g><rect class="card" x="810" y="85" width="340" height="220" rx="20" fill="#f2eafa"/><text x="980" y="122" text-anchor="middle" class="head">Cloud communautaire</text><circle cx="925" cy="188" r="31" fill="#7b4fa3"/><circle cx="980" cy="166" r="31" fill="#7b4fa3"/><circle cx="1035" cy="188" r="31" fill="#7b4fa3"/><text x="980" y="264" text-anchor="middle" class="txt">Organisations aux enjeux communs</text><text x="980" y="286" text-anchor="middle" class="small">Mission, sécurité ou conformité partagée</text></g>
  <g><rect class="card" x="145" y="355" width="430" height="225" rx="20" fill="#fff3df"/><text x="360" y="394" text-anchor="middle" class="head">Cloud hybride</text><rect x="205" y="435" width="115" height="68" rx="8" fill="#2f855a"/><path d="M420 469c0-19 17-34 36-30 9-19 37-16 43 5 20-1 31 12 31 27 0 17-14 30-31 30h-67c-20 0-32-13-32-30 0-14 8-24 20-27z" fill="#2874a6"/><path class="link" d="M320 469h83"/><text x="360" y="546" text-anchor="middle" class="txt">Deux environnements distincts reliés</text><text x="360" y="568" text-anchor="middle" class="small">Données et applications peuvent circuler</text></g>
  <g><rect class="card" x="625" y="355" width="430" height="225" rx="20" fill="#eef2ff"/><text x="840" y="394" text-anchor="middle" class="head">Multicloud</text><circle cx="750" cy="470" r="58" fill="#2874a6"/><circle cx="930" cy="470" r="58" fill="#7b4fa3"/><text x="750" y="476" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">Cloud A</text><text x="930" y="476" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">Cloud B</text><text x="840" y="546" text-anchor="middle" class="txt">Plusieurs fournisseurs</text><text x="840" y="568" text-anchor="middle" class="small">Pas nécessairement interconnectés</text></g>
  <rect x="110" y="625" width="980" height="52" rx="14" fill="#e8eef6"/><text x="600" y="657" text-anchor="middle" class="head">Hybride décrit une composition ; multicloud décrit la pluralité des fournisseurs.</text>
</svg>
