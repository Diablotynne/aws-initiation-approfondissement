<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="system-ui, sans-serif">
  <rect width="760" height="260" fill="#0d1117"/>

  <rect x="20" y="20" width="220" height="200" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="130" y="45" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">CloudFormation</text>
  <text x="130" y="70" text-anchor="middle" fill="#e6edf3" font-size="10">Provisionnement</text>
  <text x="130" y="86" text-anchor="middle" fill="#e6edf3" font-size="10">d'infrastructure (IaC)</text>
  <text x="130" y="110" text-anchor="middle" fill="#8b949e" font-size="9">Crée VPC, EC2, RDS...</text>
  <text x="130" y="126" text-anchor="middle" fill="#8b949e" font-size="9">déclaratif, versionné</text>
  <text x="130" y="150" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">✓ Actif — recommandé</text>

  <rect x="270" y="20" width="220" height="200" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="2" opacity="0.6"/>
  <text x="380" y="45" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="bold">OpsWorks</text>
  <text x="380" y="70" text-anchor="middle" fill="#8b949e" font-size="10">Gestion de configuration</text>
  <text x="380" y="86" text-anchor="middle" fill="#8b949e" font-size="10">via Chef / Puppet</text>
  <text x="380" y="110" text-anchor="middle" fill="#8b949e" font-size="9">Installe et configure</text>
  <text x="380" y="126" text-anchor="middle" fill="#8b949e" font-size="9">le logiciel sur EC2 existant</text>
  <text x="380" y="150" text-anchor="middle" fill="#f85149" font-size="10" font-weight="bold">✗ Fin de vie (EOS 2024)</text>

  <rect x="520" y="20" width="220" height="200" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="630" y="45" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Systems Manager</text>
  <text x="630" y="70" text-anchor="middle" fill="#e6edf3" font-size="10">Gestion opérationnelle</text>
  <text x="630" y="86" text-anchor="middle" fill="#e6edf3" font-size="10">et patching des instances</text>
  <text x="630" y="110" text-anchor="middle" fill="#8b949e" font-size="9">Run Command, Session Manager,</text>
  <text x="630" y="126" text-anchor="middle" fill="#8b949e" font-size="9">Patch Manager, State Manager</text>
  <text x="630" y="150" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">✓ Actif — remplacement OpsWorks</text>

  <text x="380" y="245" text-anchor="middle" fill="#8b949e" font-size="10">CloudFormation crée l'infrastructure ; Systems Manager la maintient et l'opère au quotidien.</text>
</svg>
