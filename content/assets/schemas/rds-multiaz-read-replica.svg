<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Différence entre un déploiement RDS Multi-AZ et une réplique en lecture</title><desc id="desc">Multi-AZ vise la disponibilité avec réplication synchrone et basculement, tandis qu'une réplique en lecture sert les lectures avec réplication asynchrone.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#527aa3"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px}.panel{fill:#eef3f8;stroke:#527aa3;stroke-width:3}.db{fill:#527aa3;stroke:#172033;stroke-width:2}.rep{fill:#ff9900;stroke:#172033;stroke-width:2}.white{fill:#fff;font-weight:700}.arrow{stroke:#527aa3;stroke-width:4;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:8 6}</style>
  <text class="t" x="500" y="35" text-anchor="middle">Disponibilité et montée en charge ne répondent pas au même besoin</text>
  <rect class="panel" x="30" y="70" width="450" height="320" rx="16"/><text class="h" x="255" y="105" text-anchor="middle">Déploiement Multi-AZ</text><rect class="db" x="80" y="160" width="140" height="75" rx="12"/><text class="white" x="150" y="193" text-anchor="middle">Principal</text><text class="white" x="150" y="215" text-anchor="middle">AZ A</text><path class="arrow" d="M220 198H300"/><text class="s" x="260" y="182" text-anchor="middle">synchrone</text><rect class="rep" x="310" y="160" width="120" height="75" rx="12"/><text class="white" x="370" y="193" text-anchor="middle">Secours</text><text class="white" x="370" y="215" text-anchor="middle">AZ B</text><text class="s" x="255" y="285" text-anchor="middle">Objectif : basculement et disponibilité</text><text class="s" x="255" y="310" text-anchor="middle">Les connexions doivent savoir se rétablir</text>
  <rect class="panel" x="520" y="70" width="450" height="320" rx="16"/><text class="h" x="745" y="105" text-anchor="middle">Réplique en lecture</text><rect class="db" x="570" y="160" width="140" height="75" rx="12"/><text class="white" x="640" y="193" text-anchor="middle">Instance source</text><text class="white" x="640" y="215" text-anchor="middle">écritures</text><path class="arrow dash" d="M710 198H790"/><text class="s" x="750" y="182" text-anchor="middle">asynchrone</text><rect class="rep" x="800" y="160" width="120" height="75" rx="12"/><text class="white" x="860" y="193" text-anchor="middle">Réplique</text><text class="white" x="860" y="215" text-anchor="middle">lectures</text><text class="s" x="745" y="285" text-anchor="middle">Objectif : décharger les lectures</text><text class="s" x="745" y="310" text-anchor="middle">Un retard de réplication est possible</text>
</svg>
