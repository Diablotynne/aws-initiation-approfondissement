<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Familles de services AWS autour d’une application</title><desc id="desc">Une application AWS combine généralement des services de calcul, stockage, réseau, données, sécurité, observabilité, intégration et automatisation.</desc><defs><style>.title{font:700 30px Arial,sans-serif;fill:#172f4f}.head{font:700 19px Arial,sans-serif;fill:#172f4f}.txt{font:15px Arial,sans-serif;fill:#334155}.line{stroke:#94a3b8;stroke-width:3}</style></defs><rect width="1200" height="700" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" class="title">Une architecture AWS assemble plusieurs familles de services</text><g class="line"><path d="M600 350L230 150M600 350L600 145M600 350L970 150M600 350L190 350M600 350L1010 350M600 350L230 550M600 350L600 565M600 350L970 550"/></g><rect x="470" y="285" width="260" height="130" rx="28" fill="#172f4f"/><text x="600" y="340" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">APPLICATION</text><text x="600" y="375" text-anchor="middle" fill="#ffb347" font-family="Arial" font-size="17">Besoin métier</text><g><rect x="80" y="90" width="300" height="120" rx="18" fill="#eef6ff" stroke="#2563a6" stroke-width="2"/><text x="230" y="130" text-anchor="middle" class="head">Calcul</text><text x="230" y="165" text-anchor="middle" class="txt">EC2 · Lambda · ECS</text><rect x="450" y="75" width="300" height="120" rx="18" fill="#edf7ef" stroke="#2f855a" stroke-width="2"/><text x="600" y="115" text-anchor="middle" class="head">Stockage</text><text x="600" y="150" text-anchor="middle" class="txt">S3 · EBS · EFS</text><rect x="820" y="90" width="300" height="120" rx="18" fill="#f2eafa" stroke="#7b4fa3" stroke-width="2"/><text x="970" y="130" text-anchor="middle" class="head">Données</text><text x="970" y="165" text-anchor="middle" class="txt">RDS · DynamoDB · ElastiCache</text><rect x="40" y="290" width="300" height="120" rx="18" fill="#fff3df" stroke="#e07b00" stroke-width="2"/><text x="190" y="330" text-anchor="middle" class="head">Réseau et diffusion</text><text x="190" y="365" text-anchor="middle" class="txt">VPC · Route 53 · CloudFront</text><rect x="860" y="290" width="300" height="120" rx="18" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="1010" y="330" text-anchor="middle" class="head">Sécurité</text><text x="1010" y="365" text-anchor="middle" class="txt">IAM · KMS · WAF</text><rect x="80" y="490" width="300" height="120" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="230" y="530" text-anchor="middle" class="head">Observabilité</text><text x="230" y="565" text-anchor="middle" class="txt">CloudWatch · CloudTrail</text><rect x="450" y="505" width="300" height="120" rx="18" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><text x="600" y="545" text-anchor="middle" class="head">Intégration</text><text x="600" y="580" text-anchor="middle" class="txt">SQS · SNS · EventBridge</text><rect x="820" y="490" width="300" height="120" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="970" y="530" text-anchor="middle" class="head">Automatisation</text><text x="970" y="565" text-anchor="middle" class="txt">CloudFormation · Systems Manager</text></g><text x="600" y="670" text-anchor="middle" class="txt">Le besoin guide le choix ; le nom du service vient ensuite.</text></svg>
