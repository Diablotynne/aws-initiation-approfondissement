<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
  <title id="title">Cycle de vie d'un objet Amazon S3</title><desc id="desc">Une règle de cycle de vie peut faire transiter un objet entre classes éligibles puis l'expirer, sous réserve des contraintes de chaque classe.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#527aa3"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:13px}.box{fill:#eef3f8;stroke:#527aa3;stroke-width:3}.archive{fill:#fff3df;stroke:#ff9900;stroke-width:3}.end{fill:#fbeaea;stroke:#b43b3b;stroke-width:3}.arrow{stroke:#527aa3;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <text class="t" x="500" y="35" text-anchor="middle">Une règle S3 Lifecycle automatise les transitions</text>
  <rect class="box" x="35" y="105" width="170" height="105" rx="14"/><text class="h" x="120" y="140" text-anchor="middle">Création</text><text class="s" x="120" y="170" text-anchor="middle">Classe initiale</text><text class="s" x="120" y="190" text-anchor="middle">définie à l'écriture</text>
  <path class="arrow" d="M205 158H280"/><rect class="box" x="290" y="105" width="180" height="105" rx="14"/><text class="h" x="380" y="140" text-anchor="middle">Transition</text><text class="s" x="380" y="170" text-anchor="middle">Classe moins fréquente</text><text class="s" x="380" y="190" text-anchor="middle">si elle est éligible</text>
  <path class="arrow" d="M470 158H545"/><rect class="archive" x="555" y="105" width="180" height="105" rx="14"/><text class="h" x="645" y="140" text-anchor="middle">Archivage</text><text class="s" x="645" y="170" text-anchor="middle">Délai de restauration</text><text class="s" x="645" y="190" text-anchor="middle">à intégrer au besoin</text>
  <path class="arrow" d="M735 158H810"/><rect class="end" x="820" y="105" width="145" height="105" rx="14"/><text class="h" x="892" y="140" text-anchor="middle">Expiration</text><text class="s" x="892" y="170" text-anchor="middle">Suppression selon</text><text class="s" x="892" y="190" text-anchor="middle">la règle définie</text>
  <rect x="180" y="260" width="640" height="55" rx="10" fill="#e8f6ed"/><text class="s" x="500" y="284" text-anchor="middle">La règle porte sur un préfixe ou des tags et peut distinguer version courante,</text><text class="s" x="500" y="303" text-anchor="middle">versions non courantes et marqueurs de suppression.</text>
</svg>
