<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .aws-orange { fill: #FF9900; stroke: #1A365D; stroke-width: 2; }
      .aws-navy { fill: #1A365D; stroke: #1A365D; stroke-width: 2; }
      .aws-green { fill: #38A169; stroke: #1A365D; stroke-width: 2; }
      .aws-blue { fill: #3182CE; stroke: #1A365D; stroke-width: 2; }
      .text-white { fill: white; font-family: Arial, sans-serif; font-weight: bold; font-size: 12px; text-anchor: middle; }
      .text-dark { fill: #1A365D; font-family: Arial, sans-serif; font-weight: bold; font-size: 11px; text-anchor: middle; }
      .text-title { fill: #1A365D; font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; text-anchor: middle; }
      .text-label { fill: #1A365D; font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Title -->
  <text x="450" y="25" class="text-title">Architecture Mondiale AWS</text>

  <!-- Global Container -->
  <rect x="20" y="40" width="860" height="420" class="aws-navy" opacity="0.05"/>

  <!-- Region 1: eu-west-3 (Paris) -->
  <rect x="30" y="60" width="260" height="380" class="aws-navy" opacity="0.1" stroke-dasharray="5,5"/>
  <text x="160" y="80" class="text-title">Région: eu-west-3</text>
  <text x="160" y="95" class="text-label">(Paris, France)</text>

  <!-- AZ1 -->
  <rect x="40" y="110" width="110" height="310" class="aws-blue" opacity="0.2"/>
  <text x="95" y="130" class="text-dark">AZ1</text>

  <!-- AZ2 -->
  <rect x="160" y="110" width="110" height="310" class="aws-blue" opacity="0.3"/>
  <text x="215" y="130" class="text-dark">AZ2</text>

  <!-- Services in AZ1 -->
  <rect x="48" y="145" width="95" height="35" class="aws-orange"/>
  <text x="95.5" y="168" class="text-white">EC2</text>

  <rect x="48" y="190" width="95" height="35" class="aws-orange"/>
  <text x="95.5" y="213" class="text-white">RDS</text>

  <rect x="48" y="235" width="95" height="35" class="aws-orange"/>
  <text x="95.5" y="258" class="text-white">EBS</text>

  <rect x="48" y="280" width="95" height="35" class="aws-orange"/>
  <text x="95.5" y="303" class="text-white">Lambda</text>

  <!-- Services in AZ2 -->
  <rect x="168" y="145" width="95" height="35" class="aws-orange"/>
  <text x="215.5" y="168" class="text-white">EC2</text>

  <rect x="168" y="190" width="95" height="35" class="aws-orange"/>
  <text x="215.5" y="213" class="text-white">RDS</text>

  <rect x="168" y="235" width="95" height="35" class="aws-orange"/>
  <text x="215.5" y="258" class="text-white">Backup</text>

  <!-- Region 2: us-east-1 (N. Virginia) -->
  <rect x="310" y="60" width="260" height="380" class="aws-navy" opacity="0.1" stroke-dasharray="5,5"/>
  <text x="440" y="80" class="text-title">Région: us-east-1</text>
  <text x="440" y="95" class="text-label">(N. Virginia, USA)</text>

  <!-- AZ3 -->
  <rect x="320" y="110" width="110" height="310" class="aws-blue" opacity="0.2"/>
  <text x="375" y="130" class="text-dark">AZ3</text>

  <!-- AZ4 -->
  <rect x="440" y="110" width="110" height="310" class="aws-blue" opacity="0.3"/>
  <text x="495" y="130" class="text-dark">AZ4</text>

  <!-- Services in AZ3 -->
  <rect x="328" y="145" width="95" height="35" class="aws-orange"/>
  <text x="375.5" y="168" class="text-white">S3</text>

  <rect x="328" y="190" width="95" height="35" class="aws-orange"/>
  <text x="375.5" y="213" class="text-white">IAM</text>

  <rect x="328" y="235" width="95" height="35" class="aws-orange"/>
  <text x="375.5" y="258" class="text-white">VPC</text>

  <!-- Services in AZ4 -->
  <rect x="448" y="145" width="95" height="35" class="aws-orange"/>
  <text x="495.5" y="168" class="text-white">S3</text>

  <rect x="448" y="190" width="95" height="35" class="aws-orange"/>
  <text x="495.5" y="213" class="text-white">CloudFront</text>

  <rect x="448" y="235" width="95" height="35" class="aws-orange"/>
  <text x="495.5" y="258" class="text-white">Route 53</text>

  <!-- Region 3: ap-northeast-1 (Tokyo) -->
  <rect x="590" y="60" width="260" height="380" class="aws-navy" opacity="0.1" stroke-dasharray="5,5"/>
  <text x="720" y="80" class="text-title">Région: ap-northeast-1</text>
  <text x="720" y="95" class="text-label">(Tokyo, Japan)</text>

  <!-- AZ5 -->
  <rect x="600" y="110" width="110" height="310" class="aws-blue" opacity="0.2"/>
  <text x="655" y="130" class="text-dark">AZ5</text>

  <!-- AZ6 -->
  <rect x="720" y="110" width="110" height="310" class="aws-blue" opacity="0.3"/>
  <text x="775" y="130" class="text-dark">AZ6</text>

  <!-- Services in AZ5 -->
  <rect x="608" y="145" width="95" height="35" class="aws-orange"/>
  <text x="655.5" y="168" class="text-white">EC2</text>

  <rect x="608" y="190" width="95" height="35" class="aws-orange"/>
  <text x="655.5" y="213" class="text-white">Aurora</text>

  <rect x="608" y="235" width="95" height="35" class="aws-orange"/>
  <text x="655.5" y="258" class="text-white">DynamoDB</text>

  <!-- Services in AZ6 -->
  <rect x="728" y="145" width="95" height="35" class="aws-orange"/>
  <text x="775.5" y="168" class="text-white">KMS</text>

  <rect x="728" y="190" width="95" height="35" class="aws-orange"/>
  <text x="775.5" y="213" class="text-white">Secrets Mgr</text>

  <rect x="728" y="235" width="95" height="35" class="aws-orange"/>
  <text x="775.5" y="258" class="text-white">CloudWatch</text>

  <!-- Edge Locations (points de présence) -->
  <circle cx="160" cy="350" r="25" class="aws-green"/>
  <text x="160" y="356" class="text-white" font-size="10">Edge</text>

  <circle cx="440" cy="350" r="25" class="aws-green"/>
  <text x="440" y="356" class="text-white" font-size="10">Edge</text>

  <circle cx="720" cy="350" r="25" class="aws-green"/>
  <text x="720" y="356" class="text-white" font-size="10">Edge</text>

  <!-- Legend -->
  <text x="30" y="450" class="text-label" font-size="9">Légende:</text>
  <rect x="85" y="438" width="15" height="15" class="aws-orange"/>
  <text x="110" y="450" style="text-anchor:start" class="text-label" font-size="9">Services AWS</text>

  <rect x="225" y="438" width="15" height="15" class="aws-blue" opacity="0.3"/>
  <text x="250" y="450" style="text-anchor:start" class="text-label" font-size="9">Availability Zone</text>

  <circle cx="370" cy="445.5" r="7.5" class="aws-green"/>
  <text x="395" y="450" style="text-anchor:start" class="text-label" font-size="9">Edge Location (CDN)</text>

</svg>
