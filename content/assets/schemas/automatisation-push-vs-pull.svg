<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, sans-serif" role="img" aria-labelledby="dawan-title dawan-desc">
<title id="dawan-title">Comparaison architecturale : modèle Push où un poste de contrôle envoie la configuration via SSH ou l&#x27;API AWS sans agent, contre modèle Pull où chaque instance interroge périodiquement un serveur central via un agent installé</title>
<desc id="dawan-desc">Structurer en deux colonnes strictement alignées, utiliser les mêmes critères des deux côtés et faire ressortir différences, avantages et limites. Réduire la densité visible en regroupant les détails dans des blocs et en renforçant les niveaux de lecture. Ajouter dans le SVG une palette à contraste WCAG, des variables de couleur et une variante interne `prefers-color-scheme: dark`, avec contours lisibles dans les deux modes. Ajouter des états de survol sobres sur les groupes importants et des identifiants de calques exploitables pour une révélation progressive. Le contenu, les libellés et le sens pédagogique d&#x27;origine sont conservés.</desc>
<style id="dawan-adaptive-accessibility"><![CDATA[
  svg { color-scheme: light dark; isolation: isolate; text-rendering: geometricPrecision; }
  text { font-synthesis: none; paint-order: stroke fill; stroke: rgba(248,250,252,.20); stroke-width: .28px; stroke-linejoin: round; }
  path, line, polyline, polygon { vector-effect: non-scaling-stroke; }
  g[id] { transition: filter .18s ease, opacity .18s ease, transform .18s ease; transform-origin: center; }
  g[id]:hover, g[id]:focus { filter: brightness(1.13) saturate(1.10) drop-shadow(0 2px 3px rgba(14,165,233,.24)); outline: none; }
  g[id]:hover path[marker-end], g[id]:focus path[marker-end] { stroke-dasharray: 8 5; animation: dawan-flow .8s linear infinite; }
  .dawan-theme-backdrop { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
  @keyframes dawan-flow { to { stroke-dashoffset: -13; } }
  @media (prefers-color-scheme: dark) {
    .dawan-theme-backdrop { stroke: #7dd3fc; }
    text { stroke: rgba(2,6,23,.28); }
  }
  @media (prefers-reduced-motion: reduce) { g[id], g[id] path { transition: none !important; animation: none !important; } }
  @media print { g[id] { filter: none !important; } }
]]></style>

  <rect x="0" y="0" width="900" height="420" rx="16" fill="#0d1117"/>
  <text x="450" y="38" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">Outils d'automatisation — modèle Push vs modèle Pull</text>

  <!-- Push side -->
  <text x="225" y="72" text-anchor="middle" fill="#f0883e" font-size="16" font-weight="700">Push — Ansible, CloudFormation</text>
  <rect x="140" y="100" width="170" height="50" rx="6" fill="#3d5a80"/>
  <text x="225" y="130" text-anchor="middle" fill="#fff" font-size="12">Poste de contrôle</text>
  <line class="flow" x1="225" y1="150" x2="130" y2="220" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrowPush)"/>
  <line class="flow" x1="225" y1="150" x2="225" y2="220" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrowPush)"/>
  <line class="flow" x1="225" y1="150" x2="320" y2="220" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrowPush)"/>
  <rect x="70" y="222" width="110" height="45" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="125" y="248" text-anchor="middle" fill="#e6edf3" font-size="10">Instance A</text>
  <rect x="170" y="222" width="110" height="45" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="225" y="248" text-anchor="middle" fill="#e6edf3" font-size="10">Instance B</text>
  <rect x="270" y="222" width="110" height="45" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="325" y="248" text-anchor="middle" fill="#e6edf3" font-size="10">Instance C</text>
  <text x="225" y="300" text-anchor="middle" fill="#8b949e" font-size="11">Le contrôleur envoie la configuration</text>
  <text x="225" y="316" text-anchor="middle" fill="#8b949e" font-size="11">à la demande, sans agent installé</text>
  <text x="225" y="340" text-anchor="middle" fill="#8b949e" font-size="10">SSH (Ansible) ou API AWS (CloudFormation)</text>

  <line x1="450" y1="60" x2="450" y2="380" stroke="#30363d" stroke-width="1"/>

  <!-- Pull side -->
  <text x="675" y="72" text-anchor="middle" fill="#f0883e" font-size="16" font-weight="700">Pull — Chef, Puppet</text>
  <rect x="590" y="100" width="170" height="50" rx="6" fill="#3d5a80"/>
  <text x="675" y="130" text-anchor="middle" fill="#fff" font-size="12">Serveur central</text>
  <line class="flow" x1="580" y1="220" x2="675" y2="150" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrowPull)"/>
  <line class="flow" x1="675" y1="220" x2="675" y2="150" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrowPull)"/>
  <line class="flow" x1="770" y1="220" x2="675" y2="150" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrowPull)"/>
  <rect x="520" y="222" width="110" height="45" rx="6" fill="#21262d" stroke="#8957e5"/>
  <text x="575" y="242" text-anchor="middle" fill="#e6edf3" font-size="10">Instance A</text>
  <text x="575" y="257" text-anchor="middle" fill="#8957e5" font-size="8">agent</text>
  <rect x="620" y="222" width="110" height="45" rx="6" fill="#21262d" stroke="#8957e5"/>
  <text x="675" y="242" text-anchor="middle" fill="#e6edf3" font-size="10">Instance B</text>
  <text x="675" y="257" text-anchor="middle" fill="#8957e5" font-size="8">agent</text>
  <rect x="720" y="222" width="110" height="45" rx="6" fill="#21262d" stroke="#8957e5"/>
  <text x="775" y="242" text-anchor="middle" fill="#e6edf3" font-size="10">Instance C</text>
  <text x="775" y="257" text-anchor="middle" fill="#8957e5" font-size="8">agent</text>
  <text x="675" y="300" text-anchor="middle" fill="#8b949e" font-size="11">Chaque instance interroge périodiquement</text>
  <text x="675" y="316" text-anchor="middle" fill="#8b949e" font-size="11">le serveur via un agent installé localement</text>
  <text x="675" y="340" text-anchor="middle" fill="#8b949e" font-size="10">Convergence automatique, sans intervention</text>

  <defs>
    <marker id="arrowPush" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e6edf3"/>
    </marker>
    <marker id="arrowPull" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e6edf3"/>
    </marker>
    <style>.flow{stroke-dasharray:6 6;animation:move 1.5s linear infinite}@keyframes move{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  </defs>
</svg>
