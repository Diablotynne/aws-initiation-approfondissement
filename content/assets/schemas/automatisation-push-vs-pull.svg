<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, sans-serif">
  <rect x="0" y="0" width="900" height="420" rx="16" fill="#0d1117"/>
  <text x="450" y="38" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">Outils d'automatisation — modèle Push vs modèle Pull</text>

  <!-- Push side -->
  <text x="225" y="72" text-anchor="middle" fill="#f0883e" font-size="16" font-weight="700">Push — Ansible, CloudFormation</text>
  <rect x="140" y="100" width="170" height="50" rx="6" fill="#3d5a80"/>
  <text x="225" y="130" text-anchor="middle" fill="#fff" font-size="12">Poste de contrôle</text>
  <line x1="225" y1="150" x2="130" y2="220" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrowPush)"/>
  <line x1="225" y1="150" x2="225" y2="220" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrowPush)"/>
  <line x1="225" y1="150" x2="320" y2="220" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrowPush)"/>
  <rect x="70" y="222" width="110" height="45" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="125" y="248" text-anchor="middle" fill="#e6edf3" font-size="10">Instance A</text>
  <rect x="170" y="222" width="110" height="45" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="225" y="248" text-anchor="middle" fill="#e6edf3" font-size="10">Instance B</text>
  <rect x="270" y="222" width="110" height="45" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="325" y="248" text-anchor="middle" fill="#e6edf3" font-size="10">Instance C</text>
  <text x="225" y="300" text-anchor="middle" fill="#8b949e" font-size="11">Le contrôleur envoie la configuration</text>
  <text x="225" y="316" text-anchor="middle" fill="#8b949e" font-size="11">à la demande, sans agent installé</text>
  <text x="225" y="340" text-anchor="middle" fill="#8b949e" font-size="10">SSH (Ansible) ou API AWS (CloudFormation)</text>

  <line x1="450" y1="60" x2="450" y2="380" stroke="#30363d" stroke-width="1"/>

  <!-- Pull side -->
  <text x="675" y="72" text-anchor="middle" fill="#f0883e" font-size="16" font-weight="700">Pull — Chef, Puppet</text>
  <rect x="590" y="100" width="170" height="50" rx="6" fill="#3d5a80"/>
  <text x="675" y="130" text-anchor="middle" fill="#fff" font-size="12">Serveur central</text>
  <line x1="580" y1="220" x2="675" y2="150" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrowPull)"/>
  <line x1="675" y1="220" x2="675" y2="150" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrowPull)"/>
  <line x1="770" y1="220" x2="675" y2="150" stroke="#e6edf3" stroke-width="2" marker-end="url(#arrowPull)"/>
  <rect x="520" y="222" width="110" height="45" rx="6" fill="#21262d" stroke="#8957e5"/>
  <text x="575" y="242" text-anchor="middle" fill="#e6edf3" font-size="10">Instance A</text>
  <text x="575" y="257" text-anchor="middle" fill="#8957e5" font-size="8">agent</text>
  <rect x="620" y="222" width="110" height="45" rx="6" fill="#21262d" stroke="#8957e5"/>
  <text x="675" y="242" text-anchor="middle" fill="#e6edf3" font-size="10">Instance B</text>
  <text x="675" y="257" text-anchor="middle" fill="#8957e5" font-size="8">agent</text>
  <rect x="720" y="222" width="110" height="45" rx="6" fill="#21262d" stroke="#8957e5"/>
  <text x="775" y="242" text-anchor="middle" fill="#e6edf3" font-size="10">Instance C</text>
  <text x="775" y="257" text-anchor="middle" fill="#8957e5" font-size="8">agent</text>
  <text x="675" y="300" text-anchor="middle" fill="#8b949e" font-size="11">Chaque instance interroge périodiquement</text>
  <text x="675" y="316" text-anchor="middle" fill="#8b949e" font-size="11">le serveur via un agent installé localement</text>
  <text x="675" y="340" text-anchor="middle" fill="#8b949e" font-size="10">Convergence automatique, sans intervention</text>

  <defs>
    <marker id="arrowPush" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e6edf3"/>
    </marker>
    <marker id="arrowPull" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e6edf3"/>
    </marker>
  </defs>
</svg>
