<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, sans-serif" role="img" aria-labelledby="dawan-title dawan-desc">
<title id="dawan-title">Comparaison des 4 politiques de routage Route 53 : Simple, Pondérée, Latence, Failover</title>
<desc id="dawan-desc">Structurer en deux colonnes strictement alignées, utiliser les mêmes critères des deux côtés et faire ressortir différences, avantages et limites. Réduire la densité visible en regroupant les détails dans des blocs et en renforçant les niveaux de lecture. Ajouter dans le SVG une palette à contraste WCAG, des variables de couleur et une variante interne `prefers-color-scheme: dark`, avec contours lisibles dans les deux modes. Ajouter des états de survol sobres sur les groupes importants et des identifiants de calques exploitables pour une révélation progressive. Le contenu, les libellés et le sens pédagogique d&#x27;origine sont conservés.</desc>
<style id="dawan-adaptive-accessibility"><![CDATA[
  svg { color-scheme: light dark; isolation: isolate; text-rendering: geometricPrecision; }
  text { font-synthesis: none; paint-order: stroke fill; stroke: rgba(248,250,252,.20); stroke-width: .28px; stroke-linejoin: round; }
  path, line, polyline, polygon { vector-effect: non-scaling-stroke; }
  g[id] { transition: filter .18s ease, opacity .18s ease, transform .18s ease; transform-origin: center; }
  g[id]:hover, g[id]:focus { filter: brightness(1.13) saturate(1.10) drop-shadow(0 2px 3px rgba(14,165,233,.24)); outline: none; }
  g[id]:hover path[marker-end], g[id]:focus path[marker-end] { stroke-dasharray: 8 5; animation: dawan-flow .8s linear infinite; }
  .dawan-theme-backdrop { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
  @keyframes dawan-flow { to { stroke-dashoffset: -13; } }
  @media (prefers-color-scheme: dark) {
    .dawan-theme-backdrop { stroke: #7dd3fc; }
    text { stroke: rgba(2,6,23,.28); }
  }
  @media (prefers-reduced-motion: reduce) { g[id], g[id] path { transition: none !important; animation: none !important; } }
  @media print { g[id] { filter: none !important; } }
]]></style>

  <rect width="800" height="420" fill="#0d1117"/>
  <defs>
    <marker id="arrow-r53" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8b949e"/>
    </marker>
    <style>.flow{stroke-dasharray:5 5;animation:move 1.3s linear infinite}@keyframes move{to{stroke-dashoffset:-20}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  </defs>

  <text x="400" y="26" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">Route 53 — Politiques de routage</text>

  <!-- Simple -->
  <rect x="20" y="45" width="375" height="165" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/>
  <text x="40" y="66" fill="#3fb950" font-size="12" font-weight="bold">Simple</text>
  <rect x="45" y="80" width="90" height="30" rx="4" fill="#0d1117" stroke="#8b949e"/>
  <text x="90" y="99" text-anchor="middle" fill="#e6edf3" font-size="9.5">app.dawan.fr</text>
  <line class="flow" x1="135" y1="95" x2="230" y2="95" stroke="#3fb950" stroke-width="1.3" marker-end="url(#arrow-r53)"/>
  <rect x="235" y="80" width="120" height="30" rx="4" fill="#0d1117" stroke="#3fb950"/>
  <text x="295" y="99" text-anchor="middle" fill="#e6edf3" font-size="9.5">1 seule ressource</text>
  <text x="40" y="135" fill="#8b949e" font-size="9.5">Un domaine pointe vers une seule</text>
  <text x="40" y="150" fill="#8b949e" font-size="9.5">adresse IP — cas de base, sans</text>
  <text x="40" y="165" fill="#8b949e" font-size="9.5">répartition ni bascule.</text>
  <text x="40" y="188" fill="#3fb950" font-size="9" font-weight="bold">Usage : petit site, ressource unique</text>

  <!-- Pondérée -->
  <rect x="405" y="45" width="375" height="165" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/>
  <text x="425" y="66" fill="#58a6ff" font-size="12" font-weight="bold">Pondérée (Weighted)</text>
  <rect x="430" y="80" width="90" height="30" rx="4" fill="#0d1117" stroke="#8b949e"/>
  <text x="475" y="99" text-anchor="middle" fill="#e6edf3" font-size="9.5">app.dawan.fr</text>
  <line class="flow" x1="520" y1="90" x2="600" y2="80" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#arrow-r53)"/>
  <line class="flow" x1="520" y1="100" x2="600" y2="110" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#arrow-r53)"/>
  <rect x="605" y="65" width="120" height="26" rx="4" fill="#0d1117" stroke="#58a6ff"/>
  <text x="665" y="82" text-anchor="middle" fill="#e6edf3" font-size="9">v2 — 90 %</text>
  <rect x="605" y="99" width="120" height="26" rx="4" fill="#0d1117" stroke="#58a6ff"/>
  <text x="665" y="116" text-anchor="middle" fill="#e6edf3" font-size="9">v1 — 10 %</text>
  <text x="425" y="150" fill="#8b949e" font-size="9.5">Répartit le trafic en pourcentage</text>
  <text x="425" y="165" fill="#8b949e" font-size="9.5">entre plusieurs ressources.</text>
  <text x="425" y="188" fill="#58a6ff" font-size="9" font-weight="bold">Usage : déploiement progressif, A/B testing</text>

  <!-- Latence -->
  <rect x="20" y="225" width="375" height="165" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.3"/>
  <text x="40" y="246" fill="#d29922" font-size="12" font-weight="bold">Latence</text>
  <rect x="45" y="260" width="90" height="30" rx="4" fill="#0d1117" stroke="#8b949e"/>
  <text x="90" y="279" text-anchor="middle" fill="#e6edf3" font-size="9.5">Client (Tokyo)</text>
  <line class="flow" x1="135" y1="275" x2="230" y2="260" stroke="#30363d" stroke-width="1.3"/>
  <line class="flow" x1="135" y1="275" x2="230" y2="290" stroke="#d29922" stroke-width="1.3" marker-end="url(#arrow-r53)"/>
  <rect x="235" y="248" width="120" height="26" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="295" y="265" text-anchor="middle" fill="#8b949e" font-size="9">eu-west-1 (180ms)</text>
  <rect x="235" y="280" width="120" height="26" rx="4" fill="#0d1117" stroke="#d29922"/>
  <text x="295" y="297" text-anchor="middle" fill="#e6edf3" font-size="9">ap-northeast-1 (12ms)</text>
  <text x="40" y="330" fill="#8b949e" font-size="9.5">Route vers la ressource la plus</text>
  <text x="40" y="345" fill="#8b949e" font-size="9.5">rapide (latence réseau minimale).</text>
  <text x="40" y="368" fill="#d29922" font-size="9" font-weight="bold">Usage : applications globales multi-région</text>

  <!-- Failover -->
  <rect x="405" y="225" width="375" height="165" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.3"/>
  <text x="425" y="246" fill="#f85149" font-size="12" font-weight="bold">Failover (basculement)</text>
  <rect x="430" y="260" width="90" height="30" rx="4" fill="#0d1117" stroke="#8b949e"/>
  <text x="475" y="279" text-anchor="middle" fill="#e6edf3" font-size="9.5">app.dawan.fr</text>
  <line x1="520" y1="270" x2="600" y2="260" stroke="#f85149" stroke-width="1.3" stroke-dasharray="3,3"/>
  <text x="560" y="255" text-anchor="middle" fill="#f85149" font-size="8">✕ health check KO</text>
  <line class="flow" x1="520" y1="280" x2="600" y2="292" stroke="#f85149" stroke-width="1.3" marker-end="url(#arrow-r53)"/>
  <rect x="605" y="248" width="120" height="26" rx="4" fill="#0d1117" stroke="#f85149" stroke-dasharray="3,3"/>
  <text x="665" y="265" text-anchor="middle" fill="#8b949e" font-size="9">Primaire (en panne)</text>
  <rect x="605" y="280" width="120" height="26" rx="4" fill="#0d1117" stroke="#3fb950"/>
  <text x="665" y="297" text-anchor="middle" fill="#e6edf3" font-size="9">Secours (sain)</text>
  <text x="425" y="330" fill="#8b949e" font-size="9.5">Health Check détecte la panne et</text>
  <text x="425" y="345" fill="#8b949e" font-size="9.5">bascule vers la ressource de secours.</text>
  <text x="425" y="368" fill="#f85149" font-size="9" font-weight="bold">Usage : haute disponibilité, reprise après sinistre</text>

  <text x="400" y="410" text-anchor="middle" fill="#8b949e" font-size="9.5" font-style="italic">Les Health Checks (HTTP/TCP/Calculated/CloudWatch) alimentent la politique Failover</text>
</svg>
