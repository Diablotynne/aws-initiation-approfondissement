<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Chaîne de décision IAM</title><desc id="d">Une identité s'authentifie, assume un rôle, voit ses politiques évaluées puis ses actions sont tracées.</desc><defs><linearGradient id="b" x2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1c2940"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#74c7ff"/></marker><style>.flow{stroke-dasharray:8 6;animation:move 1.5s linear infinite}@keyframes move{to{stroke-dashoffset:-28}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style></defs><rect width="1200" height="430" rx="24" fill="url(#b)"/><text x="55" y="58" fill="white" font-family="Arial" font-size="28" font-weight="700">IAM répond à quatre questions</text><text x="55" y="88" fill="#a9bad0" font-family="Arial" font-size="16">Qui peut faire quoi, sur quelle ressource, dans quelles conditions ?</text>
<g font-family="Arial" text-anchor="middle"><g transform="translate(55 145)"><circle cx="85" cy="75" r="72" fill="#233650" stroke="#61b8ff" stroke-width="3"/><text x="85" y="65" fill="#8ed0ff" font-size="18" font-weight="700">IDENTITÉ</text><text x="85" y="92" fill="white" font-size="15">humain · service</text></g><g transform="translate(285 145)"><circle cx="85" cy="75" r="72" fill="#233650" stroke="#9d8cff" stroke-width="3"/><text x="85" y="65" fill="#beadff" font-size="18" font-weight="700">AUTHENTIFIER</text><text x="85" y="92" fill="white" font-size="15">MFA · fédération</text></g><g transform="translate(515 145)"><circle cx="85" cy="75" r="72" fill="#233650" stroke="#ffb45e" stroke-width="3"/><text x="85" y="65" fill="#ffc681" font-size="18" font-weight="700">AUTORISER</text><text x="85" y="92" fill="white" font-size="15">politiques JSON</text></g><g transform="translate(745 145)"><circle cx="85" cy="75" r="72" fill="#233650" stroke="#5ee2a0" stroke-width="3"/><text x="85" y="65" fill="#7cebb2" font-size="18" font-weight="700">AGIR</text><text x="85" y="92" fill="white" font-size="15">API AWS</text></g><g transform="translate(975 145)"><circle cx="85" cy="75" r="72" fill="#233650" stroke="#ff718b" stroke-width="3"/><text x="85" y="65" fill="#ff9caf" font-size="18" font-weight="700">TRACER</text><text x="85" y="92" fill="white" font-size="15">CloudTrail</text></g></g><g class="flow" stroke="#74c7ff" stroke-width="3" marker-end="url(#a)"><path d="M220 220h55"/><path d="M450 220h55"/><path d="M680 220h55"/><path d="M910 220h55"/></g><rect x="250" y="340" width="700" height="48" rx="24" fill="#182a3e" stroke="#ff718b"/><text x="600" y="371" text-anchor="middle" fill="white" font-family="Arial" font-size="17">Refus explicite &gt; autorisation explicite &gt; refus implicite</text></svg>
