<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Repères de navigation dans AWS Management Console</title><desc id="desc">La console permet de choisir le compte, la région et le service, puis de consulter et configurer les ressources du service choisi.</desc><defs><style>.title{font:700 30px Arial,sans-serif;fill:#172f4f}.head{font:700 19px Arial,sans-serif;fill:#172f4f}.txt{font:16px Arial,sans-serif;fill:#334155}.hint{font:700 15px Arial,sans-serif;fill:#a34f00}</style></defs><rect width="1200" height="660" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" class="title">AWS Management Console : quatre repères avant toute action</text><rect x="55" y="82" width="1090" height="78" rx="14" fill="#172f4f"/><rect x="80" y="103" width="310" height="36" rx="18" fill="#fff"/><text x="235" y="127" text-anchor="middle" class="txt">Rechercher un service</text><rect x="700" y="103" width="160" height="36" rx="8" fill="#334b6b"/><text x="780" y="127" text-anchor="middle" fill="#fff" font-family="Arial">Région</text><rect x="880" y="103" width="235" height="36" rx="8" fill="#334b6b"/><text x="997" y="127" text-anchor="middle" fill="#fff" font-family="Arial">Compte / rôle</text><g stroke="#e07b00" stroke-width="3" fill="none"><path d="M235 160v65M780 160v65M997 160v65"/></g><g class="hint"><text x="235" y="247" text-anchor="middle">1 · SERVICE</text><text x="780" y="247" text-anchor="middle">2 · RÉGION</text><text x="997" y="247" text-anchor="middle">3 · IDENTITÉ</text></g><rect x="55" y="285" width="245" height="275" rx="16" fill="#e8eef6"/><text x="177" y="325" text-anchor="middle" class="head">Navigation du service</text><text x="85" y="370" class="txt">Tableau de bord</text><text x="85" y="410" class="txt">Ressources</text><text x="85" y="450" class="txt">Configuration</text><text x="85" y="490" class="txt">Surveillance</text><rect x="330" y="285" width="815" height="275" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="370" y="330" class="head">Ressources du service dans la région active</text><rect x="370" y="365" width="735" height="54" rx="10" fill="#eef6ff"/><text x="400" y="399" class="txt">État, identifiant, zone, configuration et actions disponibles</text><rect x="370" y="440" width="350" height="78" rx="10" fill="#edf7ef"/><text x="545" y="475" text-anchor="middle" class="head">Créer / modifier</text><text x="545" y="500" text-anchor="middle" class="txt">Action sur la ressource</text><rect x="755" y="440" width="350" height="78" rx="10" fill="#fff3df"/><text x="930" y="475" text-anchor="middle" class="head">4 · CONTRÔLER</text><text x="930" y="500" text-anchor="middle" class="txt">État et coût après l’action</text><rect x="100" y="595" width="1000" height="40" rx="12" fill="#e8eef6"/><text x="600" y="621" text-anchor="middle" class="txt">Réflexe : vérifier compte, rôle et région avant de créer, modifier ou supprimer une ressource.</text></svg>
