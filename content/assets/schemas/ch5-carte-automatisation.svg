<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Boucle d'automatisation AWS</title><desc id="d">Le code est validé, déployé, observé puis amélioré dans une boucle continue.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1b2940"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#71caff"/></marker><style>.flow{stroke-dasharray:8 6;animation:move 1.5s linear infinite}@keyframes move{to{stroke-dashoffset:-28}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style></defs><rect width="1200" height="430" rx="24" fill="url(#b)"/><text x="55" y="58" fill="white" font-family="Arial" font-size="28" font-weight="700">Automatiser, observer, améliorer</text><text x="55" y="88" fill="#a9bad0" font-family="Arial" font-size="16">L’Infrastructure as Code transforme l’architecture en boucle contrôlable</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="165" width="190" height="120" rx="22" fill="#263a54" stroke="#a98cff"/><text x="165" y="207" fill="#c5b1ff" font-size="19" font-weight="700">DÉCRIRE</text><text x="165" y="240" fill="white" font-size="15">YAML · paramètres</text><rect x="295" y="165" width="190" height="120" rx="22" fill="#263a54" stroke="#70caff"/><text x="390" y="207" fill="#8fd7ff" font-size="19" font-weight="700">VALIDER</text><text x="390" y="240" fill="white" font-size="15">revue · change set</text><rect x="520" y="165" width="190" height="120" rx="22" fill="#263a54" stroke="#ffae59"/><text x="615" y="207" fill="#ffc27a" font-size="19" font-weight="700">DÉPLOYER</text><text x="615" y="240" fill="white" font-size="15">CloudFormation</text><rect x="745" y="165" width="190" height="120" rx="22" fill="#263a54" stroke="#5ee2a0"/><text x="840" y="207" fill="#7cebb2" font-size="19" font-weight="700">OBSERVER</text><text x="840" y="240" fill="whi