<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Comparaison entre serveur traditionnel, machines virtuelles et conteneurs</title>
  <desc id="desc">Les machines virtuelles possèdent chacune leur système invité tandis que les conteneurs partagent le noyau du système hôte.</desc>
  <defs><style>.title{font:700 30px Arial,sans-serif;fill:#172f4f}.head{font:700 22px Arial,sans-serif;fill:#172f4f}.txt{font:16px Arial,sans-serif;fill:#334155}.box{stroke:#64748b;stroke-width:2}.white{font:700 16px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1200" height="690" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" class="title">De la machine physique au conteneur</text>
  <g transform="translate(55 85)"><rect width="330" height="500" rx="20" fill="#fff" class="box"/><text x="165" y="40" text-anchor="middle" class="head">Serveur traditionnel</text><rect x="35" y="80" width="260" height="95" rx="10" fill="#f59e0b"/><text x="165" y="132" text-anchor="middle" class="white">Application</text><rect x="35" y="190" width="260" height="95" rx="10" fill="#475569"/><text x="165" y="242" text-anchor="middle" class="white">Système d’exploitation</text><rect x="35" y="300" width="260" height="145" rx="10" fill="#2563a6"/><text x="165" y="378" text-anchor="middle" class="white">Matériel physique</text><text x="165" y="480" text-anchor="middle" class="txt">Une pile par serveur</text></g>
  <g transform="translate(435 85)"><rect width="330" height="500" rx="20" fill="#fff" class="box"/><text x="165" y="40" text-anchor="middle" class="head">Machines virtuelles</text><g class="white"><rect x="25" y="80" width="130" height="72" rx="8" fill="#f59e0b"/><text x="90" y="122" text-anchor="middle">Application A</text><rect x="175" y="80" width="130" height="72" rx="8" fill="#f59e0b"/><text x="240" y="122" text-anchor="middle">Application B</text><rect x="25" y="165" width="130" height="82" rx="8" fill="#475569"/><text x="90" y="212" text-anchor="middle">OS invité A</text><rect x="175" y="165" width="130" height="82" rx="8" fill="#475569"/><text x="240" y="212" text-anchor="middle">OS invité B</text><rect x="25" y="262" width="280" height="70" rx="8" fill="#7b4fa3"/><text x="165" y="304" text-anchor="middle">Hyperviseur</text><rect x="25" y="347" width="280" height="98" rx="8" fill="#2563a6"/><text x="165" y="402" text-anchor="middle">Matériel physique</text></g><text x="165" y="480" text-anchor="middle" class="txt">Isolation forte, OS complets</text></g>
  <g transform="translate(815 85)"><rect width="330" height="500" rx="20" fill="#fff" class="box"/><text x="165" y="40" text-anchor="middle" class="head">Conteneurs</text><g class="white"><rect x="25" y="80" width="130" height="72" rx="8" fill="#f59e0b"/><text x="90" y="122" text-anchor="middle">Application A</text><rect x="175" y="80" width="130" height="72" rx="8" fill="#f59e0b"/><text x="240" y="122" text-anchor="middle">Application B</text><rect x="25" y="165" width="280" height="70" rx="8" fill="#2f855a"/><text x="165" y="207" text-anchor="middle">Moteur de conteneurs</text><rect x="25" y="250" width="280" height="82" rx="8" fill="#475569"/><text x="165" y="298" text-anchor="middle">Système hôte partagé</text><rect x="25" y="347" width="280" height="98" rx="8" fill="#2563a6"/><text x="165" y="402" text-anchor="middle">Matériel physique</text></g><text x="165" y="480" text-anchor="middle" class="txt">Démarrage rapide, noyau partagé</text></g>
  <rect x="120" y="620" width="960" height="42" rx="12" fill="#e8eef6"/><text x="600" y="647" text-anchor="middle" class="txt">EC2 fournit des machines virtuelles ; ECS et EKS orchestrent des conteneurs.</text>
</svg>
