<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="t d"><title id="t">Progression de la formation AWS</title><desc id="d">Cinq étapes relient fondations, sécurité, calcul et stockage, réseau et données, puis automatisation.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1b2c48"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#70ccff"/></marker></defs><rect width="1400" height="430" rx="26" fill="url(#b)"/><text x="60" y="58" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Une application, cinq niveaux de décision</text><text x="60" y="88" fill="#a9bad0" font-family="Arial" font-size="16">Chaque chapitre enrichit la même architecture</text><g font-family="Arial" text-anchor="middle"><g transform="translate(45 145)"><rect width="230" height="165" rx="20" fill="#263a54" stroke="#64baff"/><text x="115" y="43" fill="#87cdff" font-size="18" font-weight="700">01 · FONDATIONS</text><text x="115" y="80" fill="#fff" font-size="15">Besoin · Région</text><text x="115" y="106" fill="#fff" font-size="15">Responsabilités · Coût</text><text x="115" y="137" fill="#a9bad0" font-size="13">Décider</text></g><g transform="translate(315 145)"><rect width="230" height="165" rx="20" fill="#263a54" stroke="#a68cff"/><text x="115" y="43" fill="#c1aeff" font-size="18" font-weight="700">02 · SÉCURITÉ</text><text x="115" y="80" fill="#fff" font-size="15">Identités · Rôles</text><text x="115" y="106" fill="#fff" font-size="15">Politiques · Traces</text><text x="115" y="137" fill="#a9bad0" font-size="13">Protéger</text></g><g transform="translate(585 145)"><rect width="230" height="165" rx="20" fill="#263a54" stroke="#ffae59"/><text x="115" y="43" fill="#ffc37b" font-size="18" font-weight="700">03 · RESSOURCES</text><text x="115" y="80" fill="#fff" font-size="15">S3 · EC2 · EBS</text><text x="115" y="106" fill="#fff" font-size="15">ELB · Auto Scaling</text><text x="115" y="137" fill="#a9bad0" font-size="13">Exécuter</text></g><g transform="translate(855 145)"><rect width="230" height="165" rx="20" fill="#263a54" stroke="#5ee2a0"/><text x="115" y="43" fill="#7cebb2" font-size="18" font-weight="700">04 · ARCHITECTURE</text><text x="115" y="80" fill="#fff" font-size="15">VPC · Routage</text><text x="115" y="106" fill="#fff" font-size="15">RDS · DynamoDB</text><text x="115" y="137" fill="#a9bad0" font-size="13">Connecter</text></g><g transform="translate(1125 145)"><rect width="230" height="165" rx="20" fill="#263a54" stroke="#ff718b"/><text x="115" y="43" fill="#ff9caf" font-size="18" font-weight="700">05 · DEVOPS</text><text x="115" y="80" fill="#fff" font-size="15">IaC · Supervision</text><text x="115" y="106" fill="#fff" font-size="15">Découplage · Reprise</text><text x="115" y="137" fill="#a9bad0" font-size="13">Industrialiser</text></g></g><g stroke="#70ccff" stroke-width="3" marker-end="url(#a)"><path d="M280 228h25"/><path d="M550 228h25"/><path d="M820 228h25"/><path d="M1090 228h25"/></g><text x="700" y="370" text-anchor="middle" fill="#d8e4ef" font-family="Arial" font-size="17">Observer → comprendre → manipuler → expliquer → automatiser</text></svg>
