<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="system-ui, sans-serif">
  <rect width="760" height="320" fill="#0d1117"/>

  <rect x="20" y="20" width="340" height="130" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="40" y="42" fill="#3fb950" font-size="12" font-weight="bold">Route Table — Subnet PUBLIC</text>
  <rect x="35" y="55" width="310" height="80" fill="#0d1117" stroke="#30363d"/>
  <text x="45" y="72" fill="#8b949e" font-size="10" font-weight="bold">Destination</text>
  <text x="200" y="72" fill="#8b949e" font-size="10" font-weight="bold">Cible</text>
  <text x="45" y="92" fill="#e6edf3" font-size="10">10.0.0.0/16</text>
  <text x="200" y="92" fill="#e6edf3" font-size="10">local</text>
  <text x="45" y="112" fill="#e6edf3" font-size="10">0.0.0.0/0</text>
  <text x="200" y="112" fill="#e6edf3" font-size="10">igw-xxxxx (Internet Gateway)</text>

  <rect x="400" y="20" width="340" height="130" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="420" y="42" fill="#d29922" font-size="12" font-weight="bold">Route Table — Subnet PRIVÉ</text>
  <rect x="415" y="55" width="310" height="80" fill="#0d1117" stroke="#30363d"/>
  <text x="425" y="72" fill="#8b949e" font-size="10" font-weight="bold">Destination</text>
  <text x="580" y="72" fill="#8b949e" font-size="10" font-weight="bold">Cible</text>
  <text x="425" y="92" fill="#e6edf3" font-size="10">10.0.0.0/16</text>
  <text x="580" y="92" fill="#e6edf3" font-size="10">local</text>
  <text x="425" y="112" fill="#e6edf3" font-size="10">0.0.0.0/0</text>
  <text x="580" y="112" fill="#e6edf3" font-size="10">nat-xxxxx (NAT Gateway)</text>

  <rect x="130" y="190" width="500" height="110" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="380" y="212" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Association Subnet ↔ Route Table</text>
  <text x="380" y="238" text-anchor="middle" fill="#e6edf3" font-size="10">Chaque subnet est associé à UNE SEULE table de routage</text>
  <text x="380" y="256" text-anchor="middle" fill="#e6edf3" font-size="10">(une table peut être partagée par plusieurs subnets)</text>
  <text x="380" y="278" text-anchor="middle" fill="#8b949e" font-size="10">Sans association explicite → la Main Route Table de la VPC s'applique par défaut</text>

  <line x1="190" y1="150" x2="280" y2="188" stroke="#3fb950" stroke-width="1.2"/>
  <line x1="570" y1="150" x2="480" y2="188" stroke="#d29922" stroke-width="1.2"/>
</svg>
