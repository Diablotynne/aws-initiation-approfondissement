<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="system-ui, sans-serif" role="img" aria-labelledby="dawan-title dawan-desc">
<title id="dawan-title">Structure d&#x27;un bucket Amazon S3</title>
<desc id="dawan-desc">Installer une hiérarchie visuelle nette : idée centrale, groupes logiques, ordre de lecture numéroté et éléments secondaires atténués. Ajouter dans le SVG une palette à contraste WCAG, des variables de couleur et une variante interne `prefers-color-scheme: dark`, avec contours lisibles dans les deux modes. Ajouter des états de survol sobres sur les groupes importants et des identifiants de calques exploitables pour une révélation progressive. Le contenu, les libellés et le sens pédagogique d&#x27;origine sont conservés.</desc>
<style id="dawan-adaptive-accessibility"><![CDATA[
  svg { color-scheme: light dark; isolation: isolate; text-rendering: geometricPrecision; }
  text { font-synthesis: none; paint-order: stroke fill; stroke: rgba(248,250,252,.20); stroke-width: .28px; stroke-linejoin: round; }
  path, line, polyline, polygon { vector-effect: non-scaling-stroke; }
  g[id] { transition: filter .18s ease, opacity .18s ease, transform .18s ease; transform-origin: center; }
  g[id]:hover, g[id]:focus { filter: brightness(1.13) saturate(1.10) drop-shadow(0 2px 3px rgba(14,165,233,.24)); outline: none; }
  g[id]:hover path[marker-end], g[id]:focus path[marker-end] { stroke-dasharray: 8 5; animation: dawan-flow .8s linear infinite; }
  .dawan-theme-backdrop { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
  @keyframes dawan-flow { to { stroke-dashoffset: -13; } }
  @media (prefers-color-scheme: dark) {
    .dawan-theme-backdrop { stroke: #7dd3fc; }
    text { stroke: rgba(2,6,23,.28); }
  }
  @media (prefers-reduced-motion: reduce) { g[id], g[id] path { transition: none !important; animation: none !important; } }
  @media print { g[id] { filter: none !important; } }
]]></style>

  <rect width="600" height="340" fill="#0d1117"/>

  <rect x="150" y="20" width="300" height="35" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="300" y="43" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="bold">Bucket : site-web-entreprise</text>

  <rect x="170" y="75" width="260" height="55" rx="5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="300" y="95" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Objet : images/logo.png</text>
  <text x="300" y="112" text-anchor="middle" fill="#8b949e" font-size="10">contenu (bytes) + métadonnées (taille, date, ACL)</text>

  <rect x="170" y="145" width="260" height="55" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="300" y="165" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Objet : css/style.css</text>
  <text x="300" y="182" text-anchor="middle" fill="#8b949e" font-size="10">contenu (bytes) + métadonnées (taille, date, ACL)</text>

  <rect x="170" y="215" width="260" height="55" rx="5" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
  <text x="300" y="235" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold">Objet : index.html</text>
  <text x="300" y="252" text-anchor="middle" fill="#8b949e" font-size="10">contenu (bytes) + métadonnées (taille, date, ACL)</text>

  <text x="300" y="300" text-anchor="middle" fill="#8b949e" font-size="11">« images/ » et « css/ » ne sont pas de vrais dossiers : ce sont des préfixes</text>
  <text x="300" y="316" text-anchor="middle" fill="#8b949e" font-size="11">logiques dans le nom de l'objet, pas une arborescence de fichiers réelle.</text>
</svg>
