<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="system-ui, sans-serif">
  <rect width="600" height="340" fill="#0d1117"/>

  <rect x="150" y="20" width="300" height="35" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="300" y="43" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="bold">Bucket : site-web-entreprise</text>

  <rect x="170" y="75" width="260" height="55" rx="5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="300" y="95" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">Objet : images/logo.png</text>
  <text x="300" y="112" text-anchor="middle" fill="#8b949e" font-size="10">contenu (bytes) + métadonnées (taille, date, ACL)</text>

  <rect x="170" y="145" width="260" height="55" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="300" y="165" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Objet : css/style.css</text>
  <text x="300" y="182" text-anchor="middle" fill="#8b949e" font-size="10">contenu (bytes) + métadonnées (taille, date, ACL)</text>

  <rect x="170" y="215" width="260" height="55" rx="5" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
  <text x="300" y="235" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold">Objet : index.html</text>
  <text x="300" y="252" text-anchor="middle" fill="#8b949e" font-size="10">contenu (bytes) + métadonnées (taille, date, ACL)</text>

  <text x="300" y="300" text-anchor="middle" fill="#8b949e" font-size="11">« images/ » et « css/ » ne sont pas de vrais dossiers : ce sont des préfixes</text>
  <text x="300" y="316" text-anchor="middle" fill="#8b949e" font-size="11">logiques dans le nom de l'objet, pas une arborescence de fichiers réelle.</text>
</svg>
