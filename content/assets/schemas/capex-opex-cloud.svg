<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Comparer CAPEX et OPEX dans une décision cloud</title>
  <desc id="desc">Le CAPEX immobilise un investissement pour une capacité planifiée, tandis que l'OPEX suit une consommation variable qui doit être gouvernée.</desc>
  <defs><style>.h{font:700 24px Arial,sans-serif;fill:#172f4f}.s{font:700 18px Arial,sans-serif;fill:#172f4f}.p{font:16px Arial,sans-serif;fill:#334155}.cap{fill:#e8f1fb;stroke:#2874a6;stroke-width:2}.op{fill:#fff3df;stroke:#e07b00;stroke-width:2}.axis{stroke:#64748b;stroke-width:2}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6}.label{font:14px Arial,sans-serif;fill:#475569}</style></defs>
  <rect width="1000" height="520" rx="24" fill="#f8fafc"/>
  <text x="500" y="42" text-anchor="middle" class="h">Deux modèles économiques, deux modes de pilotage</text>
  <rect class="cap" x="55" y="78" width="410" height="365" rx="20"/><text x="260" y="120" text-anchor="middle" class="h">CAPEX</text><text x="260" y="150" text-anchor="middle" class="s">Capacité achetée à l'avance</text>
  <line class="axis" x1="105" y1="360" x2="405" y2="360"/><line class="axis" x1="105" y1="360" x2="105" y2="200"/><path d="M110 220H400V355H110Z" fill="#2874a6" opacity=".23"/><path d="M110 220H400" stroke="#2874a6" stroke-width="5"/><path class="dash" d="M110 305C180 300 230 280 290 255S360 205 400 190"/>
  <text x="255" y="395" text-anchor="middle" class="p">Investissement initial · amortissement</text><text x="255" y="420" text-anchor="middle" class="p">capacité dimensionnée avant l'usage</text>
  <rect class="op" x="535" y="78" width="410" height="365" rx="20"/><text x="740" y="120" text-anchor="middle" class="h">OPEX</text><text x="740" y="150" text-anchor="middle" class="s">Consommation facturée à l'usage</text>
  <line class="axis" x1="585" y1="360" x2="885" y2="360"/><line class="axis" x1="585" y1="360" x2="585" y2="200"/><path d="M590 330C650 320 670 250 725 270S795 195 880 235V355H590Z" fill="#ff9900" opacity=".3"/><path d="M590 330C650 320 670 250 725 270S795 195 880 235" fill="none" stroke="#e07b00" stroke-width="5"/>
  <text x="740" y="395" text-anchor="middle" class="p">Dépense variable · élasticité</text><text x="740" y="420" text-anchor="middle" class="p">mesure, budgets et arrêt des ressources</text>
  <text x="500" y="480" text-anchor="middle" class="s">Le cloud ne rend pas le coût automatiquement faible : il rend la consommation mesurable et ajustable.</text>
</svg>
