<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">VPC en couches</title><desc id="d">Une architecture VPC avec entrée Internet, couche web publique, applications privées et bases de données privées.</desc><defs><linearGradient id="b" x2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#19283e"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#70ceff"/></marker></defs><rect width="1200" height="430" rx="24" fill="url(#b)"/><text x="55" y="55" fill="white" font-family="Arial" font-size="28" font-weight="700">Une architecture réseau en couches</text><rect x="210" y="85" width="930" height="305" rx="24" fill="#152337" stroke="#5e7896" stroke-width="2"/><text x="235" y="118" fill="#a9bad0" font-family="Arial" font-size="16" font-weight="700">VPC 10.0.0.0/16 · une région</text><g font-family="Arial" text-anchor="middle"><rect x="35" y="175" width="135" height="80" rx="40" fill="#273a54" stroke="#70ceff"/><text x="102" y="210" fill="white" font-size="17" font-weight="700">Internet</text><text x="102" y="234" fill="#a9bad0" font-size="13">Route 53</text><rect x="270" y="145" width="210" height="180" rx="18" fill="#263a54" stroke="#ffb05b"/><text x="375" y="178" fill="#ffc37a" font-size="17" font-weight="700">SUBNET PUBLIC</text><text x="375" y="218" fill="white" font-size="15">Load Balancer</text><text x="375" y="247" fill="white" font-size="15">NAT Gateway</text><text x="375" y="286" fill="#a9bad0" font-size="13">route vers IGW</text><rect x="540" y="145" width="230" height="180" rx="18" fill="#263a54" stroke="#5ee2a0"/><text x="655" y="178" fill="#7cebb2" font-size="17" font-weight="700">SUBNET PRIVÉ APP</text><text x="655" y="223" fill="white" font-size="15">Instances EC2</text><text x="655" y="252" fill="white" font-size="15">ou conteneurs</text><text x="655" y="286" fill="#a9bad0" font-size="13">sortie via NAT</text><rect x="830" y="145" width="250" height="180" rx="18" fill="#263a54" stroke="#a78cff"/><text x="955" y="178" fill="#c1aeff" font-size="17" font-weight="700">SUBNET PRIVÉ DATA</text><text x="955" y="218" fill="white" font-size="15">RDS Multi-AZ</text><text x="955" y="247" fill="white" font-size="15">ElastiCache</text><text x="955" y="286" fill="#a9bad0" font-size="13">aucune route Internet</text></g><g fill="none" stroke="#70ceff" stroke-width="3" marker-end="url(#a)"><path d="M170 215h90"/><path d="M480 235h50"/><path d="M770 235h50"/></g><text x="600" y="365" text-anchor="middle" fill="#d5e2ee" font-family="Arial" font-size="15">Route = chemin possible · Security Group/NACL = trafic autorisé · Subnet = zone de placement</text></svg>
