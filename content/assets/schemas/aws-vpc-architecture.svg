<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#232F3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4" />
    </filter>
    <style>.flow{stroke-dasharray:8 8;animation:move 1.5s linear infinite}@keyframes move{to{stroke-dashoffset:-32}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)"/>

  <!-- AWS Region Container -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="960" height="560" fill="none" stroke="#FF9900" stroke-width="3" stroke-dasharray="5,5" rx="10"/>
    <text x="40" y="45" font-size="16" font-weight="bold" fill="#FF9900">AWS Region (eu-west-1)</text>
  </g>

  <!-- VPC Container -->
  <g filter="url(#shadow)">
    <rect x="40" y="70" width="920" height="500" fill="none" stroke="#FF9900" stroke-width="2" rx="8"/>
    <text x="60" y="95" font-size="14" font-weight="bold" fill="#FF9900">Virtual Private Cloud (VPC)</text>
  </g>

  <!-- Internet Gateway -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="120" height="80" fill="#FF9900" rx="5"/>
    <text x="60" y="135" font-size="12" font-weight="bold" fill="#232F3E">Internet</text>
    <text x="60" y="155" font-size="12" font-weight="bold" fill="#232F3E">Gateway</text>
    <text x="60" y="175" font-size="10" fill="#232F3E">(IGW)</text>
  </g>

  <!-- Arrow from IGW to VPC -->
  <path class="flow" d="M 170 150 Q 250 150 280 200" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Availability Zone 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="210" width="420" height="330" fill="none" stroke="#00A4A6" stroke-width="2" stroke-dasharray="3,3" rx="5"/>
    <text x="85" y="235" font-size="12" font-weight="bold" fill="#00A4A6">Availability Zone 1 (eu-west-1a)</text>
  </g>

  <!-- Public Subnet AZ1 -->
  <g filter="url(#shadow)">
    <rect x="85" y="250" width="180" height="140" fill="#E8F4F8" opacity="0.2" stroke="#00A4A6" stroke-width="1" rx="4"/>
    <text x="95" y="270" font-size="11" font-weight="bold" fill="#00A4A6">Public Subnet</text>
    <text x="95" y="285" font-size="9" fill="#00A4A6">CIDR: 10.0.1.0/24</text>

    <!-- EC2 in Public Subnet -->
    <rect x="100" y="300" width="150" height="60" fill="#FF9900" opacity="0.8" rx="3"/>
    <text x="110" y="320" font-size="10" font-weight="bold" fill="#232F3E">EC2 Instance</text>
    <text x="110" y="335" font-size="9" fill="#232F3E">Public IP: 54.x.x.x</text>
    <text x="110" y="350" font-size="9" fill="#232F3E">Security Group</text>
  </g>

  <!-- Private Subnet AZ1 -->
  <g filter="url(#shadow)">
    <rect x="285" y="250" width="180" height="140" fill="#E8F4F8" opacity="0.1" stroke="#00A4A6" stroke-width="1" rx="4"/>
    <text x="295" y="270" font-size="11" font-weight="bold" fill="#00A4A6">Private Subnet</text>
    <text x="295" y="285" font-size="9" fill="#00A4A6">CIDR: 10.0.10.0/24</text>

    <!-- RDS Instance -->
    <rect x="300" y="300" width="150" height="60" fill="#146EB4" opacity="0.8" rx="3"/>
    <text x="310" y="320" font-size="10" font-weight="bold" fill="#FFFFFF">RDS Database</text>
    <text x="310" y="335" font-size="9" fill="#FFFFFF">MySQL</text>
    <text x="310" y="350" font-size="9" fill="#FFFFFF">Private: 10.0.10.x</text>
  </g>

  <!-- NAT Gateway -->
  <g filter="url(#shadow)">
    <rect x="100" y="410" width="120" height="70" fill="#FF9900" opacity="0.8" rx="3"/>
    <text x="110" y="430" font-size="10" font-weight="bold" fill="#232F3E">NAT Gateway</text>
    <text x="110" y="450" font-size="9" fill="#232F3E">Private → Internet</text>
    <text x="110" y="465" font-size="9" fill="#232F3E">Elastic IP</text>
  </g>

  <!-- Availability Zone 2 -->
  <g filter="url(#shadow)">
    <rect x="510" y="210" width="420" height="330" fill="none" stroke="#00A4A6" stroke-width="2" stroke-dasharray="3,3" rx="5"/>
    <text x="525" y="235" font-size="12" font-weight="bold" fill="#00A4A6">Availability Zone 2 (eu-west-1b)</text>
  </g>

  <!-- Public Subnet AZ2 -->
  <g filter="url(#shadow)">
    <rect x="525" y="250" width="180" height="140" fill="#E8F4F8" opacity="0.2" stroke="#00A4A6" stroke-width="1" rx="4"/>
    <text x="535" y="270" font-size="11" font-weight="bold" fill="#00A4A6">Public Subnet</text>
    <text x="535" y="285" font-size="9" fill="#00A4A6">CIDR: 10.0.2.0/24</text>

    <!-- EC2 in Public Subnet AZ2 -->
    <rect x="540" y="300" width="150" height="60" fill="#FF9900" opacity="0.8" rx="3"/>
    <text x="550" y="320" font-size="10" font-weight="bold" fill="#232F3E">EC2 Instance</text>
    <text x="550" y="335" font-size="9" fill="#232F3E">Public IP: 54.y.y.y</text>
    <text x="550" y="350" font-size="9" fill="#232F3E">Security Group</text>
  </g>

  <!-- Private Subnet AZ2 -->
  <g filter="url(#shadow)">
    <rect x="725" y="250" width="180" height="140" fill="#E8F4F8" opacity="0.1" stroke="#00A4A6" stroke-width="1" rx="4"/>
    <text x="735" y="270" font-size="11" font-weight="bold" fill="#00A4A6">Private Subnet</text>
    <text x="735" y="285" font-size="9" fill="#00A4A6">CIDR: 10.0.20.0/24</text>

    <!-- RDS Replica -->
    <rect x="740" y="300" width="150" height="60" fill="#146EB4" opacity="0.8" rx="3"/>
    <text x="750" y="320" font-size="10" font-weight="bold" fill="#FFFFFF">RDS Read Replica</text>
    <text x="750" y="335" font-size="9" fill="#FFFFFF">Multi-AZ</text>
    <text x="750" y="350" font-size="9" fill="#FFFFFF">Private: 10.0.20.x</text>
  </g>

  <!-- NAT Gateway AZ2 -->
  <g filter="url(#shadow)">
    <rect x="540" y="410" width="120" height="70" fill="#FF9900" opacity="0.8" rx="3"/>
    <text x="550" y="430" font-size="10" font-weight="bold" fill="#232F3E">NAT Gateway</text>
    <text x="550" y="450" font-size="9" fill="#232F3E">Private → Internet</text>
    <text x="550" y="465" font-size="9" fill="#232F3E">Elastic IP</text>
  </g>

  <!-- Network ACL Label -->
  <text x="950" y="30" font-size="10" fill="#FFFFFF" text-anchor="end">NACL (inbound/outbound)</text>

  <!-- Legend -->
  <g>
    <text x="50" y="575" font-size="11" font-weight="bold" fill="#FFFFFF">Legend:</text>
    <rect x="140" y="565" width="15" height="15" fill="#FF9900"/>
    <text x="160" y="577" font-size="10" fill="#FFFFFF">Compute (EC2, NAT)</text>

    <rect x="400" y="565" width="15" height="15" fill="#146EB4"/>
    <text x="420" y="577" font-size="10" fill="#FFFFFF">Database (RDS)</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#FF9900"/>
    </marker>
  </defs>

  <!-- Connections arrows -->
  <path d="M 230 330 L 300 330" stroke="#00A4A6" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
  <path d="M 670 330 L 740 330" stroke="#00A4A6" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
  <path class="flow" d="M 110 150 L 170 210" stroke="#FF9900" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path class="flow" d="M 550 150 L 550 210" stroke="#FF9900" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
</svg>