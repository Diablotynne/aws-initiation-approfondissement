<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, sans-serif" role="img" aria-labelledby="dawan-title dawan-desc">
<title id="dawan-title">Les six piliers du Well-Architected Framework organisés autour d&#x27;une architecture bien conçue : Sécurité, Excellence opérationnelle, Fiabilité, Efficacité des performances, Optimisation des coûts, Durabilité</title>
<desc id="dawan-desc">Clarifier le sens de lecture par flèches continues, étapes numérotées, frontières de responsabilité et légende compacte des couleurs. Ajouter dans le SVG une palette à contraste WCAG, des variables de couleur et une variante interne `prefers-color-scheme: dark`, avec contours lisibles dans les deux modes. Préparer des groupes SVG identifiés par étape, avec survol mettant en évidence l&#x27;étape et animation discrète du chemin ; rendu statique complet si l&#x27;animation est indisponible. Le contenu, les libellés et le sens pédagogique d&#x27;origine sont conservés.</desc>
<style id="dawan-adaptive-accessibility"><![CDATA[
  svg { color-scheme: light dark; isolation: isolate; text-rendering: geometricPrecision; }
  text { font-synthesis: none; paint-order: stroke fill; stroke: rgba(248,250,252,.20); stroke-width: .28px; stroke-linejoin: round; }
  path, line, polyline, polygon { vector-effect: non-scaling-stroke; }
  g[id] { transition: filter .18s ease, opacity .18s ease, transform .18s ease; transform-origin: center; }
  g[id]:hover, g[id]:focus { filter: brightness(1.13) saturate(1.10) drop-shadow(0 2px 3px rgba(14,165,233,.24)); outline: none; }
  g[id]:hover path[marker-end], g[id]:focus path[marker-end] { stroke-dasharray: 8 5; animation: dawan-flow .8s linear infinite; }
  .dawan-theme-backdrop { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
  @keyframes dawan-flow { to { stroke-dashoffset: -13; } }
  @media (prefers-color-scheme: dark) {
    .dawan-theme-backdrop { stroke: #7dd3fc; }
    text { stroke: rgba(2,6,23,.28); }
  }
  @media (prefers-reduced-motion: reduce) { g[id], g[id] path { transition: none !important; animation: none !important; } }
  @media print { g[id] { filter: none !important; } }
]]></style>

  <rect x="0" y="0" width="900" height="460" rx="16" fill="#0d1117"/>
  <text x="450" y="30" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">AWS Well-Architected Framework — les six piliers</text>

  <!-- Central hub -->
  <circle cx="450" cy="260" r="70" fill="#8957e5"/>
  <text x="450" y="254" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Architecture</text>
  <text x="450" y="272" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">bien conçue</text>

  <!-- six pillars around -->
  <g>
    <line x1="450" y1="190" x2="450" y2="100" stroke="#30363d" stroke-width="2"/>
    <rect x="360" y="60" width="180" height="50" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="450" y="80" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">1. Sécurité</text>
    <text x="450" y="98" text-anchor="middle" fill="#8b949e" font-size="10">Protéger données et systèmes</text>
  </g>
  <g>
    <line x1="515" y1="215" x2="620" y2="145" stroke="#30363d" stroke-width="2"/>
    <rect x="620" y="110" width="190" height="50" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="715" y="130" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">2. Excellence opérationnelle</text>
    <text x="715" y="148" text-anchor="middle" fill="#8b949e" font-size="10">Exploiter et surveiller efficacement</text>
  </g>
  <g>
    <line x1="515" y1="305" x2="620" y2="375" stroke="#30363d" stroke-width="2"/>
    <rect x="620" y="375" width="180" height="50" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="710" y="395" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">3. Fiabilité</text>
    <text x="710" y="413" text-anchor="middle" fill="#8b949e" font-size="10">Récupérer des pannes automatiquement</text>
  </g>
  <g>
    <line x1="450" y1="330" x2="450" y2="400" stroke="#30363d" stroke-width="2"/>
    <rect x="330" y="375" width="240" height="50" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="450" y="395" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">4. Efficacité des performances</text>
    <text x="450" y="413" text-anchor="middle" fill="#8b949e" font-size="10">Utiliser les ressources de façon optimale</text>
  </g>
  <g>
    <line x1="385" y1="305" x2="280" y2="375" stroke="#30363d" stroke-width="2"/>
    <rect x="90" y="375" width="200" height="50" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="190" y="395" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">5. Optimisation des coûts</text>
    <text x="190" y="413" text-anchor="middle" fill="#8b949e" font-size="10">Éviter les dépenses inutiles</text>
  </g>
  <g>
    <line x1="385" y1="215" x2="280" y2="145" stroke="#30363d" stroke-width="2"/>
    <rect x="80" y="110" width="200" height="50" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="180" y="130" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">6. Durabilité</text>
    <text x="180" y="148" text-anchor="middle" fill="#8b949e" font-size="10">Réduire l'impact environnemental</text>
  </g>
</svg>
