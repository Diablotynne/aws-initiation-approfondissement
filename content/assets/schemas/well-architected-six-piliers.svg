<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Les six piliers du cadre AWS Well-Architected</title><desc id="desc">Une charge de travail est évaluée simultanément selon l’excellence opérationnelle, la sécurité, la fiabilité, l’efficacité des performances, l’optimisation des coûts et la durabilité.</desc>
  <defs><style>.title{font:700 30px Arial,sans-serif;fill:#172f4f}.head{font:700 18px Arial,sans-serif;fill:#172f4f}.txt{font:15px Arial,sans-serif;fill:#334155}.line{stroke:#94a3b8;stroke-width:4}.card{stroke-width:2}</style></defs><rect width="1200" height="700" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" class="title">Six regards complémentaires sur une même charge de travail</text>
  <g class="line"><path d="M600 350L260 180M600 350L600 160M600 350L940 180M600 350L260 520M600 350L600 545M600 350L940 520"/></g><circle cx="600" cy="350" r="115" fill="#172f4f"/><text x="600" y="340" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">CHARGE DE TRAVAIL</text><text x="600" y="372" text-anchor="middle" fill="#ffb347" font-family="Arial" font-size="17">Décisions et compromis</text>
  <g><rect class="card" x="90" y="100" width="340" height="125" rx="18" fill="#eef6ff" stroke="#2563a6"/><text x="260" y="137" text-anchor="middle" class="head">Excellence opérationnelle</text><text x="260" y="170" text-anchor="middle" class="txt">Exécuter, observer et améliorer</text><text x="260" y="195" text-anchor="middle" class="txt">les processus et les opérations</text></g>
  <g><rect class="card" x="430" y="80" width="340" height="125" rx="18" fill="#fff3df" stroke="#e07b00"/><text x="600" y="117" text-anchor="middle" class="head">Sécurité</text><text x="600" y="150" text-anchor="middle" class="txt">Protéger les données, systèmes</text><text x="600" y="175" text-anchor="middle" class="txt">et actifs</text></g>
  <g><rect class="card" x="770" y="100" width="340" height="125" rx="18" fill="#edf7ef" stroke="#2f855a"/><text x="940" y="137" text-anchor="middle" class="head">Fiabilité</text><text x="940" y="170" text-anchor="middle" class="txt">Résister aux défaillances</text><text x="940" y="195" text-anchor="middle" class="txt">et rétablir le service</text></g>
  <g><rect class="card" x="90" y="475" width="340" height="125" rx="18" fill="#f2eafa" stroke="#7b4fa3"/><text x="260" y="512" text-anchor="middle" class="head">Efficacité des performances</text><text x="260" y="545" text-anchor="middle" class="txt">Choisir et ajuster efficacement</text><text x="260" y="570" text-anchor="middle" class="txt">les ressources</text></g>
  <g><rect class="card" x="430" y="495" width="340" height="125" rx="18" fill="#fff7ed" stroke="#ea580c"/><text x="600" y="532" text-anchor="middle" class="head">Optimisation des coûts</text><text x="600" y="565" text-anchor="middle" class="txt">Éviter les dépenses inutiles</text><text x="600" y="590" text-anchor="middle" class="txt">et mesurer la valeur</text></g>
  <g><rect class="card" x="770" y="475" width="340" height="125" rx="18" fill="#ecfdf5" stroke="#059669"/><text x="940" y="512" text-anchor="middle" class="head">Durabilité</text><text x="940" y="545" text-anchor="middle" class="txt">Réduire l’impact environnemental</text><text x="940" y="570" text-anchor="middle" class="txt">des ressources utilisées</text></g>
  <text x="600" y="670" text-anchor="middle" class="txt">Une amélioration sur un pilier peut créer un compromis sur un autre : la revue rend ces choix explicites.</text>
</svg>
