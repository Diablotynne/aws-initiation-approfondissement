<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, sans-serif">
  <rect x="0" y="0" width="900" height="420" rx="16" fill="#0d1117"/>
  <text x="450" y="38" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">AWS Well-Architected Framework — les six piliers</text>

  <!-- Central hub -->
  <circle cx="450" cy="220" r="70" fill="#8957e5"/>
  <text x="450" y="214" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Architecture</text>
  <text x="450" y="232" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">bien conçue</text>

  <!-- six pillars around -->
  <g>
    <line x1="450" y1="150" x2="450" y2="60" stroke="#30363d" stroke-width="2"/>
    <rect x="360" y="20" width="180" height="50" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="450" y="40" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">1. Sécurité</text>
    <text x="450" y="58" text-anchor="middle" fill="#8b949e" font-size="10">Protéger données et systèmes</text>
  </g>
  <g>
    <line x1="515" y1="175" x2="620" y2="105" stroke="#30363d" stroke-width="2"/>
    <rect x="620" y="70" width="190" height="50" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="715" y="90" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">2. Excellence opérationnelle</text>
    <text x="715" y="108" text-anchor="middle" fill="#8b949e" font-size="10">Exploiter et surveiller efficacement</text>
  </g>
  <g>
    <line x1="515" y1="265" x2="620" y2="335" stroke="#30363d" stroke-width="2"/>
    <rect x="620" y="335" width="180" height="50" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="710" y="355" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">3. Fiabilité</text>
    <text x="710" y="373" text-anchor="middle" fill="#8b949e" font-size="10">Récupérer des pannes automatiquement</text>
  </g>
  <g>
    <line x1="450" y1="290" x2="450" y2="360" stroke="#30363d" stroke-width="2"/>
    <rect x="330" y="335" width="240" height="50" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="450" y="355" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">4. Efficacité des performances</text>
    <text x="450" y="373" text-anchor="middle" fill="#8b949e" font-size="10">Utiliser les ressources de façon optimale</text>
  </g>
  <g>
    <line x1="385" y1="265" x2="280" y2="335" stroke="#30363d" stroke-width="2"/>
    <rect x="90" y="335" width="200" height="50" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="190" y="355" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">5. Optimisation des coûts</text>
    <text x="190" y="373" text-anchor="middle" fill="#8b949e" font-size="10">Éviter les dépenses inutiles</text>
  </g>
  <g>
    <line x1="385" y1="175" x2="280" y2="105" stroke="#30363d" stroke-width="2"/>
    <rect x="80" y="70" width="200" height="50" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="180" y="90" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">6. Durabilité</text>
    <text x="180" y="108" text-anchor="middle" fill="#8b949e" font-size="10">Réduire l'impact environnemental</text>
  </g>
</svg>
