<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" font-family="system-ui, sans-serif">
  <rect width="800" height="220" fill="#0d1117"/>

  <rect x="15" y="70" width="130" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="80" y="95" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">1. Template</text>
  <text x="80" y="112" text-anchor="middle" fill="#8b949e" font-size="10">YAML / JSON</text>

  <rect x="175" y="70" width="130" height="60" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="240" y="95" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="bold">2. Stack</text>
  <text x="240" y="112" text-anchor="middle" fill="#8b949e" font-size="10">créée dans CFN</text>

  <rect x="335" y="70" width="150" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="410" y="90" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">3. Provisioning</text>
  <text x="410" y="106" text-anchor="middle" fill="#8b949e" font-size="10">ordre résolu</text>
  <text x="410" y="120" text-anchor="middle" fill="#8b949e" font-size="10">automatiquement</text>

  <rect x="515" y="70" width="130" height="60" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="580" y="95" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold">4. Update</text>
  <text x="580" y="112" text-anchor="middle" fill="#8b949e" font-size="10">Change Set</text>

  <rect x="675" y="70" width="110" height="60" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="730" y="95" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">5. Delete</text>
  <text x="730" y="112" text-anchor="middle" fill="#8b949e" font-size="10">stack</text>

  <line class="flow" x1="145" y1="100" x2="170" y2="100" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="flow" x1="305" y1="100" x2="330" y2="100" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="flow" x1="485" y1="100" x2="510" y2="100" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="flow" x1="645" y1="100" x2="670" y2="100" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="400" y="175" text-anchor="middle" fill="#8b949e" font-size="11">Toutes les ressources de la stack sont créées, mises à jour ou supprimées ensemble —</text>
  <text x="400" y="192" text-anchor="middle" fill="#8b949e" font-size="11">jamais gérées une par une manuellement.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e6edf3"/>
    </marker>
    <style>.flow{stroke-dasharray:6 6;animation:move 1.5s linear infinite}@keyframes move{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  </defs>
</svg>
