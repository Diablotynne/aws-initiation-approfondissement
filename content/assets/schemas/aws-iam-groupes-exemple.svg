<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="system-ui, sans-serif" role="img" aria-labelledby="dawan-title dawan-desc">
<title id="dawan-title">Organisation des groupes IAM — Admins, Developers, Comptabilité et leurs policies respectives</title>
<desc id="dawan-desc">Matérialiser zones de confiance, surfaces d&#x27;attaque et contrôles de sécurité ; employer des signaux redondants couleur + icône + libellé. Ajouter dans le SVG une palette à contraste WCAG, des variables de couleur et une variante interne `prefers-color-scheme: dark`, avec contours lisibles dans les deux modes. Ajouter des états de survol sobres sur les groupes importants et des identifiants de calques exploitables pour une révélation progressive. Le contenu, les libellés et le sens pédagogique d&#x27;origine sont conservés.</desc>
<style id="dawan-adaptive-accessibility"><![CDATA[
  svg { color-scheme: light dark; isolation: isolate; text-rendering: geometricPrecision; }
  text { font-synthesis: none; paint-order: stroke fill; stroke: rgba(248,250,252,.20); stroke-width: .28px; stroke-linejoin: round; }
  path, line, polyline, polygon { vector-effect: non-scaling-stroke; }
  g[id] { transition: filter .18s ease, opacity .18s ease, transform .18s ease; transform-origin: center; }
  g[id]:hover, g[id]:focus { filter: brightness(1.13) saturate(1.10) drop-shadow(0 2px 3px rgba(14,165,233,.24)); outline: none; }
  g[id]:hover path[marker-end], g[id]:focus path[marker-end] { stroke-dasharray: 8 5; animation: dawan-flow .8s linear infinite; }
  .dawan-theme-backdrop { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
  @keyframes dawan-flow { to { stroke-dashoffset: -13; } }
  @media (prefers-color-scheme: dark) {
    .dawan-theme-backdrop { stroke: #7dd3fc; }
    text { stroke: rgba(2,6,23,.28); }
  }
  @media (prefers-reduced-motion: reduce) { g[id], g[id] path { transition: none !important; animation: none !important; } }
  @media print { g[id] { filter: none !important; } }
]]></style>

  <rect width="800" height="320" fill="#0d1117"/>

  <!-- Group Admins -->
  <rect x="40" y="40" width="220" height="130" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="150" y="65" text-anchor="middle" fill="#f85149" font-size="14" font-weight="700">Groupe Admins</text>
  <circle cx="90" cy="95" r="14" fill="#21262d" stroke="#8b949e"/>
  <circle cx="150" cy="95" r="14" fill="#21262d" stroke="#8b949e"/>
  <circle cx="210" cy="95" r="14" fill="#21262d" stroke="#8b949e"/>
  <text x="150" y="130" text-anchor="middle" fill="#e6edf3" font-size="11">Accès complet</text>
  <text x="150" y="145" text-anchor="middle" fill="#e6edf3" font-size="11">toutes ressources</text>
  <text x="150" y="162" text-anchor="middle" fill="#f85149" font-size="10" font-style="italic">AdministratorAccess</text>

  <!-- Group Developers -->
  <rect x="290" y="40" width="220" height="130" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="400" y="65" text-anchor="middle" fill="#d29922" font-size="14" font-weight="700">Groupe Developers</text>
  <circle cx="340" cy="95" r="14" fill="#21262d" stroke="#8b949e"/>
  <circle cx="400" cy="95" r="14" fill="#21262d" stroke="#8b949e"/>
  <circle cx="460" cy="95" r="14" fill="#21262d" stroke="#8b949e"/>
  <text x="400" y="130" text-anchor="middle" fill="#e6edf3" font-size="11">Accès restreint</text>
  <text x="400" y="145" text-anchor="middle" fill="#e6edf3" font-size="11">EC2 et S3 uniquement</text>
  <text x="400" y="162" text-anchor="middle" fill="#d29922" font-size="10" font-style="italic">PowerUserAccess</text>

  <!-- Group Comptabilité -->
  <rect x="540" y="40" width="220" height="130" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="650" y="65" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">Groupe Comptabilité</text>
  <circle cx="620" cy="95" r="14" fill="#21262d" stroke="#8b949e"/>
  <circle cx="680" cy="95" r="14" fill="#21262d" stroke="#8b949e"/>
  <text x="650" y="130" text-anchor="middle" fill="#e6edf3" font-size="11">Lecture seule</text>
  <text x="650" y="145" text-anchor="middle" fill="#e6edf3" font-size="11">facturation (Billing)</text>
  <text x="650" y="162" text-anchor="middle" fill="#58a6ff" font-size="10" font-style="italic">Billing ReadOnly</text>

  <!-- Arrows down to a common "IAM Policies" bar -->
  <line x1="150" y1="170" x2="150" y2="220" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="170" x2="400" y2="220" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="170" x2="650" y2="220" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="230" width="720" height="50" rx="8" fill="#1c2128" stroke="#f0883e" stroke-width="1.5"/>
  <text x="400" y="260" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">Policies IAM attachées aux groupes — principe du moindre privilège</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#30363d"/>
    </marker>
  </defs>
</svg>
