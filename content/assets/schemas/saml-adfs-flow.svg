<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, sans-serif" role="img" aria-labelledby="dawan-title dawan-desc">
<title id="dawan-title">Flux SSO — AD FS vers AWS IAM (SAML)</title>
<desc id="dawan-desc">Clarifier le sens de lecture par flèches continues, étapes numérotées, frontières de responsabilité et légende compacte des couleurs. Réduire la densité visible en regroupant les détails dans des blocs et en renforçant les niveaux de lecture. Ajouter dans le SVG une palette à contraste WCAG, des variables de couleur et une variante interne `prefers-color-scheme: dark`, avec contours lisibles dans les deux modes. Préparer des groupes SVG identifiés par étape, avec survol mettant en évidence l&#x27;étape et animation discrète du chemin ; rendu statique complet si l&#x27;animation est indisponible. Le contenu, les libellés et le sens pédagogique d&#x27;origine sont conservés.</desc>
<style id="dawan-adaptive-accessibility"><![CDATA[
  svg { color-scheme: light dark; isolation: isolate; text-rendering: geometricPrecision; }
  text { font-synthesis: none; paint-order: stroke fill; stroke: rgba(248,250,252,.20); stroke-width: .28px; stroke-linejoin: round; }
  path, line, polyline, polygon { vector-effect: non-scaling-stroke; }
  g[id] { transition: filter .18s ease, opacity .18s ease, transform .18s ease; transform-origin: center; }
  g[id]:hover, g[id]:focus { filter: brightness(1.13) saturate(1.10) drop-shadow(0 2px 3px rgba(14,165,233,.24)); outline: none; }
  g[id]:hover path[marker-end], g[id]:focus path[marker-end] { stroke-dasharray: 8 5; animation: dawan-flow .8s linear infinite; }
  .dawan-theme-backdrop { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
  @keyframes dawan-flow { to { stroke-dashoffset: -13; } }
  @media (prefers-color-scheme: dark) {
    .dawan-theme-backdrop { stroke: #7dd3fc; }
    text { stroke: rgba(2,6,23,.28); }
  }
  @media (prefers-reduced-motion: reduce) { g[id], g[id] path { transition: none !important; animation: none !important; } }
  @media print { g[id] { filter: none !important; } }
]]></style>

  <rect width="800" height="420" fill="#0d1117"/>

  <rect x="30" y="180" width="120" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="90" y="205" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Utilisateur</text>
  <text x="90" y="222" text-anchor="middle" fill="#8b949e" font-size="11">Navigateur</text>

  <rect x="220" y="180" width="140" height="60" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="290" y="203" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="bold">AD FS</text>
  <text x="290" y="219" text-anchor="middle" fill="#8b949e" font-size="11">Identity Provider</text>
  <text x="290" y="233" text-anchor="middle" fill="#8b949e" font-size="10">(Active Directory)</text>

  <rect x="430" y="180" width="160" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="510" y="200" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">AWS IAM</text>
  <text x="510" y="215" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Identity Center</text>
  <text x="510" y="230" text-anchor="middle" fill="#8b949e" font-size="10">valide l'assertion SAML</text>

  <rect x="650" y="180" width="130" height="60" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="715" y="203" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">Console AWS</text>
  <text x="715" y="219" text-anchor="middle" fill="#8b949e" font-size="10">rôle fédéré + STS</text>

  <line class="flow" x1="150" y1="200" x2="215" y2="200" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="182" y="165" text-anchor="middle" fill="#8b949e" font-size="10">① authentification</text>

  <line class="flow" x1="360" y1="210" x2="425" y2="210" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="392" y="165" text-anchor="middle" fill="#8b949e" font-size="10">② assertion SAML</text>

  <line class="flow" x1="590" y1="200" x2="645" y2="200" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="617" y="165" text-anchor="middle" fill="#8b949e" font-size="10">③④ token STS</text>

  <line x1="510" y1="240" x2="510" y2="290" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="510" y="308" text-anchor="middle" fill="#8b949e" font-size="10">③ valide l'assertion et génère</text>
  <text x="510" y="322" text-anchor="middle" fill="#8b949e" font-size="10">un token STS temporaire</text>

  <text x="400" y="370" text-anchor="middle" fill="#e6edf3" font-size="11">⑤ L'utilisateur accède à la console ou aux API AWS selon les permissions du rôle fédéré</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e6edf3"/>
    </marker>
    <style>.flow{stroke-dasharray:6 6;animation:move 1.5s linear infinite}@keyframes move{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  </defs>
</svg>
