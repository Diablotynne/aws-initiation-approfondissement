<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">Architecture web élastique sur deux zones de disponibilité</title><desc id="d">Route 53 dirige vers un Application Load Balancer qui distribue le trafic à un Auto Scaling Group réparti sur deux zones. S3 stocke les objets et EBS les volumes des instances.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#ff9900"/></marker></defs><style>.z{fill:#152944;stroke:#517eab;stroke-width:2}.s{fill:#243c5f;stroke:#86b6e2;stroke-width:2}.h{fill:#ffb347;font:700 20px system-ui}.p{fill:#edf4fc;font:15px system-ui}.f{fill:none;stroke:#ff9900;stroke-width:4;stroke-dasharray:12 7;marker-end:url(#a);animation:m 2s linear infinite}@keyframes m{to{stroke-dashoffset:-38}}@media(prefers-reduced-motion:reduce){.f{animation:none}}</style><rect width="1200" height="470" rx="24" fill="#0e192a"/><rect class="s" x="45" y="180" width="160" height="90" rx="16"/><text class="h" x="125" y="218" text-anchor="middle">Route 53</text><text class="p" x="125" y="247" text-anchor="middle">DNS</text><rect class="s" x="290" y="170" width="210" height="110" rx="16"/><text class="h" x="395" y="212" text-anchor="middle">Application LB</text><text class="p" x="395" y="242" text-anchor="middle">contrôles de santé</text><rect class="z" x="590" y="40" width="360" height="170" rx="20"/><rect class="z" x="590" y="260" width="360" height="170" rx="20"/><text class="h" x="615" y="78">AZ A</text><text class="h" x="615" y="298">AZ B</text><rect class="s" x="690" y="92" width="175" height="80" rx="15"/><rect class="s" x="690" y="312" width="175" height="80" rx="15"/><text class="p" x="777" y="140" text-anchor="middle">Instances EC2</text><text class="p" x="777" y="360" text-anchor="middle">Instances EC2</text><rect class="s" x="1010" y="105" width="145" height="90" rx="15"/><rect class="s" x="1010" y="275" width="145" height="90" rx="15"/><text class="h" x="1082" y="145" text-anchor="middle">S3</text><text class="p" x="1082" y="170" text-anchor="middle">objets</text><text class="h" x="1082" y="315" text-anchor="middle">EBS</text><text class="p" x="1082" y="340" text-anchor="middle">volumes</text><path class="f" d="M205 225H290M500 215L690 132M500 235L690 352M865 132H1010M865 352H1010"/><text class="p" x="770" y="235" text-anchor="middle">Auto Scaling Group réparti sur plusieurs AZ</text></svg>
