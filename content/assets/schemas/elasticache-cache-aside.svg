<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="system-ui, sans-serif" role="img" aria-labelledby="dawan-title dawan-desc">
<title id="dawan-title">Cache-Aside Pattern : application interroge ElastiCache, en cas de MISS interroge RDS puis remplit le cache avec un TTL</title>
<desc id="dawan-desc">Installer une hiérarchie visuelle nette : idée centrale, groupes logiques, ordre de lecture numéroté et éléments secondaires atténués. Réduire la densité visible en regroupant les détails dans des blocs et en renforçant les niveaux de lecture. Ajouter dans le SVG une palette à contraste WCAG, des variables de couleur et une variante interne `prefers-color-scheme: dark`, avec contours lisibles dans les deux modes. Ajouter des états de survol sobres sur les groupes importants et des identifiants de calques exploitables pour une révélation progressive. Le contenu, les libellés et le sens pédagogique d&#x27;origine sont conservés.</desc>
<style id="dawan-adaptive-accessibility"><![CDATA[
  svg { color-scheme: light dark; isolation: isolate; text-rendering: geometricPrecision; }
  text { font-synthesis: none; paint-order: stroke fill; stroke: rgba(248,250,252,.20); stroke-width: .28px; stroke-linejoin: round; }
  path, line, polyline, polygon { vector-effect: non-scaling-stroke; }
  g[id] { transition: filter .18s ease, opacity .18s ease, transform .18s ease; transform-origin: center; }
  g[id]:hover, g[id]:focus { filter: brightness(1.13) saturate(1.10) drop-shadow(0 2px 3px rgba(14,165,233,.24)); outline: none; }
  g[id]:hover path[marker-end], g[id]:focus path[marker-end] { stroke-dasharray: 8 5; animation: dawan-flow .8s linear infinite; }
  .dawan-theme-backdrop { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
  @keyframes dawan-flow { to { stroke-dashoffset: -13; } }
  @media (prefers-color-scheme: dark) {
    .dawan-theme-backdrop { stroke: #7dd3fc; }
    text { stroke: rgba(2,6,23,.28); }
  }
  @media (prefers-reduced-motion: reduce) { g[id], g[id] path { transition: none !important; animation: none !important; } }
  @media print { g[id] { filter: none !important; } }
]]></style>

  <rect width="780" height="380" fill="#0d1117"/>
  <defs>
    <marker id="arrow-ec" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b949e"/>
    </marker>
    <style>.flow{stroke-dasharray:6 6;animation:move 1.5s linear infinite}@keyframes move{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  </defs>

  <text x="390" y="26" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">Cache-Aside Pattern — ElastiCache</text>

  <rect x="30" y="55" width="130" height="50" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="95" y="76" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="bold">Application</text>
  <text x="95" y="92" text-anchor="middle" fill="#8b949e" font-size="9">1. Cache.GET(clé)</text>

  <rect x="330" y="55" width="140" height="50" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="400" y="76" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">ElastiCache</text>
  <text x="400" y="92" text-anchor="middle" fill="#8b949e" font-size="9">Redis / Memcached</text>

  <rect x="620" y="55" width="130" height="50" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="685" y="76" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">RDS</text>
  <text x="685" y="92" text-anchor="middle" fill="#8b949e" font-size="9">base de données</text>

  <line class="flow" x1="160" y1="70" x2="330" y2="70" stroke="#e6edf3" stroke-width="1.3" marker-end="url(#arrow-ec)"/>
  <text x="245" y="63" text-anchor="middle" fill="#8b949e" font-size="8.5">1. GET(clé)</text>

  <!-- HIT path -->
  <line class="flow" x1="330" y1="95" x2="160" y2="105" stroke="#3fb950" stroke-width="1.3" marker-end="url(#arrow-ec)"/>
  <text x="245" y="122" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="bold">HIT → &lt; 1 ms ✓</text>

  <!-- MISS path -->
  <line class="flow" x1="470" y1="70" x2="620" y2="70" stroke="#f0883e" stroke-width="1.3" marker-end="url(#arrow-ec)"/>
  <text x="545" y="63" text-anchor="middle" fill="#f0883e" font-size="8.5">2. MISS → SELECT(clé)</text>

  <line class="flow" x1="620" y1="95" x2="470" y2="105" stroke="#f0883e" stroke-width="1.3" marker-end="url(#arrow-ec)"/>
  <text x="545" y="122" text-anchor="middle" fill="#f0883e" font-size="8.5">résultat</text>

  <line class="flow" x1="400" y1="150" x2="400" y2="105" stroke="#d29922" stroke-width="1.3" marker-end="url(#arrow-ec)"/>
  <text x="415" y="135" fill="#d29922" font-size="8.5">3. SET(clé, résultat, TTL=3600)</text>

  <!-- Étapes détaillées -->
  <rect x="30" y="165" width="720" height="140" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="189" fill="#f0883e" font-size="12" font-weight="bold">Séquence</text>
  <g font-size="10.5" font-family="ui-monospace, monospace" fill="#e6edf3">
    <text x="50" y="212">1. Cache.GET(clé)</text>
    <text x="75" y="228" font-family="system-ui, sans-serif" fill="#8b949e">— si HIT : retourner la valeur directement (&lt; 1 ms)</text>
    <text x="75" y="244" font-family="system-ui, sans-serif" fill="#8b949e">— si MISS : passer à l'étape 2</text>
    <text x="50" y="264">2. RDS.SELECT(clé) → résultat</text>
    <text x="50" y="284">3. Cache.SET(clé, résultat, TTL=3600)</text>
  </g>
  <text x="420" y="212" fill="#3fb950" font-size="10">✓ Avantage : logique simple, contrôle applicatif du cache</text>
  <text x="420" y="232" fill="#f85149" font-size="10">⚠ Risque : cache "stale" (données anciennes) pendant le TTL</text>
  <text x="420" y="252" fill="#8b949e" font-size="9.5">Le remplissage du cache est piloté par l'application,</text>
  <text x="420" y="266" fill="#8b949e" font-size="9.5">pas par la base — d'où l'importance d'un TTL cohérent</text>
  <text x="420" y="280" fill="#8b949e" font-size="9.5">avec la fréquence réelle de mise à jour des données.</text>

  <text x="390" y="340" text-anchor="middle" fill="#8b949e" font-size="9.5" font-style="italic">4. Retour du résultat à l'application (depuis le cache si HIT, depuis RDS puis cache si MISS)</text>
</svg>
