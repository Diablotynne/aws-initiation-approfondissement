<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, sans-serif">
  <rect x="0" y="0" width="900" height="460" rx="16" fill="#0d1117"/>
  <text x="450" y="38" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">Hiérarchie de l'infrastructure mondiale AWS</text>

  <!-- Region level -->
  <rect x="60" y="70" width="780" height="330" rx="10" fill="#161b22" stroke="#8957e5" stroke-width="2"/>
  <text x="110" y="98" fill="#8957e5" font-size="15" font-weight="700">Région AWS — ex. eu-west-3 (Paris)</text>
  <text x="110" y="118" fill="#8b949e" font-size="11">Zone géographique isolée, indépendante des autres régions</text>

  <!-- AZ 1 -->
  <g>
    <rect x="90" y="140" width="220" height="200" rx="8" fill="#21262d" stroke="#3d5a80" stroke-width="2"/>
    <text x="200" y="165" text-anchor="middle" fill="#3d5a80" font-size="13" font-weight="700">Zone de disponibilité A</text>
    <rect x="105" y="180" width="80" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="145" y="209" text-anchor="middle" fill="#e6edf3" font-size="10">Datacenter 1</text>
    <rect x="195" y="180" width="80" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="235" y="209" text-anchor="middle" fill="#e6edf3" font-size="10">Datacenter 2</text>
    <text x="200" y="255" text-anchor="middle" fill="#8b949e" font-size="10">Alimentation, réseau et</text>
    <text x="200" y="270" text-anchor="middle" fill="#8b949e" font-size="10">refroidissement indépendants</text>
    <text x="200" y="310" text-anchor="middle" fill="#8b949e" font-size="10">Liaison basse latence</text>
    <text x="200" y="325" text-anchor="middle" fill="#8b949e" font-size="10">vers les autres AZ</text>
  </g>

  <!-- AZ 2 -->
  <g>
    <rect x="340" y="140" width="220" height="200" rx="8" fill="#21262d" stroke="#3d5a80" stroke-width="2"/>
    <text x="450" y="165" text-anchor="middle" fill="#3d5a80" font-size="13" font-weight="700">Zone de disponibilité B</text>
    <rect x="355" y="180" width="80" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="395" y="209" text-anchor="middle" fill="#e6edf3" font-size="10">Datacenter 1</text>
    <rect x="445" y="180" width="80" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="485" y="209" text-anchor="middle" fill="#e6edf3" font-size="10">Datacenter 2</text>
    <text x="450" y="255" text-anchor="middle" fill="#8b949e" font-size="10">Répartir sur ≥ 2 AZ =</text>
    <text x="450" y="270" text-anchor="middle" fill="#8b949e" font-size="10">haute disponibilité</text>
  </g>

  <!-- Edge locations -->
  <g>
    <rect x="590" y="140" width="220" height="200" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="700" y="165" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="700">Points de présence (Edge)</text>
    <rect x="605" y="180" width="65" height="45" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="637" y="206" text-anchor="middle" fill="#e6edf3" font-size="9">Edge 1</text>
    <rect x="680" y="180" width="65" height="45" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="712" y="206" text-anchor="middle" fill="#e6edf3" font-size="9">Edge 2</text>
    <rect x="605" y="232" width="65" height="45" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="637" y="258" text-anchor="middle" fill="#e6edf3" font-size="9">Edge 3</text>
    <rect x="680" y="232" width="65" height="45" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="712" y="258" text-anchor="middle" fill="#e6edf3" font-size="9">Edge 4</text>
    <text x="700" y="300" text-anchor="middle" fill="#8b949e" font-size="10">Rapprochent le contenu</text>
    <text x="700" y="315" text-anchor="middle" fill="#8b949e" font-size="10">des utilisateurs (CloudFront)</text>
  </g>

  <text x="450" y="430" text-anchor="middle" fill="#8b949e" font-size="12">Région ⊃ Zones de disponibilité (≥ 3 par région) ⊃ Datacenters — les Edge Locations sont hors région, au plus près des utilisateurs</text>
</svg>
