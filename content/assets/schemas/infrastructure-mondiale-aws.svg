<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Hiérarchie de l'infrastructure mondiale AWS</title><desc id="desc">Une région contient plusieurs zones de disponibilité, chaque zone regroupant un ou plusieurs centres de données. Les points de présence sont distincts des régions.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px}.region{fill:#eef3f8;stroke:#527aa3;stroke-width:3}.az{fill:#fff3df;stroke:#ff9900;stroke-width:3}.dc{fill:#fff;stroke:#68788a;stroke-width:2}.edge{fill:#e8f6ed;stroke:#2e8b57;stroke-width:3}.arrow{stroke:#527aa3;stroke-width:3;fill:none}</style>
  <text class="t" x="500" y="35" text-anchor="middle">Régions, zones de disponibilité et points de présence</text>
  <rect class="region" x="35" y="70" width="720" height="320" rx="18"/><text class="h" x="60" y="105">Région AWS</text><text class="s" x="60" y="128">Périmètre géographique choisi pour déployer les ressources régionales</text>
  <g><rect class="az" x="70" y="155" width="200" height="190" rx="14"/><text class="h" x="170" y="185" text-anchor="middle">AZ A</text><rect class="dc" x="95" y="210" width="150" height="42" rx="7"/><text class="s" x="170" y="236" text-anchor="middle">Centre(s) de données</text><rect class="dc" x="95" y="270" width="150" height="42" rx="7"/><text class="s" x="170" y="296" text-anchor="middle">Énergie et réseau</text></g>
  <g><rect class="az" x="295" y="155" width="200" height="190" rx="14"/><text class="h" x="395" y="185" text-anchor="middle">AZ B</text><rect class="dc" x="320" y="210" width="150" height="42" rx="7"/><text class="s" x="395" y="236" text-anchor="middle">Centre(s) de données</text><rect class="dc" x="320" y="270" width="150" height="42" rx="7"/><text class="s" x="395" y="296" text-anchor="middle">Isolation des pannes</text></g>
  <g><rect class="az" x="520" y="155" width="200" height="190" rx="14"/><text class="h" x="620" y="185" text-anchor="middle">AZ C</text><rect class="dc" x="545" y="210" width="150" height="42" rx="7"/><text class="s" x="620" y="236" text-anchor="middle">Centre(s) de données</text><rect class="dc" x="545" y="270" width="150" height="42" rx="7"/><text class="s" x="620" y="296" text-anchor="middle">Faible latence inter-AZ</text></g>
  <rect class="edge" x="805" y="150" width="160" height="120" rx="14"/><text class="h" x="885" y="185" text-anchor="middle">Point de présence</text><text class="s" x="885" y="215" text-anchor="middle">Cache et services</text><text class="s" x="885" y="237" text-anchor="middle">en périphérie</text><path class="arrow" d="M805 210H755"/>
  <text class="s" x="885" y="315" text-anchor="middle">Distinct d'une AZ</text><text class="s" x="885" y="338" text-anchor="middle">et d'une région</text>
</svg>
