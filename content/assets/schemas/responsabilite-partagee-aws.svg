<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Modèle de responsabilité partagée AWS selon le service</title>
  <desc id="desc">La part gérée par AWS augmente entre EC2, RDS et Lambda. Le client conserve ses données, ses identités et ses configurations.</desc>
  <defs>
    <style>.title{font:700 30px Arial,sans-serif;fill:#172f4f}.head{font:700 22px Arial,sans-serif;fill:#172f4f}.label{font:700 18px Arial,sans-serif;fill:#172f4f}.txt{font:16px Arial,sans-serif;fill:#334155}.white{font:700 17px Arial,sans-serif;fill:#fff}.grid{stroke:#cbd5e1;stroke-width:2}.client{fill:#f59e0b}.aws{fill:#2563a6}.neutral{fill:#e2e8f0}</style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Responsabilité partagée : la frontière dépend du service</text>
  <rect x="55" y="78" width="1090" height="54" rx="14" fill="#e8eef6"/>
  <text x="230" y="112" text-anchor="middle" class="head">Couche à sécuriser</text><text x="510" y="112" text-anchor="middle" class="head">Amazon EC2</text><text x="760" y="112" text-anchor="middle" class="head">Amazon RDS</text><text x="1010" y="112" text-anchor="middle" class="head">AWS Lambda</text>
  <g class="grid">
    <rect x="55" y="145" width="350" height="68" fill="#fff"/><rect x="405" y="145" width="740" height="68" class="client"/>
    <rect x="55" y="213" width="350" height="68" fill="#fff"/><rect x="405" y="213" width="740" height="68" class="client"/>
    <rect x="55" y="281" width="350" height="68" fill="#fff"/><rect x="405" y="281" width="740" height="68" class="client"/>
    <rect x="55" y="349" width="350" height="68" fill="#fff"/><rect x="405" y="349" width="240" height="68" class="client"/><rect x="645" y="349" width="500" height="68" class="aws"/>
    <rect x="55" y="417" width="350" height="68" fill="#fff"/><rect x="405" y="417" width="740" height="68" class="aws"/>
    <rect x="55" y="485" width="350" height="68" fill="#fff"/><rect x="405" y="485" width="740" height="68" class="aws"/>
    <path d="M645 145V553M895 145V553" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <g class="label"><text x="78" y="187">Données, IAM et chiffrement</text><text x="78" y="255">Configuration du service</text><text x="78" y="323">Application et code</text><text x="78" y="391">Moteur / environnement d’exécution</text><text x="78" y="459">Système hôte et virtualisation</text><text x="78" y="527">Matériel, réseau et sites physiques</text></g>
  <g class="white"><text x="525" y="187" text-anchor="middle">CLIENT</text><text x="770" y="187" text-anchor="middle">CLIENT</text><text x="1020" y="187" text-anchor="middle">CLIENT</text><text x="525" y="255" text-anchor="middle">CLIENT</text><text x="770" y="255" text-anchor="middle">CLIENT</text><text x="1020" y="255" text-anchor="middle">CLIENT</text><text x="525" y="323" text-anchor="middle">CLIENT</text><text x="770" y="323" text-anchor="middle">CLIENT</text><text x="1020" y="323" text-anchor="middle">CLIENT</text><text x="525" y="391" text-anchor="middle">CLIENT</text><text x="770" y="391" text-anchor="middle">AWS</text><text x="1020" y="391" text-anchor="middle">AWS</text><text x="525" y="459" text-anchor="middle">AWS</text><text x="770" y="459" text-anchor="middle">AWS</text><text x="1020" y="459" text-anchor="middle">AWS</text><text x="525" y="527" text-anchor="middle">AWS</text><text x="770" y="527" text-anchor="middle">AWS</text><text x="1020" y="527" text-anchor="middle">AWS</text></g>
  <rect x="65" y="590" width="24" height="24" rx="5" class="client"/><text x="101" y="608" class="txt">Sécurité dans le cloud : le client configure, contrôle et surveille.</text>
  <rect x="620" y="590" width="24" height="24" rx="5" class="aws"/><text x="656" y="608" class="txt">Sécurité du cloud : AWS protège l’infrastructure sous-jacente.</text>
  <rect x="55" y="642" width="1090" height="45" rx="12" fill="#e8eef6"/><text x="600" y="671" text-anchor="middle" class="label">Même avec un service managé, données, identités et choix de configuration restent côté client.</text>
</svg>
