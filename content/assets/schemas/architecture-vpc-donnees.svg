<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">VPC segmenté avec couche applicative et base de données</title><desc id="d">Un load balancer public reçoit le trafic. Les applications et la base RDS restent dans des subnets privés répartis sur deux zones. Les groupes de sécurité limitent les flux entre couches.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#ff9900"/></marker></defs><style>.v{fill:#10233a;stroke:#62a0d4;stroke-width:3}.s{fill:#1d3655;stroke:#79afd9;stroke-width:2}.h{fill:#ffb347;font:700 19px system-ui}.p{fill:#edf5fc;font:15px system-ui}.f{fill:none;stroke:#ff9900;stroke-width:4;stroke-dasharray:10 7;marker-end:url(#a);animation:m 2s linear infinite}@keyframes m{to{stroke-dashoffset:-34}}@media(prefers-reduced-motion:reduce){.f{animation:none}}</style><rect width="1200" height="500" rx="24" fill="#0b1728"/><rect class="v" x="170" y="35" width="980" height="420" rx="24"/><text class="h" x="205" y="72">VPC 10.0.0.0/16</text><rect class="s" x="215" y="105" width="390" height="115" rx="18"/><rect class="s" x="675" y="105" width="390" height="115" rx="18"/><text class="h" x="410" y="140" text-anchor="middle">Subnets publics</text><text class="p" x="410" y="178" text-anchor="middle">ALB · route vers Internet Gateway</text><text class="h" x="870" y="140" text-anchor="middle">Subnets applicatifs privés</text><text class="p" x="870" y="178" text-anchor="middle">EC2 · sortie éventuelle via NAT</text><rect class="s" x="445" y="285" width="430" height="115" rx="18"/><text class="h" x="660" y="325" text-anchor="middle">Subnets de données privés</text><text class="p" x="660" y="362" text-anchor="middle">RDS Multi-AZ · accès depuis le SG applicatif</text><rect class="s" x="25" y="165" width="110" height="90" rx="15"/><text class="h" x="80" y="205" text-anchor="middle">Internet</text><path class="f" d="M135 210H215M605 163H675M870 220Q850 285 805 285"/><text class="p" x="1040" y="430" text-anchor="end">Le routage transporte ; les groupes de sécurité autorisent.</text></svg>
