<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">Évaluation d'une requête AWS par IAM</title><desc id="d">Une requête authentifiée est évaluée avec les politiques applicables. Un refus explicite prévaut, sinon une autorisation explicite est nécessaire.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#ff9900"/></marker></defs><style>.b{fill:#142640;stroke:#75a7d8;stroke-width:2}.t{fill:#ffb347;font:700 21px system-ui}.p{fill:#eaf2fb;font:16px system-ui}.f{fill:none;stroke:#ff9900;stroke-width:4;stroke-dasharray:10 7;marker-end:url(#a);animation:m 1.8s linear infinite}@keyframes m{to{stroke-dashoffset:-34}}@media(prefers-reduced-motion:reduce){.f{animation:none}}</style>
<rect width="1200" height="430" rx="24" fill="#0f1b2e"/><path class="f" d="M220 150H315M505 150H600"/><path class="f" d="M790 150H900"/><g class="b"><rect x="35" y="90" width="185" height="120" rx="18"/><rect x="315" y="90" width="190" height="120" rx="18"/><rect x="600" y="70" width="190" height="160" rx="18"/><rect x="900" y="45" width="250" height="105" rx="18"/><rect x="900" y="185" width="250" height="105" rx="18"/></g>
<text class="t" x="127" y="130" text-anchor="middle">Principal</text><text class="p" x="127" y="165" text-anchor="middle">utilisateur · rôle</text><text class="t" x="410" y="130" text-anchor="middle">Requête</text><text class="p" x="410" y="165" text-anchor="middle">action · ressource</text><text class="t" x="695" y="115" text-anchor="middle">Évaluation</text><text class="p" x="695" y="150" text-anchor="middle">politiques IAM</text><text class="p" x="695" y="178" text-anchor="middle">SCP · conditions</text><text class="t" x="1025" y="87" text-anchor="middle">Refus</text><text class="p" x="1025" y="120" text-anchor="middle">Deny explicite</text><text class="t" x="1025" y="227" text-anchor="middle">Autorisation</text><text class="p" x="1025" y="260" text-anchor="middle">Allow explicite</text><path d="M790 145Q845 90 900 95" class="f"/><path d="M790 160Q845 230 900 235" class="f"/><text class="p" x="600" y="360" text-anchor="middle">Sans autorisation explicite, la décision par défaut est le refus.</text>
