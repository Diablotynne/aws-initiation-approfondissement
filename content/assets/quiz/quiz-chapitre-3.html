<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz interactif — Chapitre 3</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;background:#111827;color:#eef4fb}.quiz{max-width:900px;margin:auto;padding:1.2rem}.top{display:flex;justify-content:space-between;gap:1rem;color:#9fb2c8}.bar{height:7px;background:#2d3b4e;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#ff9900;transition:width .25s}.card{margin-top:1rem;padding:1.25rem;border:1px solid #40516a;border-radius:14px;background:#182337}.card h2{font-size:1.15rem;color:#ffb347}.prompt{font-size:1.05rem;line-height:1.5}.options{display:grid;gap:.65rem}.option{width:100%;padding:.8rem 1rem;text-align:left;border:1px solid #52657e;border-radius:10px;background:#223149;color:#fff;cursor:pointer}.option:hover{border-color:#ff9900}.option.selected{outline:2px solid #ff9900}.option.correct{border-color:#43d17e;background:#123827}.option.wrong{border-color:#ff637d;background:#401c27}.option:disabled{cursor:default}.feedback{display:none;margin-top:1rem;padding:1rem;border-radius:10px;line-height:1.5}.feedback.show{display:block}.feedback.ok{background:#123827}.feedback.ko{background:#401c27}.validate{margin-top:1rem;padding:.7rem 1.1rem;border:0;border-radius:9px;background:#ff9900;color:#111;font-weight:700;cursor:pointer}.result{display:none;text-align:center;margin-top:1rem;padding:1.5rem;border:1px solid #40516a;border-radius:14px;background:#182337}.result.show{display:block}.restart{padding:.75rem 1rem;border:0;border-radius:9px;background:#ff9900;font-weight:700;cursor:pointer}
</style></head><body><main class="quiz"><div class="top"><strong>Quiz du chapitre 3</strong><span id="progress">0 / 10 réponses</span></div><div class="bar"><span id="bar" style="width:0"></span></div><div id="questions"></div><section class="result" id="result" aria-live="polite"></section></main>
<script>
const questions=[{"number": 1, "title": "Classe de stockage S3 (1 point)", "prompt": "FormaTech conserve des vidéos d'archives consultées en moyenne moins d'une fois par mois, dans un contexte où une perte de données due à une défaillance de zone de disponibilité est acceptable (les vidéos peuvent être reconstituées depuis les originaux). Quelle classe de stockage S3 offre le meilleur rapport coût/usage pour ce scénario ?", "options": [{"key": "A", "text": "S3 Standard"}, {"key": "B", "text": "S3 Standard-IA (Infrequent Access)"}, {"key": "C", "text": "S3 One Zone-IA"}, {"key": "D", "text": "S3 Glacier Flexible Retrieval"}], "correct": ["C"], "explanation": "— S3 One Zone-IA Explication : S3 One Zone-IA est la classe la plus économique (~0,01 $/Go/mois) pour des données : - Accédées rarement (moins d'une fois par mois — critère Infrequent Access) - Reconstituables en cas de perte (la donnée n'existe que dans une seule AZ, sans redondance multi-AZ) Pourquoi pas les autres ? - A (Standard) : 0,023 $/Go/mois — trop cher pour des données rarement consultées - B (Standard-IA) : 0,0125 $/Go/mois — correct pour les données rares, mais redondance 3 AZ (coût plus élevé que One Zone-IA sans bénéfice si la donnée est reproductible) - D (Glacier Flexible) : adapté si la récupération peut attendre 1-12 heures. Pour des vidéos \"accessibles à la demande\", même si rares, la latence Glacier est trop longue Piège : Si la perte de données n'est PAS acceptable, choisir Standard-IA (3 AZ) plutôt que One Zone-IA."}, {"number": 2, "title": "Taille maximale S3 (1 point)", "prompt": "Un ingénieur FormaTech tente d'uploader un fichier de 6 Gio dans un bucket S3 en utilisant la commande aws s3 cp. L'upload se termine avec succès. Quelle affirmation est vraie concernant cet upload ?", "options": [{"key": "A", "text": "L'upload a échoué car la limite par objet est 5 Gio"}, {"key": "B", "text": "L'upload a réussi car la CLI AWS gère automatiquement le Multipart Upload pour les fichiers > 5 Gio"}, {"key": "C", "text": "L'upload a réussi car la limite S3 est 5 Tio par objet, et 6 Gio est en dessous"}, {"key": "D", "text": "L'upload a réussi car la CLI a automatiquement compressé le fichier avant l'envoi"}], "correct": ["B"], "explanation": "— La CLI gère automatiquement le Multipart Upload Explication : - La limite pour un upload direct (PutObject API) est 5 Gio. Au-delà, il faut utiliser le Multipart Upload. - La CLI AWS (aws s3 cp) gère automatiquement le Multipart Upload pour les fichiers dépassant un seuil (par défaut 8 Mo, configurable). - La limite maximale d'un objet S3 est 5 Tio (5 120 Gio) via Multipart Upload. Pourquoi pas les autres ? - A : Faux — 6 Gio < 5 Tio, donc pas de dépassement de la limite maximale objet. Le problème serait si on utilisait l'API PutObject directement (limite 5 Gio), mais la CLI abstrait cela. - C : Vrai que la limite objet est 5 Tio, mais ce n'est pas la raison principale du succès. La raison est que la CLI utilise Multipart Upload. - D : Faux — La CLI ne compresse pas les données."}, {"number": 3, "title": "Famille d'instance EC2 pour mémoire (1 point)", "prompt": "FormaTech envisage de migrer sa base de données in-memory Redis sur EC2. Les métriques montrent que Redis nécessite 120 Gio de RAM avec un usage CPU modéré. Quelle famille d'instances EC2 est la plus adaptée ?", "options": [{"key": "A", "text": "Famille c (Compute Optimized)"}, {"key": "B", "text": "Famille m (General Purpose)"}, {"key": "C", "text": "Famille r (Memory Optimized)"}, {"key": "D", "text": "Famille i (Storage Optimized)"}], "correct": ["C"], "explanation": "— Famille r (Memory Optimized) Explication : La famille r (r = RAM) est optimisée pour les workloads à haute densité mémoire : - Ratio mémoire/vCPU élevé (8 Gio/vCPU vs 4 Gio/vCPU pour la famille m) - Exemples : r7g.4xlarge (16 vCPU / 128 Gio RAM), r6i.8xlarge (32 vCPU / 256 Gio RAM) Pourquoi pas les autres ? - A (c) : Optimisée CPU, ratio RAM faible — inadaptée pour Redis 120 Gio - B (m) : Généraliste, ratio équilibré — possible mais moins efficace en coût pour 120 Gio RAM - D (i) : Optimisée stockage local NVMe — inadaptée (Redis est en RAM, pas sur disque) Mnémotechnique : r = RAM, c = CPU, m = middleground, i = I/O stockage"}, {"number": 4, "title": "On-Demand vs Spot (1 point)", "prompt": "FormaTech doit encoder 500 vidéos HD chaque nuit (tâche de 3h, automatisée, relançable en cas d'échec). L'équipe hésite entre des instances On-Demand et des instances Spot. Parmi les affirmations suivantes, laquelle est correcte ?", "options": [{"key": "A", "text": "Les instances Spot sont toujours disponibles et offrent jusqu'à 90 % de réduction vs On-Demand"}, {"key": "B", "text": "Les instances Spot peuvent être interrompues par AWS avec un préavis de 2 minutes et offrent jusqu'à 90 % de réduction vs On-Demand ; elles sont adaptées aux workloads fault-tolerant comme l'encodage vidéo"}, {"key": "C", "text": "Les instances Spot ont un engagement minimum de 1 an"}, {"key": "D", "text": "Les instances Spot ne peuvent pas être utilisées avec les types d'instances de la famille c (Compute Optimized)"}], "correct": ["B"], "explanation": "Explication complète : - Les instances Spot offrent jusqu'à 90 % de réduction vs On-Demand en utilisant la capacité EC2 non utilisée. - AWS peut interrompre (récupérer) une instance Spot avec un préavis de 2 minutes via l'Instance Metadata. - Elles sont idéales pour les workloads fault-tolerant et interruptibles : encodage vidéo (relançable), batch processing, CI/CD, big data. - L'encodage de 500 vidéos nocturnes est un cas d'usage parfait pour Spot : si une instance est récupérée, la tâche reprend sur une autre instance. Pourquoi pas les autres ? - A : Faux — les Spot ne sont pas toujours disponibles (dépend de la capacité AWS). La réduction de 90 % est correcte. - C : Faux — Spot n'a pas d'engagement minimum. L'engagement 1/3 ans concerne les Reserved Instances. - D : Faux — Spot est disponible pour toutes les familles d'instances, y compris c (Compute Optimized), particulièrement adaptée à l'encodage vidéo."}, {"number": 5, "title": "Contenu d'une AMI (1 point)", "prompt": "Un stagiaire FormaTech affirme qu'une AMI (Amazon Machine Image) contient uniquement l'image disque du système d'exploitation, sans les paramètres réseau. Parmi les éléments suivants, lequel est réellement inclus dans une AMI ?", "options": [{"key": "A", "text": "Un snapshot EBS du volume racine (OS + logiciels installés) et le block device mapping associé"}, {"key": "B", "text": "La configuration du Security Group attaché à l'instance"}, {"key": "C", "text": "L'adresse IP Elastic associée à l'instance source"}, {"key": "D", "text": "Les identifiants IAM du rôle attaché à l'instance"}], "correct": ["A"], "explanation": "Explication : Une AMI contient le snapshot EBS du volume racine (l'OS, les logiciels pré-installés, les configurations) et le block device mapping associé (quels volumes EBS créer/attacher au lancement, avec taille, type et paramètre DeleteOnTermination) — c'est le cœur de l'AMI. Ce que l'AMI ne contient PAS : - B) Security Group : le SG est configuré au moment du lancement de l'instance, pas dans l'AMI - C) Elastic IP : les EIP sont des ressources indépendantes associées à l'instance, pas à l'AMI - D) Rôle IAM : le rôle IAM est attaché à l'instance au lancement, il ne fait pas partie de l'AMI elle-même Note formateur : Cette question vise à distinguer les éléments définis dans l'AMI (template) de ceux définis au lancement (Security Group, EIP, IAM Role…)."}, {"number": 6, "title": "Auto Scaling (1 point)", "prompt": "La plateforme FormaTech subit un pic de charge chaque lundi matin à 8h00 lorsque 2 000 apprenants se connectent simultanément. L'équipe ops veut anticiper ce pic automatiquement. Quel mécanisme Auto Scaling est le plus adapté pour anticiper (et non simplement réagir à) ce pic prévisible ?", "options": [{"key": "A", "text": "Target Tracking Scaling (CPU cible 70 %)"}, {"key": "B", "text": "Step Scaling (règles par paliers de CPU)"}, {"key": "C", "text": "Scheduled Scaling (action planifiée le lundi à 7h45)"}, {"key": "D", "text": "Predictive Scaling uniquement (pas d'autre option)"}], "correct": ["C"], "explanation": "— Scheduled Scaling Explication : - Le Scheduled Scaling permet de définir une action à un horaire précis (cron expression ou datetime). Exemple : chaque lundi à 7h45, passer Desired=4. - Il anticipe la charge avant qu'elle n'arrive, sans attendre que le CPU monte (ce que fait Target Tracking). Pourquoi pas les autres ? - A (Target Tracking) : réagit après que la métrique (CPU) dépasse le seuil. Il y a un délai de réaction de 5-10 minutes → trop tard pour le pic de 8h - B (Step Scaling) : même problème — réactif, pas proactif - D (Predictive Scaling uniquement) : Predictive Scaling peut aussi anticiper via ML, mais la question demande le mécanisme \"le plus adapté\" pour un pic connu et récurrent → Scheduled est plus simple et fiable Bonne pratique : Combiner Scheduled Scaling (proactif pour les pics connus) + Target Tracking (réactif pour les variations imprévisibles)."}, {"number": 7, "title": "Type de Load Balancer (1 point)", "prompt": "FormaTech déploie une architecture web composée de : - /api/* → backend Node.js (port 3000) - /static/* → serveurs Apache statiques (port 80) - /admin/* → interface Django réservée aux formateurs (port 8000) Quel type de Load Balancer AWS permet de router les requêtes vers différents Target Groups selon le chemin URL (path-based routing) ?", "options": [{"key": "A", "text": "NLB (Network Load Balancer) — couche L4"}, {"key": "B", "text": "ALB (Application Load Balancer) — couche L7"}, {"key": "C", "text": "GWLB (Gateway Load Balancer) — couche L3/L4"}, {"key": "D", "text": "CLB (Classic Load Balancer) — ancienne génération"}], "correct": ["B"], "explanation": "— ALB (Application Load Balancer) Explication : - L'ALB opère au niveau L7 (application) du modèle OSI. Il comprend le contenu HTTP/HTTPS et peut router selon : - Le chemin URL (/api/*, /static/*) — path-based routing - Le nom d'hôte (api.formateach.fr, www.formateach.fr) — host-based routing - Les headers HTTP, query strings, méthodes HTTP - Parfait pour l'architecture FormaTech décrite. Pourquoi pas les autres ? - A (NLB) : couche L4 — voit seulement les IP et ports TCP/UDP, ne comprend pas les URLs HTTP - C (GWLB) : pour les appliances réseau inline (firewalls, IDS/IPS) — pas pour le routage applicatif - D (CLB) : ancienne génération, déprécié. Routage basique L4+L7 limité, pas de path-based routing avancé"}, {"number": 8, "title": "Pre-signed URL S3 (1 point)", "prompt": "FormaTech veut permettre à des apprenants sans compte AWS de télécharger temporairement une vidéo stockée dans un bucket privé S3. Quelle affirmation sur les Pre-signed URLs S3 est correcte ?", "options": [{"key": "A", "text": "Seul le compte root AWS peut générer des Pre-signed URLs"}, {"key": "B", "text": "N'importe quel utilisateur IAM ou rôle IAM ayant les permissions s3:GetObject sur l'objet peut générer une Pre-signed URL pour cet objet"}, {"key": "C", "text": "Les Pre-signed URLs sont valables au maximum 60 minutes"}, {"key": "D", "text": "Une Pre-signed URL nécessite que le bucket soit public pour fonctionner"}], "correct": ["B"], "explanation": "Explication : - N'importe quel principal IAM (utilisateur IAM, rôle IAM, etc.) ayant la permission s3:GetObject sur l'objet peut générer une Pre-signed URL pour cet objet. - La Pre-signed URL \"délègue\" temporairement les permissions du signataire au détenteur de l'URL. Pourquoi pas les autres ? - A : Faux — le compte root peut générer des Pre-signed URLs, mais n'est pas le seul. Tout principal IAM autorisé peut le faire. - C : Faux — la durée maximale est de 7 jours (604 800 secondes) pour les credentials utilisateur IAM. Pour les credentials de rôle IAM (sessions temporaires), la durée est limitée à la durée de vie du token (max 12h par défaut pour les rôles EC2). - D : Faux — le bucket peut rester privé. C'est justement l'intérêt des Pre-signed URLs : accorder un accès temporaire à un objet privé sans le rendre public."}, {"number": 9, "title": "Volume EBS pour boot SSD haute performance (1 point)", "prompt": "L'équipe FormaTech doit choisir un type de volume EBS pour le volume racine (boot) d'un serveur de base de données MySQL nécessitant 8 000 IOPS garantis et 300 MiB/s de débit. Quel type de volume EBS est le plus adapté ?", "options": [{"key": "A", "text": "st1 (Throughput Optimized HDD)"}, {"key": "B", "text": "sc1 (Cold HDD)"}, {"key": "C", "text": "gp3 (General Purpose SSD) configuré à 8 000 IOPS et 300 MiB/s"}, {"key": "D", "text": "gp2 (General Purpose SSD ancienne génération)"}], "correct": ["C"], "explanation": "— gp3 configuré à 8 000 IOPS et 300 MiB/s Explication : - gp3 est la génération actuelle recommandée pour les volumes SSD à usage général. Ses capacités : - IOPS : de 3 000 (baseline inclus dans le prix) jusqu'à 16 000 IOPS (provisionnables, facturés séparément) - Débit : de 125 MiB/s (baseline) jusqu'à 1 000 MiB/s (provisionnable) - Peut être utilisé comme volume boot - 8 000 IOPS et 300 MiB/s sont dans les limites de gp3 → bon choix Pourquoi pas les autres ? - A (st1) : HDD Throughput Optimized — ne peut pas être un volume boot. Max 500 IOPS, adapté aux lectures séquentielles (Big Data), pas aux bases de données - B (sc1) : HDD Cold — ne peut pas être un volume boot. Max 250 IOPS, pour les données froides uniquement - D (gp2) : ancienne génération. Les IOPS sont liées à la taille (3 IOPS/Go, max 16 000). Pour 8 000 IOPS, il faudrait ~2 700 Go de volume gp2 (versus n'importe quelle taille avec gp3). gp3 est moins cher et plus flexible. Quand choisir io2 ? Si les IOPS requises dépassent 16 000 (jusqu'à 256 000 avec io2 Block Express) ou si la cohérence des IOPS est critique (SLA garanti)."}, {"number": 10, "title": "Données EBS après terminaison EC2 (1 point)", "prompt": "Un développeur FormaTech exécute la commande suivante en fin de journée : ```bash aws ec2 terminate-instances --instance-ids i-0abc123def456789 --region eu-west-3 ``` L'instance avait été lancée avec la configuration par défaut (pas de modification du DeleteOnTermination). L'instance avait 2 volumes EBS : le volume racine (/dev/xvda) et un volume de données supplémentaire (/dev/sdf) attaché ultérieurement via la Console avec DeleteOnTermination=false. Que se passe-t-il aux deux volumes EBS ? Contexte : FormaTech a migré 500 Go de contenus pédagogiques dans S3. Le responsable technique remarque que la facture S3 augmente de mois en mois, malgré un nombre de fichiers stable. Question : Citez deux raisons techniques possibles qui expliqueraient cette augmentation des coûts S3, et proposez une action corrective pour chacune. *(Réponse libre, 5-10 lignes.)*", "options": [{"key": "A", "text": "Les deux volumes sont supprimés immédiatement avec l'instance"}, {"key": "B", "text": "Les deux volumes sont conservés et disponibles dans EC2 → Volumes"}, {"key": "C", "text": "Le volume racine est supprimé (DeleteOnTermination=true par défaut), le volume de données est conservé (DeleteOnTermination=false)"}, {"key": "D", "text": "Les deux volumes sont convertis en snapshots automatiquement"}], "correct": ["C"], "explanation": "— Volume racine supprimé, volume de données conservé Explication : La valeur par défaut de DeleteOnTermination dépend de comment le volume a été associé : | Volume | Comment attaché | DeleteOnTermination par défaut | Résultat à la terminaison | |---|---|---|---| | Volume racine (/dev/xvda) | Au lancement (défini dans le Launch Template / Console) | true | Supprimé | | Volume de données (/dev/sdf) | Attaché ultérieurement via Console/CLI | false | Conservé | Dans notre scénario : - Volume racine : DeleteOnTermination=true par défaut → supprimé - Volume de données attaché manuellement : DeleteOnTermination=false par défaut → conservé (reste disponible dans EC2 → Volumes, état \"available\") Pourquoi pas les autres ? - A : Faux — le volume de données est conservé (DeleteOnTermination=false) - B : Faux — le volume racine est supprimé (DeleteOnTermination=true par défaut) - D : Faux — AWS ne crée pas de snapshots automatiquement à la terminaison. Vous devez le faire manuellement ou via Data Lifecycle Manager. Conseil : Vérifier toujours la valeur de DeleteOnTermination avant de terminer une instance, surtout si des données importantes se trouvent sur le volume racine."}];let score=0,answered=0;
function render(){const root=document.querySelector('#questions');root.innerHTML=questions.map((q,i)=>{const multiple=q.correct.length>1;const options=[...q.options].sort((a,b)=>a.key.localeCompare(b.key));return `<section class="card" data-index="${i}"><h2>Question ${i+1} — ${q.title}</h2><p class="prompt">${q.prompt}</p>${multiple?'<p><em>Plusieurs réponses sont attendues.</em></p>':''}<div class="options">${options.map(o=>`<button class="option" data-key="${o.key}"><strong>${o.key}</strong> — ${o.text}</button>`).join('')}</div>${multiple?'<button class="validate">Valider mes choix</button>':''}<div class="feedback" aria-live="polite"></div></section>`}).join('');root.querySelectorAll('.card').forEach(card=>{const q=questions[Number(card.dataset.index)],multiple=q.correct.length>1;card.querySelectorAll('.option').forEach(button=>button.addEventListener('click',()=>multiple?button.classList.toggle('selected'):validate(card,q,[button.dataset.key])));if(multiple)card.querySelector('.validate').addEventListener('click',()=>{const selected=[...card.querySelectorAll('.option.selected')].map(b=>b.dataset.key);if(selected.length)validate(card,q,selected)})})}
function validate(card,q,selected){if(card.dataset.answered)return;card.dataset.answered='true';const chosen=[...selected].sort(),expected=[...q.correct].sort(),isOk=JSON.stringify(chosen)===JSON.stringify(expected);if(isOk)score++;answered++;card.querySelectorAll('.option').forEach(button=>{button.disabled=true;if(q.correct.includes(button.dataset.key))button.classList.add('correct');else if(chosen.includes(button.dataset.key))button.classList.add('wrong')});const validateButton=card.querySelector('.validate');if(validateButton)validateButton.disabled=true;const feedback=card.querySelector('.feedback');feedback.className=`feedback show ${isOk?'ok':'ko'}`;feedback.innerHTML=`<strong>${isOk?'Bonne réponse':'Réponse incorrecte'}.</strong> Réponse${q.correct.length>1?'s':''} attendue${q.correct.length>1?'s':''} : ${q.correct.join(', ')}.<br>${q.explanation}`;document.querySelector('#progress').textContent=`${answered} / ${questions.length} réponses`;document.querySelector('#bar').style.width=`${answered/questions.length*100}%`;if(answered===questions.length)showResult()}
function showResult(){const result=document.querySelector('#result');result.classList.add('show');result.innerHTML=`<h2>Résultat : ${score} / ${questions.length}</h2><p>${score>=8?'Les notions essentielles sont maîtrisées.':score>=6?'Relisez les explications des réponses manquées.':'Reprenez le chapitre et retentez le quiz.'}</p><button class="restart" onclick="location.reload()">Recommencer le quiz</button>`}
render();
</script></body></html>
